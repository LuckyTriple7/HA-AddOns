configuration:
  username:
    name: Benutzername
    description: Benutzername für den Login.
  password:
    name: Passwort
    description: Passwort für den Login.
  session_hours:
    name: Session-Dauer (Stunden)
    description: Wie viele Stunden eine Login-Session gültig bleibt, bevor eine erneute Anmeldung nötig ist.
  poll_interval:
    name: Abfrageintervall (Sekunden)
    description: Wie oft der Online-Status der Dienste geprüft wird. Minimum 5 Sekunden, Standard 30 Sekunden.
  sites:
    name: Web-Dienste
    description: Liste der konfigurierten Web-Dienste (max. 10) mit Name, Host-IP, Port, Icon und Aktivierungsstatus.
