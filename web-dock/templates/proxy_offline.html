<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ name }} – {{ t.offline_title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --text: #e6edf3; --text-muted: #7d8590;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      min-height: 100svh; display: flex; align-items: center;
      justify-content: center; padding: 1rem;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem 2rem; max-width: 360px;
      width: 100%; text-align: center;
    }
    .icon {
      width: 64px; height: 64px; border-radius: 16px;
      background: #ef4444; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 1.25rem;
    }
    .icon svg { width: 32px; height: 32px; fill: #fff; }
    h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: .5rem; }
    p  { color: var(--text-muted); font-size: .9rem; line-height: 1.5; margin-bottom: 1.75rem; }
    a  {
      display: inline-flex; align-items: center; gap: .5rem;
      background: #3b82f6; color: #fff; text-decoration: none;
      padding: .65rem 1.4rem; border-radius: 8px;
      font-size: .9rem; font-weight: 600;
      transition: filter .15s;
    }
    a:hover { filter: brightness(1.1); }
    a svg { width: 16px; height: 16px; fill: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    </div>
    <h1>{{ name }} – {{ t.offline_title }}</h1>
    <p>{{ t.offline_body }}</p>
    <a href="/"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>{{ t.back_to_portal }}</a>
  </div>
</body>
</html>
