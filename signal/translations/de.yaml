configuration:
  dark_mode:
    name: Dunkles Theme
    description: Dunkles Theme in der Web-UI aktivieren.
  native_mode:
    name: Nativer Modus
    description: "Nativen signal-cli-Binary verwenden (niedrige CPU-Last). Deaktivieren für Java-Modus — nur auf nicht unterstützter Hardware nötig. Empfehlung: aktiviert."
  download_media:
    name: Medien herunterladen
    description: Empfangene Fotos automatisch herunterladen und anzeigen. Funktioniert nur zuverlässig bei neu eingehenden Nachrichten, nicht für historische Nachrichten.
  media_max_mb:
    name: Medienspeicher-Limit (MB)
    description: "Maximale Größe des Medienordners in MB. Wird das Limit überschritten, werden automatisch die ältesten Dateien (Fotos, Sprachnachrichten) gelöscht, bis der Ordner wieder auf 80 % des Limits schrumpft. Standard: 500 MB."
  phone_number:
    name: Telefonnummer
    description: Deine Signal-Telefonnummer mit Ländervorwahl (z.B. +4917612345678). Optional — wird nach der Verknüpfung automatisch erkannt.
  webhook_incoming:
    name: Webhook-URL
    description: URL für eingehende Nachrichten (z.B. http://homeassistant:8123/api/webhook/signal).
  debug_mode:
    name: Debug-Modus
    description: Ausführliches Logging inkl. GIN-Access-Logs aktivieren. Nützlich für die Fehlersuche.
  ha_notifications:
    name: HA-Benachrichtigungen
    description: Persistente HA-Benachrichtigung bei neuen Nachrichten (eine pro Chat, wird von neueren Nachrichten überschrieben).
  ha_notifications_privacy:
    name: HA-Benachrichtigungen Datenschutzmodus
    description: Zeigt nur „Signal / Neue Nachricht" an — kein Absendername, kein Nachrichteninhalt.
