name: Signal
description: Signal Messenger mit persistenter Session, Web-UI, REST-API und Webhook für Home Assistant
version: "1.5.12"
image: "ghcr.io/luckytriple7/signal"
slug: signal
url: https://github.com/LuckyTriple7/HA-AddOns

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

map:
  - addon_config:rw

ingress: true
ingress_port: 17777
panel_icon: phu:signal
panel_title: Signal

ports:
  17777/tcp: 17777

ports_description:
  17777/tcp: Signal Web-UI und REST-API

options:
  dark_mode: false
  native_mode: true
  download_media: false
  phone_number: ""
  webhook_incoming: ""
  debug_mode: false
  ha_notifications: false
  ha_notifications_privacy: false
  ha_token: ""

schema:
  dark_mode: bool
  native_mode: bool
  download_media: bool
  phone_number: str?
  webhook_incoming: str?
  debug_mode: bool
  ha_notifications: bool
  ha_notifications_privacy: bool
  ha_token: str?
