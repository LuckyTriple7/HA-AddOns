name: Signal
description: Signal Messenger mit persistenter Session, Web-UI, REST-API und Webhook für Home Assistant
version: "1.0.4"
slug: signal
url: https://github.com/LuckyTriple7/HA-AddOns

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

ingress: true
ingress_port: 3002
panel_icon: mdi:signal
panel_title: Signal

ports:
  3002/tcp: 3002

ports_description:
  3002/tcp: Signal Web-UI und REST-API

options:
  phone_number: ""
  webhook_incoming: ""

schema:
  phone_number: str?
  webhook_incoming: str?
