name: Signal
description: Signal Messenger mit persistenter Session, Web-UI, REST-API und Webhook für Home Assistant
version: "1.6.29"
image: "ghcr.io/luckytriple7/signal"
slug: signal
url: https://github.com/LuckyTriple7/HA-AddOns

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: true
watchdog: "tcp://[HOST]:17777"

map:
  - app_config:rw

ingress: true
ingress_port: 17777
panel_icon: phu:signal
panel_title: Signal

ports:
  17777/tcp: null
  17787/tcp: null

ports_description:
  17777/tcp: >-
    Web-UI und REST-API ohne Authentifizierung - wer den Port erreicht, kann
    mitlesen und senden. Standardmaessig zu; der Zugang laeuft ueber Ingress
    oder das MessengerPortal. Nur freigeben, wenn du weisst warum.
  17787/tcp: >-
    REST-API mit Token - nur /api/*, keine Oberflaeche. Braucht zusaetzlich
    die Optionen "REST-API auf eigenem Port" und "API-Token".

homeassistant_api: true

options:
  api_enabled: false
  api_token: ""
  dark_mode: false
  native_mode: true
  download_media: false
  media_max_mb: 500
  phone_number: ""
  webhook_incoming: ""
  debug_mode: false
  ha_notifications: false
  ha_notifications_privacy: false

schema:
  api_enabled: bool
  api_token: password?
  dark_mode: bool
  native_mode: bool
  download_media: bool
  media_max_mb: int?
  phone_number: str?
  webhook_incoming: str?
  debug_mode: bool
  ha_notifications: bool
  ha_notifications_privacy: bool
