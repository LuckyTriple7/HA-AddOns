<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardBoard Admin</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <style>
    :root {
      --bg:         #111827;
      --bg-surface: #1f2937;
      --border:     #374151;
      --text:       #e5e7eb;
      --text-muted: #9ca3af;
      --accent:     #3b82f6;
      --error:      #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 40px;
      width: 100%;
      max-width: 380px;
    }
    .logo { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
    .sub  { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 28px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    input[type=password] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 13px;
      color: var(--text);
      font-size: 0.93rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type=password]:focus { border-color: var(--accent); }
    .btn {
      margin-top: 18px;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 0.93rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .error-msg {
      margin-top: 14px;
      background: rgba(239,68,68,0.12);
      border: 1px solid var(--error);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 0.82rem;
      color: var(--error);
      display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📋 CardBoard</div>
    <div class="sub">Admin-Panel</div>
    <form method="post">
      <label for="pw" id="label-pw">Admin-Passwort</label>
      <input type="password" id="pw" name="password" autofocus autocomplete="current-password">
      <button class="btn" type="submit" id="btn-login">Anmelden</button>
    </form>
    <div class="error-msg" id="err">Falsches Passwort.</div>
  </div>
  <script>
    const i18n = {
      de: { label: 'Admin-Passwort', btn: 'Anmelden',  err: 'Falsches Passwort.' },
      en: { label: 'Admin Password', btn: 'Sign in',   err: 'Incorrect password.' },
    };
    const lang = (navigator.language || 'de').startsWith('de') ? 'de' : 'en';
    const t = i18n[lang];
    document.documentElement.lang = lang;
    document.getElementById('label-pw').textContent = t.label;
    document.getElementById('btn-login').textContent = t.btn;
    document.getElementById('err').textContent = t.err;

    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('err').classList.add('visible');
    }
  </script>
</body>
</html>
