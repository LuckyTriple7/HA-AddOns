<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardBoard</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #111827;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: #1f2937;
      border-bottom: 1px solid #374151;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f9fafb;
    }

    .user-badge {
      font-size: 0.72rem;
      color: #6b7280;
      background: #111827;
      border-radius: 20px;
      padding: 3px 10px;
      border: 1px solid #374151;
    }

    .welcome-msg {
      font-size: 0.82rem;
      color: #9ca3af;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .clock {
      font-size: 0.88rem;
      font-weight: 600;
      color: #d1d5db;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    .refresh-info {
      font-size: 0.75rem;
      color: #4b5563;
    }

    .logout-btn {
      background: #374151;
      color: #d1d5db;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }

    .logout-btn:hover { background: #4b5563; color: #f9fafb; }

    /* ── Cards ───────────────────────────────────────── */
    .cards-container {
      display: flex;
      gap: 16px;
      padding: 18px;
      flex: 1;
      align-items: flex-start;
    }

    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 20px 24px;
      flex: 1;
      min-width: 0;
      /* Monospace + pre-wrap: sorgt dafür dass Leerzeichen-Ausrichtung erhalten bleibt */
      font-family: ui-monospace, "Cascadia Code", "Fira Mono", Consolas, monospace;
      font-size: 0.875rem;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    /* Markdown-Elemente innerhalb der Karte */
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6b7280;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #374151;
    }

    .card p   { margin: 0; }
    .card br  { display: block; content: ""; }

    .card h1, .card h2, .card h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #60a5fa;
      white-space: normal;
      margin: 0.5em 0 0.2em;
    }
    .card h1 { font-size: 1.1rem; }
    .card h2 { font-size: 1rem;   }
    .card h3 { font-size: 0.93rem; }

    .card strong { color: #fbbf24; font-weight: 700; }
    .card em     { color: #a78bfa; font-style: italic; }

    .card a          { color: #3b82f6; text-decoration: none; }
    .card a:hover    { text-decoration: underline; }

    .card code {
      background: #111827;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.85em;
      font-family: inherit;
    }

    .card pre {
      background: #111827;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      white-space: pre;
      margin: 0.4em 0;
    }
    .card pre code { background: none; padding: 0; }

    .card table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.4em 0;
      white-space: normal;
      font-family: inherit;
    }
    .card th, .card td {
      border: 1px solid #374151;
      padding: 5px 10px;
      text-align: left;
    }
    .card th { background: #111827; color: #9ca3af; font-weight: 600; }

    .card hr {
      border: none;
      border-top: 1px solid #374151;
      margin: 0.6em 0;
    }

    .card ul, .card ol {
      padding-left: 1.4em;
      white-space: normal;
    }

    /* ── Footer ──────────────────────────────────────── */
    footer {
      border-top: 1px solid #1f2937;
      padding: 7px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: #374151;
      flex-shrink: 0;
    }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 800px) {
      .cards-container { flex-direction: column; }
      .refresh-info    { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <span>📋</span>
      <h1>CardBoard</h1>
      <span class="user-badge" id="username-badge"></span>
      <span class="welcome-msg" id="welcome-msg"></span>
    </div>
    <div class="header-right">
      <span class="clock" id="clock"></span>
      <span class="refresh-info" id="refresh-info"></span>
      <a href="/logout" class="logout-btn" id="logout-btn">Abmelden</a>
    </div>
  </header>

  <div class="cards-container" id="cards">
    <div style="color:#4b5563; padding:40px; width:100%; text-align:center; font-family:sans-serif;">
      Daten werden geladen…
    </div>
  </div>

  <footer>
    <span id="last-update"></span>
    <span>CardBoard</span>
  </footer>

  <script>
    marked.use({ breaks: true, gfm: true });

    const i18n = {
      de: {
        hello:   name => `Hallo ${name}`,
        logout:  'Abmelden',
        loading: 'Daten werden geladen…',
        updated: time => `Aktualisiert: ${time}`,
        refresh: n    => `Refresh in ${n}s`,
        locale:  'de-DE',
      },
      en: {
        hello:   name => `Hello ${name}`,
        logout:  'Logout',
        loading: 'Loading data…',
        updated: time => `Updated: ${time}`,
        refresh: n    => `Refresh in ${n}s`,
        locale:  'en-GB',
      },
    };

    let t = i18n.de;

    function updateClock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString(t.locale, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    let refreshInterval = 30;
    let countdown = 0;
    let timer = null;

    async function loadConfig() {
      const r = await fetch('/api/config');
      if (r.status === 401) { location.href = '/login'; return null; }
      return r.json();
    }

    async function renderCards() {
      const r = await fetch('/api/render');
      if (r.status === 401) { location.href = '/login'; return; }
      const data = await r.json();

      const container = document.getElementById('cards');
      container.innerHTML = '';

      (data.cards || []).forEach(({ title, content }) => {
        const card = document.createElement('div');
        card.className = 'card';
        if (title) {
          const hdr = document.createElement('div');
          hdr.className = 'card-title';
          hdr.textContent = title;
          card.appendChild(hdr);
        }
        const body = document.createElement('div');
        body.innerHTML = marked.parse(content);
        card.appendChild(body);
        container.appendChild(card);
      });

      document.getElementById('last-update').textContent =
        t.updated(new Date().toLocaleTimeString(t.locale));
    }

    function startCountdown() {
      if (timer) clearInterval(timer);
      countdown = refreshInterval;
      const el = document.getElementById('refresh-info');

      timer = setInterval(() => {
        el.textContent = t.refresh(countdown);
        countdown--;
        if (countdown < 0) {
          clearInterval(timer);
          renderCards().then(startCountdown);
        }
      }, 1000);
    }

    async function init() {
      const config = await loadConfig();
      if (!config) return;

      t = i18n[config.lang] || i18n.de;

      refreshInterval = config.refresh_interval || 30;
      document.getElementById('username-badge').textContent = config.username;
      document.getElementById('welcome-msg').textContent = t.hello(config.display_name);
      document.getElementById('logout-btn').textContent = t.logout;
      document.getElementById('cards').innerHTML =
        `<div style="color:#4b5563;padding:40px;width:100%;text-align:center;font-family:sans-serif;">${t.loading}</div>`;

      await renderCards();
      startCountdown();
    }

    init();
  </script>
</body>
</html>
