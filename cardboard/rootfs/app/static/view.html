<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardBoard</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="theme-color" content="#1f2937" id="meta-theme-color">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CardBoard">
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    /* ── Theme-Variablen ─────────────────────────────── */
    :root {
      --bg:         #111827;
      --bg-surface: #1f2937;
      --bg-deep:    #111827;
      --border:     #374151;
      --text:       #e5e7eb;
      --text-muted: #6b7280;
      --text-dim:   #4b5563;
      --text-ftr:   #9ca3af;
      --accent:     #3b82f6;
      --c-heading:  #60a5fa;
      --c-bold:     #fbbf24;
      --c-em:       #a78bfa;
    }

    :root.light {
      --bg:         #f3f4f6;
      --bg-surface: #ffffff;
      --bg-deep:    #f3f4f6;
      --border:     #e5e7eb;
      --text:       #111827;
      --text-muted: #6b7280;
      --text-dim:   #9ca3af;
      --text-ftr:   #6b7280;
      --accent:     #2563eb;
      --c-heading:  #1d4ed8;
      --c-bold:     #b45309;
      --c-em:       #6d28d9;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 11px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .user-badge {
      font-size: 0.72rem;
      color: var(--text-muted);
      background: var(--bg-deep);
      border-radius: 20px;
      padding: 3px 10px;
      border: 1px solid var(--border);
      transition: background 0.2s, border-color 0.2s;
    }

    .welcome-msg {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .clock {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    .refresh-info {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* ── Buttons ─────────────────────────────────────── */
    .btn {
      background: var(--bg-deep);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--border); }

    .btn-refresh .icon { display: inline-block; transition: transform 0.4s; }
    .btn-refresh.spinning .icon { transform: rotate(360deg); }

    /* ── Cards ───────────────────────────────────────── */
    .cards-container {
      display: grid;
      grid-template-columns: repeat(var(--cards-per-row, 3), 1fr);
      gap: 16px;
      padding: 18px;
      align-content: start;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      min-width: 0;
      font-family: ui-monospace, "Cascadia Code", "Fira Mono", Consolas, monospace;
      font-size: 0.875rem;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      transition: background 0.2s, border-color 0.2s;
    }

    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .card p   { margin: 0; }
    .card br  { display: block; content: ""; }

    .card h1, .card h2, .card h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--c-heading);
      white-space: normal;
      margin: 0.5em 0 0.2em;
    }
    .card h1 { font-size: 1.1rem; }
    .card h2 { font-size: 1rem; }
    .card h3 { font-size: 0.93rem; }

    .card strong { color: var(--c-bold); font-weight: 700; }
    .card em     { color: var(--c-em); font-style: italic; }
    .card a      { color: var(--accent); text-decoration: none; }
    .card a:hover { text-decoration: underline; }

    .card code {
      background: var(--bg-deep);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.85em;
      font-family: inherit;
      transition: background 0.2s;
    }

    .card pre {
      background: var(--bg-deep);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      white-space: pre;
      margin: 0.4em 0;
      transition: background 0.2s;
    }
    .card pre code { background: none; padding: 0; }

    .card table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.4em 0;
      white-space: normal;
      font-family: inherit;
    }
    .card th, .card td {
      border: 1px solid var(--border);
      padding: 5px 10px;
      text-align: left;
    }
    .card th { background: var(--bg-deep); color: var(--text-muted); font-weight: 600; }

    .card hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0.6em 0;
    }

    .card ul, .card ol {
      padding-left: 1.4em;
      white-space: normal;
    }

    /* ── Footer ──────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--bg-surface);
      padding: 7px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-ftr);
      flex-shrink: 0;
    }

    .ha-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .ha-status-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-ftr);
      flex-shrink: 0;
    }
    .ha-status-badge.online .dot  { background: #22c55e; }
    .ha-status-badge.offline .dot { background: #ef4444; }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 800px) {
      .cards-container { grid-template-columns: 1fr; }
      .refresh-info    { display: none; }
      .welcome-msg     { display: none; }
    }

    @media (max-width: 600px) {
      .clock           { display: none; }
      .logout-label    { display: none; }
      .header-logo     { display: none; }
      footer           { flex-direction: column; align-items: flex-start; gap: 3px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <span class="header-logo">📋</span>
      <h1>CardBoard</h1>
      <span class="user-badge" id="username-badge"></span>
      <span class="welcome-msg" id="welcome-msg"></span>
    </div>
    <div class="header-right">
      <span class="clock" id="clock"></span>
      <span class="refresh-info" id="refresh-info"></span>
      <button class="btn btn-refresh" id="btn-refresh" title="Jetzt aktualisieren">
        <span class="icon">↻</span>
      </button>
      <button class="btn btn-theme" id="btn-theme" title="Theme wechseln">☀</button>
      <a href="/change-password" class="btn" id="change-pw-btn">🔑</a>
      <a href="/logout" class="btn" id="logout-btn"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="logout-label">Abmelden</span></a>
    </div>
  </header>

  <div class="cards-container" id="cards">
    <div style="color:var(--text-dim);padding:40px;width:100%;text-align:center;font-family:sans-serif;">
      Daten werden geladen…
    </div>
  </div>

  <footer>
    <span id="last-update"></span>
    <span class="ha-status-badge" id="ha-status-badge">
      <span class="dot"></span>
      <span id="ha-status-text">Home Assistant</span>
    </span>
  </footer>

  <script>
    marked.use({ breaks: true, gfm: true });

    /* ── i18n ────────────────────────────────────────── */
    const i18n = {
      de: {
        hello:    name => `Hallo ${name}`,
        logout:   'Abmelden',
        changePw: 'Passwort ändern',
        loading:  'Daten werden geladen…',
        updated:  time => `Aktualisiert: ${time}`,
        refresh:  n    => `Refresh in ${n}s`,
        locale:   'de-DE',
      },
      en: {
        hello:    name => `Hello ${name}`,
        logout:   'Logout',
        changePw: 'Change Password',
        loading:  'Loading data…',
        updated:  time => `Updated: ${time}`,
        refresh:  n    => `Refresh in ${n}s`,
        locale:   'en-GB',
      },
    };
    let t = i18n.de;

    /* ── Theme ───────────────────────────────────────── */
    const root    = document.documentElement;
    const btnTheme = document.getElementById('btn-theme');

    function applyTheme(theme) {
      if (theme === 'light') {
        root.classList.add('light');
        btnTheme.textContent = '🌙';
        btnTheme.title = 'Dark Mode';
        document.getElementById('meta-theme-color').content = '#f3f4f6';
      } else {
        root.classList.remove('light');
        btnTheme.textContent = '☀';
        btnTheme.title = 'Light Mode';
        document.getElementById('meta-theme-color').content = '#1f2937';
      }
    }

    applyTheme(localStorage.getItem('cb_theme') || 'dark');

    btnTheme.addEventListener('click', () => {
      const next = root.classList.contains('light') ? 'dark' : 'light';
      localStorage.setItem('cb_theme', next);
      applyTheme(next);
    });

    /* ── Clock ───────────────────────────────────────── */
    function updateClock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString(t.locale, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ── Data ────────────────────────────────────────── */
    let refreshInterval = 30;
    let countdown = 0;
    let timer = null;

    async function loadConfig() {
      const r = await fetch('/api/config');
      if (r.status === 401) { location.href = '/login?reason=expired'; return null; }
      return r.json();
    }

    let _lastCards = null;
    let _reconnecting = false;

    async function renderCards() {
      let r;
      try {
        r = await fetch('/api/render');
      } catch (e) {
        _showReconnecting();
        return;
      }
      if (r.status === 401) { location.href = '/login?reason=expired'; return; }
      if (!r.ok) {
        _showReconnecting();
        return;
      }
      _reconnecting = false;
      const reconnectEl = document.getElementById('reconnect-banner');
      if (reconnectEl) reconnectEl.remove();

      const data = await r.json();
      _lastCards = data.cards || [];

      const container = document.getElementById('cards');
      container.innerHTML = '';

      _lastCards.forEach(({ title, content }) => {
        const card = document.createElement('div');
        card.className = 'card';
        if (title) {
          const hdr = document.createElement('div');
          hdr.className = 'card-title';
          hdr.textContent = title;
          card.appendChild(hdr);
        }
        const body = document.createElement('div');
        body.innerHTML = marked.parse(content);
        card.appendChild(body);
        container.appendChild(card);
      });

      document.getElementById('last-update').textContent =
        t.updated(new Date().toLocaleTimeString(t.locale));
    }

    function _showReconnecting() {
      if (_reconnecting) return;
      _reconnecting = true;
      if (!document.getElementById('reconnect-banner')) {
        const banner = document.createElement('div');
        banner.id = 'reconnect-banner';
        banner.style.cssText = 'position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:8px 18px;font-size:0.8rem;color:var(--text-muted);z-index:50;';
        banner.textContent = '⟳ Verbindung wird hergestellt…';
        document.body.appendChild(banner);
      }
    }

    function startCountdown() {
      if (timer) clearInterval(timer);
      countdown = refreshInterval;
      const el = document.getElementById('refresh-info');
      timer = setInterval(() => {
        el.textContent = t.refresh(countdown);
        countdown--;
        if (countdown < 0) {
          clearInterval(timer);
          renderCards().then(startCountdown);
        }
      }, 1000);
    }

    /* ── Refresh Button ──────────────────────────────── */
    const btnRefresh = document.getElementById('btn-refresh');
    btnRefresh.addEventListener('click', () => {
      btnRefresh.classList.add('spinning');
      setTimeout(() => btnRefresh.classList.remove('spinning'), 400);
      if (timer) clearInterval(timer);
      renderCards().then(startCountdown);
    });

    /* ── HA Status ───────────────────────────────────── */
    async function updateHaStatus() {
      try {
        const r = await fetch('/api/public/ha-status');
        const data = await r.json();
        const badge = document.getElementById('ha-status-badge');
        const txt   = document.getElementById('ha-status-text');
        badge.classList.remove('online', 'offline');
        if (data.reachable) {
          badge.classList.add('online');
          let label = 'Home Assistant';
          if (data.version) label += ` ${data.version}`;
          if (data.online_since) {
            const dt = new Date(data.online_since);
            const sinceStr = dt.toLocaleDateString(t.locale, {day:'2-digit', month:'2-digit', year:'numeric'})
                           + ' ' + dt.toLocaleTimeString(t.locale, {hour:'2-digit', minute:'2-digit'});
            label += t.locale === 'en-GB' ? ` — online since ${sinceStr}` : ` — online seit ${sinceStr}`;
          }
          txt.textContent = label;
        } else {
          badge.classList.add('offline');
          txt.textContent = t.locale === 'en-GB' ? 'Home Assistant unreachable' : 'Home Assistant nicht erreichbar';
        }
      } catch {
        /* ignorieren */
      }
    }

    /* ── Init ────────────────────────────────────────── */
    async function init() {
      const config = await loadConfig();
      if (!config) return;

      t = i18n[config.lang] || i18n.de;

      document.documentElement.style.setProperty('--cards-per-row', config.cards_per_row || 3);
      refreshInterval = config.refresh_interval || 30;
      document.getElementById('username-badge').textContent = config.username;
      document.getElementById('welcome-msg').textContent    = t.hello(config.display_name);
      document.getElementById('logout-btn').querySelector('.logout-label').textContent = t.logout;
      document.getElementById('change-pw-btn').title        = t.changePw;
      document.getElementById('cards').innerHTML =
        `<div style="color:var(--text-dim);padding:40px;width:100%;text-align:center;font-family:sans-serif;">${t.loading}</div>`;

      await renderCards();
      startCountdown();
      updateHaStatus();
      setInterval(updateHaStatus, 60_000);
    }

    init();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (timer) clearInterval(timer);
        renderCards().then(startCountdown);
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
