<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardBoard – Passwort ändern</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <style>
    :root {
      --bg:         #111827;
      --bg-card:    #1f2937;
      --border:     #374151;
      --text:       #e5e7eb;
      --text-muted: #6b7280;
      --input-bg:   #111827;
      --accent:     #3b82f6;
      --accent-h:   #2563eb;
      --err-bg:     #450a0a;
      --err-border: #7f1d1d;
      --err-text:   #fca5a5;
      --ok-bg:      #052e16;
      --ok-border:  #14532d;
      --ok-text:    #86efac;
    }
    :root.light {
      --bg:         #f3f4f6;
      --bg-card:    #ffffff;
      --border:     #e5e7eb;
      --text:       #111827;
      --text-muted: #6b7280;
      --input-bg:   #f9fafb;
      --accent:     #2563eb;
      --accent-h:   #1d4ed8;
      --err-bg:     #fef2f2;
      --err-border: #fecaca;
      --err-text:   #dc2626;
      --ok-bg:      #f0fdf4;
      --ok-border:  #bbf7d0;
      --ok-text:    #16a34a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon { font-size: 42px; display: block; margin-bottom: 10px; }
    .logo h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.3px; }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    input[type="password"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    button[type="submit"] {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, transform 0.1s;
    }
    button[type="submit"]:hover   { background: var(--accent-h); }
    button[type="submit"]:active  { transform: scale(0.98); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .msg.error   { background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err-text); }
    .msg.success { background: var(--ok-bg);  border: 1px solid var(--ok-border);  color: var(--ok-text); }
    .msg.visible { display: block; }

    .hint {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">🔑</span>
      <h1 id="title">Passwort ändern</h1>
    </div>

    <div class="msg error"   id="error-msg"></div>
    <div class="msg success" id="success-msg"></div>

    <form id="pw-form">
      <div class="form-group">
        <label id="label-old">Aktuelles Passwort</label>
        <input type="password" id="old-pw" autocomplete="current-password" autofocus required>
      </div>
      <div class="form-group">
        <label id="label-new">Neues Passwort</label>
        <input type="password" id="new-pw" autocomplete="new-password" required>
        <p class="hint" id="pw-hint"></p>
      </div>
      <div class="form-group">
        <label id="label-confirm">Neues Passwort bestätigen</label>
        <input type="password" id="confirm-pw" autocomplete="new-password" required>
      </div>
      <button type="submit" id="btn-submit">Speichern</button>
    </form>

    <a href="/view" class="back-link" id="back-link">← Zurück zur Übersicht</a>
  </div>

  <script>
    if (localStorage.getItem('cb_theme') === 'light') {
      document.documentElement.classList.add('light');
    }

    const i18n = {
      de: {
        title:         'Passwort ändern',
        labelOld:      'Aktuelles Passwort',
        labelNew:      'Neues Passwort',
        labelCnf:      'Neues Passwort bestätigen',
        submit:        'Speichern',
        back:          '← Zurück zur Übersicht',
        errEmpty:      'Das neue Passwort darf nicht leer sein.',
        errMismatch:   'Die neuen Passwörter stimmen nicht überein.',
        errWrong:      'Das aktuelle Passwort ist falsch.',
        errTooShort:   n => `Das Passwort muss mindestens ${n} Zeichen lang sein.`,
        errNoSpecial:  'Das Passwort muss mindestens eine Zahl oder ein Sonderzeichen enthalten.',
        errGeneral:    'Fehler beim Speichern. Bitte erneut versuchen.',
        success:       'Passwort erfolgreich geändert.',
        reqLength:     n => `Mindestens ${n} Zeichen`,
        reqSpecial:    'Mindestens eine Zahl oder ein Sonderzeichen (z. B. 1, !, @)',
      },
      en: {
        title:         'Change Password',
        labelOld:      'Current Password',
        labelNew:      'New Password',
        labelCnf:      'Confirm New Password',
        submit:        'Save',
        back:          '← Back to dashboard',
        errEmpty:      'The new password must not be empty.',
        errMismatch:   'The new passwords do not match.',
        errWrong:      'The current password is incorrect.',
        errTooShort:   n => `The password must be at least ${n} characters long.`,
        errNoSpecial:  'The password must contain at least one number or special character.',
        errGeneral:    'Error saving. Please try again.',
        success:       'Password changed successfully.',
        reqLength:     n => `At least ${n} characters`,
        reqSpecial:    'At least one number or special character (e.g. 1, !, @)',
      },
    };

    let t = i18n.de;
    let pwMinLength = 8;
    let pwRequireSpecial = true;

    function applyLang() {
      document.getElementById('title').textContent          = t.title;
      document.getElementById('label-old').textContent      = t.labelOld;
      document.getElementById('label-new').textContent      = t.labelNew;
      document.getElementById('label-confirm').textContent  = t.labelCnf;
      document.getElementById('btn-submit').textContent     = t.submit;
      document.getElementById('back-link').textContent      = t.back;
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('visible');
      document.getElementById('success-msg').classList.remove('visible');
    }

    function showSuccess() {
      document.getElementById('success-msg').textContent = t.success;
      document.getElementById('success-msg').classList.add('visible');
      document.getElementById('error-msg').classList.remove('visible');
      document.getElementById('pw-form').style.display = 'none';
    }

    fetch('/api/config')
      .then(r => { if (r.status === 401) { location.href = '/login'; } return r.json(); })
      .then(data => {
        t = i18n[data.lang] || i18n.de;
        pwMinLength      = data.pw_min_length     ?? 8;
        pwRequireSpecial = data.pw_require_special ?? true;
        applyLang();
        const lines = [t.reqLength(pwMinLength)];
        if (pwRequireSpecial) lines.push(t.reqSpecial);
        document.getElementById('pw-hint').textContent = lines.join(' · ');
      })
      .catch(() => {});

    document.getElementById('pw-form').addEventListener('submit', async e => {
      e.preventDefault();
      document.getElementById('error-msg').classList.remove('visible');

      const oldPw  = document.getElementById('old-pw').value;
      const newPw  = document.getElementById('new-pw').value;
      const confPw = document.getElementById('confirm-pw').value;

      if (!newPw)                        { showError(t.errEmpty);              return; }
      if (newPw.length < pwMinLength)    { showError(t.errTooShort(pwMinLength)); return; }
      if (pwRequireSpecial && !Array.from(newPw).some(c => /[^a-zA-Z]/.test(c))) {
        showError(t.errNoSpecial); return;
      }
      if (newPw !== confPw)              { showError(t.errMismatch);           return; }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;

      try {
        const resp = await fetch('/api/change-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ old_password: oldPw, new_password: newPw, confirm_password: confPw }),
        });
        const data = await resp.json();
        if (resp.ok) {
          showSuccess();
        } else {
          const map = {
            wrong_password:    t.errWrong,
            passwords_mismatch: t.errMismatch,
            password_empty:    t.errEmpty,
            password_too_short: t.errTooShort(data.pw_min_length ?? pwMinLength),
            password_no_special: t.errNoSpecial,
          };
          showError(map[data.error] || t.errGeneral);
          btn.disabled = false;
        }
      } catch {
        showError(t.errGeneral);
        btn.disabled = false;
      }
    });

    applyLang();
  </script>
</body>
</html>
