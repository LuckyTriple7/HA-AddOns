name: CardBoard
description: Zeigt HA-Sensordaten als gerenderte Markdown-Karten im Browser an
version: "0.0.39"
slug: cardboard
url: https://github.com/LuckyTriple7/HA-AddOns

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

image: "ghcr.io/luckytriple7/cardboard"

panel_icon: mdi:card-text
panel_title: CardBoard
webui: http://[HOST]:[PORT:17772]

ingress: true
ingress_port: 17774
ingress_stream: false

ports:
  17772/tcp: 17772
  17773/tcp: 17773

ports_description:
  17772/tcp: CardBoard Web-UI
  17773/tcp: CardBoard Admin-API (nur LAN)

map:
  - config:rw

options:
  ha_token: ""
  ha_url: "http://homeassistant.local:8123"
  refresh_interval: 30
  login_message: ""
  uptime_sensor: "sensor.uptime"
  session_lifetime: 7
  notify_failed_login: true
  pw_min_length: 8
  pw_require_special: true
  admin_password: ""
  max_cards: 3
  cards_per_row: 3

schema:
  ha_token: str
  ha_url: str
  refresh_interval: int
  login_message: str
  uptime_sensor: str?
  session_lifetime: int?
  notify_failed_login: bool?
  pw_min_length: int?
  pw_require_special: bool?
  admin_password: str?
  max_cards: int?
  cards_per_row: int?
