configuration:
  username:
    name: Username
    description: Login username for the admin panel (port 17761).
  password:
    name: Password
    description: Login password for the admin panel — please change it!
  session_hours:
    name: Session duration
    description: Validity of the login session in hours.
  github_token:
    name: GitHub token
    description: Optional token — raises the API limit for GitHub import and star updates.
  telegram_bot_token:
    name: Telegram bot token
    description: Optional — new contact messages are reported via Telegram.
  telegram_chat_id:
    name: Telegram chat ID
    description: Chat ID for Telegram notifications.
network:
  17760/tcp: Public homepage
  17761/tcp: Admin panel (login protected)
