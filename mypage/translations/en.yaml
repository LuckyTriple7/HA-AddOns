configuration:
  username:
    name: Username
    description: Login username for the admin panel (port 17761).
  password:
    name: Password
    description: Login password for the admin panel — please change it!
  session_hours:
    name: Session duration
    description: Validity of the login session in hours.
  ingress_trust_net:
    name: Ingress network (special cases only)
    description: >-
      Leave empty. Via the Home Assistant panel (Ingress) HA has already
      authenticated the user, so MyPage does not ask for its own login — but only
      for requests coming from the supervisor network 172.30.32.0/23. If your
      supervisor comes from a different network (e.g. HA Supervised on a custom
      Docker network), the panel will ask for username and password; enter that
      network here in CIDR notation (several separated by spaces). Only enter
      networks that really belong to Home Assistant: anything coming from there
      enters the admin without logging in.
  trusted_proxies:
    name: Trusted proxy networks
    description: >-
      Leave empty. MyPage takes the real visitor address from the headers
      X-Forwarded-For, X-Real-IP and CF-Connecting-IP — but only when the
      connection comes from a private address, i.e. from the reverse proxy, the
      Cloudflare tunnel or the Docker gateway. On a direct connection the real
      peer counts, otherwise anyone could claim any address and bypass the login
      lockout. Networks entered here (CIDR, several separated by spaces) replace
      that rule entirely: only they count as an intermediary — your own LAN no
      longer does.
  github_token:
    name: GitHub token
    description: Optional token — raises the API limit for GitHub import and star updates.
  visit_log_max:
    name: Visitor log size
    description: How many visits the visitor log keeps (50–10000, default 500). Referrers/browsers/countries are computed from it.
  visit_file_log:
    name: Visitor archive as a file
    description: >-
      Additionally writes every visit permanently as CSV to
      addon_configs/<slug>_mypage/visits/visits-YYYY-MM.csv (one file per month, ready
      to open from the share in Excel/LibreOffice). Contains date, IP, country, browser,
      OS, path, referrer, language and user agent. The visitor log in the admin panel is
      unaffected. Default: off - IP addresses are personal data, a permanent archive
      should be switched on deliberately.
  visit_file_keep:
    name: Keep visitor archive (months)
    description: >-
      How many monthly files of the visitor archive are kept (0-120, default 1).
      The archive holds full, untruncated IP addresses; many privacy policies promise
      a maximum of 30 days for access data - 1 matches that most closely. Higher values
      are allowed but should match your own privacy policy. 0 = keep indefinitely
      (nothing is ever deleted). Cleanup runs at add-on start and when a new monthly
      file is created.
  visit_bot_nets:
    name: Additional bot networks
    description: >-
      Your own IP networks in CIDR notation (e.g. 194.180.48.0/24) whose requests
      are counted as bots. The networks of the major cloud providers (AWS, Azure,
      Google, Tencent, Alibaba, Oracle, DigitalOcean, Hetzner, OVH, Linode, Vultr,
      Scaleway) are already built in — add only what bothers you beyond those.
      Unusable entries are ignored.
  user_journal_max:
    name: Journal size per user
    description: How many events the journal keeps per user (20–1000, default 100).
  geoip_offline:
    name: Country lookup (local database)
    description: Resolves the visitor country from a local IP table (DB-IP Lite, falling back to the internet registries). No visitor IP leaves the add-on, no account and no quota. The table is refreshed weekly — about 30 MB download, roughly 10 MB on disk and 20 MB of memory.
  translate_email:
    name: Translation email (MyMemory)
    description: Optional — your own email raises the free daily limit of the DE↔EN translation (5,000 → 50,000 words). If invalid, the anonymous limit is used automatically.
  telegram_bot_token:
    name: Telegram bot token
    description: Optional — new contact messages are reported via Telegram.
  telegram_chat_id:
    name: Telegram chat ID
    description: Chat ID for Telegram notifications.
  ha_notify:
    name: Home Assistant notifications
    description: Shows persistent notifications in Home Assistant for new contact messages and suspicious login attempts (blocked IP). Enabled by default.
  smtp_host:
    name: SMTP server
    description: Optional — new contact messages are reported via email.
  smtp_port:
    name: SMTP port
    description: Usually 587 (STARTTLS) or 465 (SSL).
  smtp_user:
    name: SMTP user
    description: Login name for the mail server (often the sender address).
  smtp_password:
    name: SMTP password
    description: Password or app password for sending mail.
  smtp_from:
    name: Default sender (optional)
    description: Sender address for outgoing mail. Empty = the SMTP user is used. A different sender for access emails can be set in the admin panel (Users).
  smtp_to:
    name: Recipient address
    description: Contact messages are sent to this address.
  smtp_tls:
    name: Use STARTTLS
    description: On for port 587 (STARTTLS), off for port 465 (SSL).
  user_upload_max_mb:
    name: Upload limit per file (MB)
    description: Maximum file size for uploads in the member area.
  auto_backup_keep:
    name: Automatic backups to keep (count)
    description: >-
      Stores a daily backup in addon_configs/<slug>_mypage/autobackup/ and keeps the
      given number of the most recent ones. 0 disables automatic backups.
  revision_keep:
    name: Earlier versions to keep (count)
    description: >-
      Saves the previous state of the site content before every change in
      addon_configs/<slug>_mypage/revisions/ and keeps the given number of the most recent
      ones. Viewable and restorable in the admin under System → Earlier versions.
      0 disables versions.
  smb_server:
    name: SMB server (optional)
    description: IP/hostname of an SMB share — member files are stored there instead of the SD card.
  smb_share:
    name: SMB share
    description: Name of the share on the server.
  smb_user:
    name: SMB user
    description: Leave empty for guest access.
  smb_password:
    name: SMB password
    description: Password of the SMB user.
  gemini_api_key:
    name: Google Gemini API key (optional)
    description: >-
      Enables the Generate image button in the library editor — the AI then creates
      the cover image of an entry. Get a key at aistudio.google.com. Note: image
      generation is billed depending on the model.
  gemini_billing_key:
    name: Google Cloud key for price lookup (optional)
    description: >-
      Second API key, used only by the "Fetch prices from Google" button in the AI
      tab. The Gemini key does not work there because it is restricted to the
      Generative Language API. The key must come from a project with the Cloud
      Billing API enabled. Leave empty if you maintain the prices by hand.
  gemini_image_model:
    name: Model used for image generation
    description: >-
      gemini-3.1-flash-image is the all-rounder, gemini-3.1-flash-lite-image the
      fastest and cheapest, gemini-3-pro-image the premium option.
  gemini_image_ratio:
    name: Aspect ratio of generated images
    description: 16:9 matches the cover images of the library.
network:
  17760/tcp: Public homepage
  17761/tcp: Admin panel (login protected)
