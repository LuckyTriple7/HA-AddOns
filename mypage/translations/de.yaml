configuration:
  username:
    name: Benutzername
    description: Login-Benutzername für das Admin-Panel (Port 17761).
  password:
    name: Passwort
    description: Login-Passwort für das Admin-Panel — bitte unbedingt ändern!
  session_hours:
    name: Session-Dauer
    description: Gültigkeit der Login-Session in Stunden.
  github_token:
    name: GitHub-Token
    description: Optionales Token — erhöht das API-Limit für GitHub-Import und Sterne-Updates.
  visit_log_max:
    name: Besucher-Log-Größe
    description: Wie viele Aufrufe das Besucher-Log behält (50–10000, Standard 500). Referrer/Browser/Länder werden daraus berechnet.
  visit_file_log:
    name: Besucher-Archiv als Datei
    description: >-
      Schreibt jeden Aufruf zusätzlich dauerhaft als CSV nach
      addon_configs/<slug>_mypage/visits/visits-JJJJ-MM.csv (eine Datei je Monat,
      über den Share direkt in Excel/LibreOffice zu öffnen). Enthält Datum, IP, Land,
      Browser, System, Pfad, Referrer, Sprache und User-Agent. Das Besucher-Log im
      Admin bleibt davon unberührt. Standard: aus — IP-Adressen sind personenbezogene
      Daten, ein dauerhaftes Archiv will bewusst eingeschaltet sein.
  visit_file_keep:
    name: Besucher-Archiv aufbewahren (Monate)
    description: >-
      Wie viele Monatsdateien des Besucher-Archivs behalten werden (0-120, Standard 1).
      Das Archiv enthält ungekürzte IP-Adressen; viele Datenschutzerklärungen sagen für
      Zugriffsdaten höchstens 30 Tage zu — 1 trifft das am ehesten. Höhere Werte sind
      erlaubt, sollten aber zur eigenen Datenschutzerklärung passen. 0 = unbegrenzt
      aufbewahren (nichts wird je gelöscht). Aufgeräumt wird beim Start des Add-ons und
      beim Anlegen einer neuen Monatsdatei.
  visit_bot_nets:
    name: Zusätzliche Bot-Netze
    description: >-
      Eigene IP-Netze in CIDR-Schreibweise (z. B. 194.180.48.0/24), deren Aufrufe
      als Bot gezählt werden. Die Netze der großen Cloud-Anbieter (AWS, Azure,
      Google, Tencent, Alibaba, Oracle, DigitalOcean, Hetzner, OVH, Linode, Vultr,
      Scaleway) sind bereits eingebaut — hier kommt nur dazu, was darüber hinaus
      stört. Unbrauchbare Einträge werden übergangen.
  user_journal_max:
    name: Journal-Größe pro Benutzer
    description: Wie viele Ereignisse das Journal je Benutzer behält (20–1000, Standard 100).
  geoip_offline:
    name: Länder-Erkennung (lokale Datenbank)
    description: Ermittelt das Besucherland aus einer lokalen IP-Tabelle (DB-IP Lite, ersatzweise die Delegationsdaten der Internet-Registries). Keine Besucher-IP verlässt das Add-on, kein Konto und kein Limit. Die Tabelle wird wöchentlich erneuert — rund 30 MB Download, etwa 10 MB Speicherplatz, gut 20 MB Arbeitsspeicher.
  translate_email:
    name: Übersetzungs-E-Mail (MyMemory)
    description: Optional — eigene E-Mail erhöht das kostenlose Tageslimit der DE↔EN-Übersetzung (5.000 → 50.000 Wörter). Bei ungültiger Adresse wird automatisch das anonyme Limit genutzt.
  telegram_bot_token:
    name: Telegram-Bot-Token
    description: Optional — neue Kontaktnachrichten werden per Telegram gemeldet.
  telegram_chat_id:
    name: Telegram-Chat-ID
    description: Chat-ID für die Telegram-Benachrichtigungen.
  ha_notify:
    name: Home-Assistant-Benachrichtigungen
    description: Zeigt persistente Benachrichtigungen in Home Assistant bei neuer Kontaktnachricht und bei verdächtigen Anmeldeversuchen (gesperrte IP). Standard an.
  smtp_host:
    name: SMTP-Server
    description: Optional — neue Kontaktnachrichten werden per E-Mail gemeldet.
  smtp_port:
    name: SMTP-Port
    description: Meist 587 (STARTTLS) oder 465 (SSL).
  smtp_user:
    name: SMTP-Benutzer
    description: Anmeldename beim Mailserver (oft die Absenderadresse).
  smtp_password:
    name: SMTP-Passwort
    description: Passwort bzw. App-Passwort für den Mailversand.
  smtp_from:
    name: Standard-Absender (optional)
    description: Absenderadresse für ausgehende Mails. Leer = SMTP-Benutzer wird verwendet. Ein abweichender Absender für Zugangs-Mails lässt sich im Admin-Panel (Benutzer) einstellen.
  smtp_to:
    name: Empfängeradresse
    description: An diese Adresse werden Kontaktnachrichten geschickt.
  smtp_tls:
    name: STARTTLS verwenden
    description: An für Port 587 (STARTTLS), aus für Port 465 (SSL).
  user_upload_max_mb:
    name: Upload-Limit pro Datei (MB)
    description: Maximale Dateigröße für Uploads im Mitglieder-Bereich.
  auto_backup_keep:
    name: Automatische Backups aufbewahren (Anzahl)
    description: >-
      Legt täglich ein Backup unter addon_configs/<slug>_mypage/autobackup/ ab und
      behält die angegebene Anzahl der neuesten. 0 schaltet die automatischen Backups ab.
  smb_server:
    name: SMB-Server (optional)
    description: IP/Hostname eines SMB-Shares — Mitglieder-Dateien liegen dann dort statt auf der SD-Karte.
  smb_share:
    name: SMB-Freigabe
    description: Name der Freigabe auf dem Server.
  smb_user:
    name: SMB-Benutzer
    description: Leer lassen für Gast-Zugriff.
  smb_password:
    name: SMB-Passwort
    description: Passwort des SMB-Benutzers.
  gemini_api_key:
    name: Google-Gemini-API-Key (optional)
    description: >-
      Schaltet im Bibliothek-Editor den Knopf „Bild generieren“ frei — die KI erzeugt
      dann das Titelbild eines Eintrags. Key auf aistudio.google.com holen. Achtung:
      Bildgenerierung ist je nach Modell kostenpflichtig.
  gemini_billing_key:
    name: Google-Cloud-Key für Preisabfrage (optional)
    description: >-
      Zweiter API-Schlüssel, nur für den Knopf „Preise bei Google abfragen" im
      Tab KI. Der Gemini-Key taugt dafür nicht, weil er auf die Generative
      Language API beschränkt ist. Der Schlüssel muss aus einem Projekt stammen,
      in dem die Cloud Billing API freigeschaltet ist. Leer lassen, wenn du die
      Preise von Hand pflegst.
  gemini_image_model:
    name: Modell für die Bilderzeugung
    description: >-
      gemini-3.1-flash-image ist der Allrounder, gemini-3.1-flash-lite-image das
      schnellste und günstigste, gemini-3-pro-image die Premium-Variante.
  gemini_image_ratio:
    name: Seitenverhältnis der erzeugten Bilder
    description: 16:9 passt zu den Titelbildern der Bibliothek.
network:
  17760/tcp: Öffentliche Homepage
  17761/tcp: Admin-Panel (Login-geschützt)
