configuration:
  username:
    name: Benutzername
    description: Login-Benutzername für das Admin-Panel (Port 17761).
  password:
    name: Passwort
    description: Login-Passwort für das Admin-Panel — bitte unbedingt ändern!
  session_hours:
    name: Session-Dauer
    description: Gültigkeit der Login-Session in Stunden.
  github_token:
    name: GitHub-Token
    description: Optionales Token — erhöht das API-Limit für GitHub-Import und Sterne-Updates.
  visit_log_max:
    name: Besucher-Log-Größe
    description: Wie viele Aufrufe das Besucher-Log behält (50–10000, Standard 500). Referrer/Browser/Länder werden daraus berechnet.
  user_journal_max:
    name: Journal-Größe pro Benutzer
    description: Wie viele Ereignisse das Journal je Benutzer behält (20–1000, Standard 100).
  geoip_lookup:
    name: GeoIP-Lookup (ipapi.is)
    description: Ermittelt das Besucherland exakt über ipapi.is. Achtung — Besucher-IPs werden dabei an den Dienst übertragen (Datenschutzerklärung anpassen!).
  geoip_api_key:
    name: ipapi.is API-Key
    description: Optional — ohne Key ca. 1.000 Lookups/Tag frei. Bei mehr Traffic kostenlosen Key auf ipapi.is holen.
  translate_email:
    name: Übersetzungs-E-Mail (MyMemory)
    description: Optional — eigene E-Mail erhöht das kostenlose Tageslimit der DE↔EN-Übersetzung (5.000 → 50.000 Wörter). Bei ungültiger Adresse wird automatisch das anonyme Limit genutzt.
  telegram_bot_token:
    name: Telegram-Bot-Token
    description: Optional — neue Kontaktnachrichten werden per Telegram gemeldet.
  telegram_chat_id:
    name: Telegram-Chat-ID
    description: Chat-ID für die Telegram-Benachrichtigungen.
  ha_notify:
    name: Home-Assistant-Benachrichtigungen
    description: Zeigt persistente Benachrichtigungen in Home Assistant bei neuer Kontaktnachricht und bei verdächtigen Anmeldeversuchen (gesperrte IP). Standard an.
  smtp_host:
    name: SMTP-Server
    description: Optional — neue Kontaktnachrichten werden per E-Mail gemeldet.
  smtp_port:
    name: SMTP-Port
    description: Meist 587 (STARTTLS) oder 465 (SSL).
  smtp_user:
    name: SMTP-Benutzer
    description: Anmeldename beim Mailserver (oft die Absenderadresse).
  smtp_password:
    name: SMTP-Passwort
    description: Passwort bzw. App-Passwort für den Mailversand.
  smtp_from:
    name: Standard-Absender (optional)
    description: Absenderadresse für ausgehende Mails. Leer = SMTP-Benutzer wird verwendet. Ein abweichender Absender für Zugangs-Mails lässt sich im Admin-Panel (Benutzer) einstellen.
  smtp_to:
    name: Empfängeradresse
    description: An diese Adresse werden Kontaktnachrichten geschickt.
  smtp_tls:
    name: STARTTLS verwenden
    description: An für Port 587 (STARTTLS), aus für Port 465 (SSL).
  user_upload_max_mb:
    name: Upload-Limit pro Datei (MB)
    description: Maximale Dateigröße für Uploads im Mitglieder-Bereich.
  auto_backup_keep:
    name: Automatische Backups aufbewahren (Anzahl)
    description: >-
      Legt täglich ein Backup unter addon_configs/<slug>_mypage/autobackup/ ab und
      behält die angegebene Anzahl der neuesten. 0 schaltet die automatischen Backups ab.
  smb_server:
    name: SMB-Server (optional)
    description: IP/Hostname eines SMB-Shares — Mitglieder-Dateien liegen dann dort statt auf der SD-Karte.
  smb_share:
    name: SMB-Freigabe
    description: Name der Freigabe auf dem Server.
  smb_user:
    name: SMB-Benutzer
    description: Leer lassen für Gast-Zugriff.
  smb_password:
    name: SMB-Passwort
    description: Passwort des SMB-Benutzers.
network:
  17760/tcp: Öffentliche Homepage
  17761/tcp: Admin-Panel (Login-geschützt)
