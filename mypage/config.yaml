name: MyPage
description: Homepage-Baukasten — eigene Projekte präsentieren, GitHub-Import, Besucherzähler
version: "0.11.58"
slug: mypage
url: https://github.com/LuckyTriple7/HA-AddOns
image: "ghcr.io/luckytriple7/mypage"

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: true

panel_icon: mdi:web
panel_title: MyPage

ingress: true
ingress_port: 17761
ingress_stream: true

homeassistant_api: true

privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH

ports:
  17760/tcp: 17760
  17761/tcp: 17761

ports_description:
  17760/tcp: Öffentliche Homepage
  17761/tcp: Admin-Panel (Login-geschützt)

map:
  - app_config:rw

# Ab 0.11.0 pflegt MyPage seine Einstellungen selbst: Admin-Panel → Einstellungen,
# gespeichert verschlüsselt in settings.json im Add-on-Konfigurationsordner. Hier
# stehen seit 0.11.2 nur noch die Login-Daten — der Notzugang, falls man sich über
# die Oberfläche aussperrt.
options:
  username: "admin"
  password: "changeme123"
  session_hours: 24
  # Leer lassen. Nur noetig, wenn der Home-Assistant-Supervisor nicht aus
  # 172.30.32.0/23 kommt (etwa HA Supervised in einem eigenen Docker-Netz) und
  # der Aufruf ueber das HA-Panel deshalb nach einer Anmeldung fragt.
  ingress_trust_net: ""
  # Leer lassen. Nur noetig, wenn Weiterleitungs-Kopfzeilen (X-Forwarded-For &
  # Co.) auch von Adressen ausserhalb der privaten Netze geglaubt werden sollen
  # - oder wenn das eigene LAN ausdruecklich NICHT als Zwischenglied gelten soll.
  trusted_proxies: ""
  # Gesamtlimit fuer den Datenordner in MB. 0 = unbegrenzt. Bewusst hier und
  # nicht im Admin-Panel: Ein Limit, das der Inhalts-Admin selbst hochdrehen
  # kann, ist keins.
  storage_max_mb: 0

schema:
  username: str
  password: str
  session_hours: int
  ingress_trust_net: "str?"
  trusted_proxies: "str?"
  storage_max_mb: "int(0,10000000)?"
