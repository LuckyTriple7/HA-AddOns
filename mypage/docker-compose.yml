# MyPage ohne Home Assistant betreiben (Standalone).
# Anleitung: siehe STANDALONE.md
#
# Schnellstart:
#   1. docker compose up -d
#   2. docker compose logs mypage      → Benutzername und erzeugtes Passwort
#   3. Admin:   http://<server>:17761  (danach unter Einstellungen → Zugang ändern)
#      Seite:   http://<server>:17760
#
# Eine options.json wird nicht mehr gebraucht: MyPage erzeugt beim ersten Start
# ein Admin-Passwort, schreibt es ins Protokoll und legt nur den Hash in
# ./data/admin_login.json ab. Alles Weitere (Mail, Telegram, KI, SMB …) stellst
# du im Admin-Panel unter „Einstellungen" ein (landet in ./data/settings.json).

services:
  mypage:
    image: ghcr.io/luckytriple7/mypage:latest
    container_name: mypage
    ports:
      - "17760:17760"        # öffentliche Homepage
      - "17761:17761"        # Admin-Panel (passwortgeschützt)
    volumes:
      - ./data:/config                          # persistente Daten (site.json, uploads, …)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:17760/health"]
      interval: 30s
      timeout: 10s
      retries: 3
