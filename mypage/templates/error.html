<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="{{ 'light' if site.design.mode == 'light' else 'dark' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} – {{ site.design.site_title or site.profile.name or 'MyPage' }}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d1117">
  <style>
    :root {
      --bg:#0d1117; --surf:#161b22; --border:#30363d;
      --text:#c9d1d9; --muted:#8b949e; --accent:{{ site.design.accent }};
    }
    [data-theme="light"] {
      --bg:#f6f8fa; --surf:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#636c76;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: var(--surf); border: 1px solid var(--border); border-radius: 12px;
      padding: 44px 36px; max-width: 440px; text-align: center;
    }
    .code { font-size: 3.4rem; font-weight: 800; color: var(--accent); line-height: 1; }
    h1 { font-size: 1.1rem; margin: 12px 0 8px; }
    p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    a {
      display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
      padding: 8px 20px; border-radius: 6px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
    }
    a:hover { filter: brightness(1.12); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">{{ code }}</div>
    <h1>{{ err_title }}</h1>
    <p>{{ err_text }}</p>
    {% if home_url %}
    <a href="{{ home_url }}">{{ home_label }}</a>
    {% else %}
    <a href="#" onclick="history.back(); return false;">{{ home_label }}</a>
    {% endif %}
  </div>
  <script>
    (function(){
      const saved = localStorage.getItem('mp-public-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
      else if ({{ site.design.mode|tojson }} === 'auto')
        document.documentElement.setAttribute('data-theme',
          window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    })();
  </script>
</body>
</html>
