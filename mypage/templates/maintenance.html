<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="{{ site.design.mode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.design.site_title or site.profile.name or 'MyPage' }}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d1117">
  <style>
    :root {
      --bg:#0d1117; --surf:#161b22; --border:#30363d;
      --text:#c9d1d9; --muted:#8b949e; --accent:{{ site.design.accent }};
    }
    [data-theme="light"] {
      --bg:#f6f8fa; --surf:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#636c76;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: var(--surf); border: 1px solid var(--border); border-radius: 12px;
      padding: 44px 36px; max-width: 480px; text-align: center;
    }
    .icon { font-size: 2.6rem; margin-bottom: 14px; }
    h1 { font-size: 1.3rem; margin-bottom: 10px; }
    .text { color: var(--muted); font-size: 0.92rem; }
    .text p { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>{{ site.design.site_title or site.profile.name or 'MyPage' }}</h1>
    <div class="text">{{ text_html|safe }}</div>
  </div>
  <script>
    const saved = localStorage.getItem('mp-public-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  </script>
</body>
</html>
