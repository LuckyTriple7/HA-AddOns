<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="{{ site.design.mode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} – {{ site.design.site_title or site.profile.name or 'MyPage' }}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d1117">
  <style>
    :root {
      --bg:#0d1117; --surf:#161b22; --border:#30363d;
      --text:#c9d1d9; --muted:#8b949e; --accent:{{ site.design.accent }}; --font: {{ font_family|safe }};
    }
    [data-theme="light"] {
      --bg:#f6f8fa; --surf:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#636c76;
    }
    {{ font_faces|safe }}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      background: var(--bg); color: var(--text); line-height: 1.65;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    header { border-bottom: 1px solid var(--border); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
    .brand { font-weight: 700; color: var(--text); }
    .brand:hover { text-decoration: none; }
    main { padding: 40px 0 60px; }
    h1 { font-size: 1.6rem; margin-bottom: 24px; }
    /* Rechtstexte sind Markdown. Ohne eigene Abstände klebt in der Ausgabe
       alles aneinander, und ein Dokument mit vier Gliederungsebenen wird
       unlesbar — deshalb hier für jede Ebene eine eigene Größe. */
    .legal-text { color: var(--text); font-size: 0.92rem; }
    .legal-text h1 { font-size: 1.6rem; margin: 0 0 24px; }
    .legal-text h2 { font-size: 1.25rem; margin: 34px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .legal-text h3 { font-size: 1.05rem; margin: 26px 0 8px; }
    .legal-text h4 { font-size: 0.95rem; margin: 18px 0 6px; color: var(--muted); }
    .legal-text p { margin: 0 0 14px; }
    .legal-text ul, .legal-text ol { margin: 0 0 14px; padding-left: 22px; }
    .legal-text li { margin-bottom: 7px; }
    .legal-text strong, .legal-text b { font-weight: 700; color: var(--text); }
    .legal-text a { word-break: break-word; }
    .legal-text hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
    .legal-text table { border-collapse: collapse; width: 100%; margin: 0 0 14px; font-size: 0.86rem; }
    .legal-text th, .legal-text td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; }
    .legal-text code { font-family: ui-monospace, Consolas, monospace; font-size: 0.86em; }
    .legal-text > :first-child { margin-top: 0; }
    footer { border-top: 1px solid var(--border); padding: 20px 0; text-align: center; font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <a class="brand" href="/">&larr; {{ site.design.site_title or site.profile.name or 'MyPage' }}</a>
    </div>
  </header>
  <main class="wrap">
    {% if not own_title %}<h1>{{ title }}</h1>{% endif %}
    <div class="legal-text">{{ body_html|safe }}</div>
  </main>
  <footer>
    <div class="wrap">&copy; {{ year }} {{ site.profile.name or 'MyPage' }}</div>
  </footer>
  <script>
    const saved = localStorage.getItem('mp-public-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  </script>
</body>
</html>
