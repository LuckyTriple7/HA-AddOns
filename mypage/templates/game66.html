<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>66 – {{ site.design.site_title or site.profile.name or 'MyPage' }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root { --gold:#f1c40f; --felt1:#0f5c43; --felt2:#0a3f2e; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(ellipse at center, var(--felt1), var(--felt2));
      color: #eaf3ee; overflow: hidden; user-select: none;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; font-size: 0.85rem; }
    .topbar .title { font-weight: 700; letter-spacing: 0.5px; }
    .rulestag { font-size: 0.7rem; opacity: 0.9; background: rgba(255,255,255,0.12);
                padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
    .spacer { flex: 1; }
    .bummerl { font-size: 0.8rem; opacity: 0.95; }
    .bummerl b { color: var(--gold); }
    .iconbtn {
      background: rgba(255,255,255,0.12); border: none; color: #fff; width: 34px; height: 34px;
      border-radius: 8px; font-size: 1.1rem; cursor: pointer; line-height: 1;
    }
    .iconbtn:hover { background: rgba(255,255,255,0.22); }
    .felt { flex: 1; display: flex; flex-direction: column; justify-content: space-between;
            padding: 4px 12px 10px; min-height: 0; }
    .seat { display: flex; align-items: center; gap: 14px; }
    .seat.me { justify-content: center; }
    .info { font-size: 0.8rem; line-height: 1.35; min-width: 96px; }
    .info .who { font-weight: 700; }
    .info .turn { color: var(--gold); font-weight: 700; }
    .pts { font-size: 1.5rem; font-weight: 800; }
    .badge { display: inline-block; background: var(--gold); color: #222; font-size: 0.62rem;
             font-weight: 700; padding: 1px 6px; border-radius: 10px; vertical-align: middle; }
    .hand { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; min-height: 0; }
    .hand.opp { gap: 0; }
    .pc { height: clamp(78px, 19vh, 138px); width: auto; border-radius: 6px;
          box-shadow: 0 3px 8px rgba(0,0,0,0.45); display: block; }
    .hand.opp .pc { margin-left: -34px; }
    .hand.opp .pc:first-child { margin-left: 0; }
    .card-slot { position: relative; transition: transform 0.12s; }
    .hand.me .card-slot.playable { cursor: pointer; }
    .hand.me .card-slot.playable:hover { transform: translateY(-12px); }
    .hand.me .card-slot.disabled { opacity: 0.42; filter: grayscale(0.5); }
    .center { display: flex; align-items: center; justify-content: center; gap: 26px; flex: 1; min-height: 0; }
    .stockwrap { position: relative; text-align: center; }
    .stockwrap .trump { transform: rotate(90deg); }
    .stockwrap .stack { position: absolute; left: 46px; top: 0; }
    .count { font-size: 0.72rem; opacity: 0.85; margin-top: 6px; }
    .table-cards { display: flex; gap: 14px; align-items: center; min-height: clamp(86px, 20vh, 146px); }
    .table-cards .lead { transform: translateY(-6px) rotate(-4deg); }
    .table-cards .follow { transform: translateY(6px) rotate(4deg); }
    @keyframes cardFade { from { opacity: 0; } to { opacity: 1; } }
    .table-cards .pc { animation: cardFade 0.26s ease; }
    @media (prefers-reduced-motion: reduce) { .table-cards .pc { animation: none; } }
    .actionbar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 4px 0 2px; min-height: 40px; }
    .btn {
      background: var(--gold); color: #20160a; border: none; padding: 9px 16px; border-radius: 8px;
      font-size: 0.86rem; font-weight: 700; cursor: pointer;
    }
    .btn.ghost { background: rgba(255,255,255,0.14); color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .hint { text-align: center; font-size: 0.82rem; min-height: 18px; opacity: 0.95; }
    .log { position: fixed; left: 10px; bottom: 10px; width: min(280px, 70vw); max-height: 34vh;
           background: rgba(0,0,0,0.55); border-radius: 10px; padding: 8px 12px; font-size: 0.74rem;
           overflow-y: auto; display: none; }
    .log.show { display: block; }
    .log div { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .banner { position: fixed; inset: 0; background: rgba(0,0,0,0.66); display: none;
              align-items: center; justify-content: center; z-index: 50; }
    .banner.show { display: flex; }
    .banner .box { background: #14241c; border: 1px solid rgba(255,255,255,0.15); border-radius: 14px;
                   padding: 28px 34px; text-align: center; max-width: 90vw; }
    .banner h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .banner p { opacity: 0.9; margin-bottom: 18px; }
    .banner .big { font-size: 2.2rem; margin-bottom: 10px; }
    .rules-list { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 14px; text-align: left; }
    .rule-opt { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
                border-radius: 10px; padding: 12px 14px; cursor: pointer; max-width: 340px; }
    .rule-opt:hover { background: rgba(255,255,255,0.16); }
    .rule-opt.active { border-color: var(--gold); }
    .rule-opt h3 { font-size: 1rem; margin-bottom: 4px; }
    .rule-opt p { font-size: 0.8rem; opacity: 0.85; margin: 0; line-height: 1.45; }
    .rule-opt .act { color: var(--gold); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .banner .box.wide { width: min(620px, 92vw); }
    .scrollbox { max-height: 62vh; overflow-y: auto; text-align: left; margin: 6px 0 14px;
                 padding-right: 6px; }
    .scrollbox.md { font-size: 0.86rem; line-height: 1.5; }
    .scrollbox.md h1 { font-size: 1.2rem; margin: 12px 0 6px; }
    .scrollbox.md h2 { font-size: 1.05rem; margin: 14px 0 6px; border:0; }
    .scrollbox.md h3 { font-size: 0.95rem; margin: 10px 0 4px; }
    .scrollbox.md p { opacity: 0.92; margin: 6px 0; }
    .scrollbox.md ul, .scrollbox.md ol { margin: 6px 0 6px 18px; }
    .scrollbox.md li { margin: 3px 0; }
    .scrollbox.md hr { border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 14px 0; }
    .scrollbox.md table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.8rem; }
    .scrollbox.md th, .scrollbox.md td { border: 1px solid rgba(255,255,255,0.18);
                                         padding: 5px 8px; text-align: left; }
    .scrollbox.md th { background: rgba(255,255,255,0.08); }
    .scrollbox.md code { background: rgba(255,255,255,0.12); padding: 1px 5px; border-radius: 4px; }
    .scrollbox.md a { color: var(--gold); }
    .hist-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px;
                border-bottom: 1px solid rgba(255,255,255,0.1); }
    .hist-row .ico { font-size: 1.2rem; }
    .hist-row .meta { flex: 1; min-width: 0; }
    .hist-row .when { font-size: 0.82rem; }
    .hist-row .tags { font-size: 0.72rem; opacity: 0.7; }
    .hist-row .score { font-weight: 700; font-variant-numeric: tabular-nums; }
    .hist-row.win .score { color: var(--gold); }
    .hist-empty { opacity: 0.7; padding: 16px 4px; text-align: center; }
    .cut-cards { display: flex; gap: 26px; justify-content: center; margin: 8px 0 14px; }
    .cut-lbl { font-size: 0.8rem; opacity: 0.85; margin-bottom: 6px; }
    .cut-img { height: clamp(100px, 22vh, 150px); width: auto; }
    @keyframes cutIn { from { opacity: 0; transform: translateY(-18px) scale(0.9); } to { opacity: 1; } }
    #cut-modal.show .cut-img { animation: cutIn 0.35s ease both; }
    #cut-modal.show #cut-a { animation-delay: 0.25s; }
    @media (prefers-reduced-motion: reduce) { #cut-modal.show .cut-img { animation: none; } }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="title">🃏 66</span>
    <span class="rulestag" id="rulestag"></span>
    <span class="rulestag" id="leveltag"></span>
    <span class="bummerl">{{ t.g66_bummerl }}: <b id="bm-p">0</b> : <b id="bm-a">0</b> &nbsp;<span style="opacity:.6">/ 7</span></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="btn-level" title="{{ t.g66_level }}">🎚</button>
    <button class="iconbtn" id="btn-rules" title="{{ t.g66_rules }}">⚖</button>
    <button class="iconbtn" id="btn-rulesdoc" title="{{ t.g66_rulesdoc }}">📖</button>
    <button class="iconbtn" id="btn-history" title="{{ t.g66_history }}">🏅</button>
    <button class="iconbtn" id="btn-log" title="{{ t.g66_log }}">≡</button>
    <button class="iconbtn" id="btn-new" title="{{ t.g66_new }}">↻</button>
    <button class="iconbtn" id="btn-close" title="{{ t.g66_close_lbl }}">✕</button>
  </div>

  <div class="felt">
    <div class="seat opp">
      <div class="info">
        <div class="who">{{ t.g66_ai }} <span id="opp-turn" class="turn" style="display:none">●</span></div>
        <div>{{ t.g66_tricks }}: <span id="opp-tricks">0</span> <span id="opp-meld"></span></div>
      </div>
      <div class="pts" id="opp-pts">0</div>
      <div class="hand opp" id="opp-hand"></div>
    </div>

    <div class="center">
      <div class="stockwrap" id="stockwrap">
        <img class="pc trump" id="trump-card" alt="trump">
        <img class="pc stack" id="stock-back" src="/cards/{{ deck }}/back.svg" alt="">
        <div class="count"><span id="stock-count">0</span> · <span id="trump-suit"></span> <span id="closed-badge"></span></div>
      </div>
      <div class="table-cards" id="table-cards"></div>
    </div>

    <div class="seat me">
      <div class="info">
        <div class="who">{{ t.g66_you }} <span id="me-turn" class="turn" style="display:none">●</span></div>
        <div>{{ t.g66_tricks }}: <span id="me-tricks">0</span> <span id="me-meld"></span></div>
      </div>
      <div class="pts" id="me-pts">0</div>
    </div>
    <div class="hand me" id="me-hand"></div>
    <div class="hint" id="hint"></div>
    <div class="actionbar" id="actionbar"></div>
  </div>

  <div class="log" id="log"></div>

  <div class="banner" id="banner">
    <div class="box">
      <div class="big" id="banner-big"></div>
      <h2 id="banner-title"></h2>
      <p id="banner-text"></p>
      <button class="btn" id="banner-btn"></button>
    </div>
  </div>

  <div class="banner" id="rules-modal">
    <div class="box">
      <h2>⚖ {{ t.g66_rules }}</h2>
      <div class="rules-list" id="rules-list"></div>
      <button class="btn ghost" id="rules-cancel">✕</button>
    </div>
  </div>

  <div class="banner" id="level-modal">
    <div class="box">
      <h2>🎚 {{ t.g66_level }}</h2>
      <div class="rules-list" id="level-list"></div>
      <button class="btn ghost" id="level-cancel">✕</button>
    </div>
  </div>

  <div class="banner" id="history-modal">
    <div class="box wide">
      <h2>🏅 {{ t.g66_history }}</h2>
      <div class="scrollbox" id="history-list"></div>
      <button class="btn ghost" id="history-cancel">✕</button>
    </div>
  </div>

  <div class="banner" id="rulesdoc-modal">
    <div class="box wide">
      <h2>📖 {{ t.g66_rulesdoc }}</h2>
      <div class="scrollbox md" id="rulesdoc-body"></div>
      <button class="btn ghost" id="rulesdoc-cancel">✕</button>
    </div>
  </div>

  <div class="banner" id="cut-modal">
    <div class="box">
      <h2>🎲 {{ t.g66_cut_title }}</h2>
      <div class="cut-cards">
        <div><div class="cut-lbl">{{ t.g66_you }}</div><img class="pc cut-img" id="cut-p" alt=""></div>
        <div><div class="cut-lbl">{{ t.g66_ai }}</div><img class="pc cut-img" id="cut-a" alt=""></div>
      </div>
      <p id="cut-result"></p>
      <button class="btn" id="cut-go"></button>
    </div>
  </div>

  <script>
  const G = {
    deck: {{ deck|tojson }},
    lang: {{ lang|tojson }},
    you: {{ t.g66_you|tojson }}, ai: {{ t.g66_ai|tojson }},
    close_talon: {{ t.g66_close_talon|tojson }}, exchange: {{ t.g66_exchange|tojson }},
    marry_ask: {{ t.g66_marry_ask|tojson }}, close_confirm: {{ t.g66_close_confirm|tojson }},
    new_confirm: {{ t.g66_new_confirm|tojson }},
    your_turn: {{ t.g66_your_turn|tojson }}, ai_turn: {{ t.g66_ai_turn|tojson }},
    next: {{ t.g66_next|tojson }}, new_match: {{ t.g66_new|tojson }},
    deal_win: {{ t.g66_deal_win|tojson }}, deal_lose: {{ t.g66_deal_lose|tojson }},
    match_win: {{ t.g66_match_win|tojson }}, match_lose: {{ t.g66_match_lose|tojson }},
    gp: {{ t.g66_gp|tojson }}, closed_badge: {{ t.g66_closed_badge|tojson }},
    err: {{ t.g66_err|tojson }},
    rules: {{ t.g66_rules|tojson }},
    rules_std: {{ t.g66_rules_std|tojson }}, rules_std_desc: {{ t.g66_rules_std_desc|tojson }},
    rules_oma: {{ t.g66_rules_oma|tojson }}, rules_oma_desc: {{ t.g66_rules_oma_desc|tojson }},
    rules_active: {{ t.g66_rules_active|tojson }}, rules_start: {{ t.g66_rules_start|tojson }},
    cut_you: {{ t.g66_cut_you|tojson }}, cut_ai: {{ t.g66_cut_ai|tojson }}, cut_go: {{ t.g66_cut_go|tojson }},
    level: {{ t.g66_level|tojson }}, level_start: {{ t.g66_level_start|tojson }}, strength: {{ t.g66_strength|tojson }},
    level_easy: {{ t.g66_level_easy|tojson }}, level_easy_desc: {{ t.g66_level_easy_desc|tojson }},
    level_medium: {{ t.g66_level_medium|tojson }}, level_medium_desc: {{ t.g66_level_medium_desc|tojson }},
    level_hard: {{ t.g66_level_hard|tojson }}, level_hard_desc: {{ t.g66_level_hard_desc|tojson }},
    level_adaptive: {{ t.g66_level_adaptive|tojson }}, level_adaptive_desc: {{ t.g66_level_adaptive_desc|tojson }},
    history: {{ t.g66_history|tojson }}, history_empty: {{ t.g66_history_empty|tojson }},
    history_deals: {{ t.g66_history_deals|tojson }}, rulesdoc: {{ t.g66_rulesdoc|tojson }}
  };
  const $ = id => document.getElementById(id);
  const img = code => `/cards/${G.deck}/${code}.svg`;
  let V = null, busy = false, curRules = 'standard', curLevel = 'medium', cutShown = null;
  const LEVEL_DEFS = [
    ['easy', G.level_easy, G.level_easy_desc],
    ['medium', G.level_medium, G.level_medium_desc],
    ['hard', G.level_hard, G.level_hard_desc],
    ['adaptive', G.level_adaptive, G.level_adaptive_desc]
  ];
  const levelName = key => ({easy: G.level_easy, medium: G.level_medium,
    hard: G.level_hard, adaptive: G.level_adaptive}[key] || G.level_medium);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function cardImg(code, cls){
    const i = document.createElement('img');
    i.className = 'pc' + (cls ? ' ' + cls : '');
    i.src = img(code); i.alt = code; return i;
  }

  async function api(url, opts){
    try {
      const r = await fetch(url, opts);
      if (r.status === 403){ $('hint').textContent = G.err; return null; }
      if (r.status === 409){ return await api('/api/66/state'); }
      return await r.json();
    } catch(e){ $('hint').textContent = G.err; return null; }
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function loadState(){
    const v = await api('/api/66/state');
    if (v){ await maybeShowCut(v); render(v); }
  }

  // Auslosen anzeigen (einmal pro Auslosung) — zwei gezogene Karten, wer beginnt
  function maybeShowCut(v){
    return new Promise(resolve => {
      const cut = v && v.cut;
      const sig = cut ? JSON.stringify(cut) : null;
      if (!cut || sig === cutShown){ resolve(); return; }
      cutShown = sig;
      $('cut-p').src = img(cut.p);
      $('cut-a').src = img(cut.a);
      $('cut-result').textContent = (cut.leader === 'p') ? G.cut_you : G.cut_ai;
      $('cut-go').textContent = G.cut_go;
      const m = $('cut-modal'); m.classList.add('show');
      $('cut-go').onclick = () => { m.classList.remove('show'); resolve(); };
    });
  }

  // Frames mit Pausen abspielen — der volle Stich (2 Karten) bleibt sichtbar liegen
  async function playFrames(frames){
    for (let i = 0; i < frames.length; i++){
      render(frames[i]);
      if (i < frames.length - 1){
        const n = (frames[i].table || []).length;
        await sleep(n >= 2 ? 1250 : (n === 1 ? 600 : 480));
      }
    }
  }

  async function applyResult(r){
    if (r && r.frames){ await maybeShowCut(r.frames[0]); await playFrames(r.frames); }
    else if (r){ await maybeShowCut(r); render(r); }
  }

  async function doMove(action){  // setzt voraus, dass busy bereits true ist
    const r = await api('/api/66/move', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action})
    });
    await applyResult(r);
  }

  async function send(action){    // für Buttons (ohne Fluganimation)
    if (busy) return; busy = true;
    await doMove(action);
    busy = false;
  }

  // Angeklickte Handkarte animiert auf den Tisch fliegen lassen
  function flyCard(card){
    return new Promise(resolve => {
      if (reduceMotion){ resolve(); return; }
      const slot = document.querySelector('#me-hand .card-slot[data-card="' + CSS.escape(card) + '"]');
      const tableEl = $('table-cards');
      const sImg = slot && slot.querySelector('img');
      if (!sImg || !tableEl){ resolve(); return; }
      const s = sImg.getBoundingClientRect();
      const t = tableEl.getBoundingClientRect();
      const clone = sImg.cloneNode(true);
      clone.style.cssText = 'position:fixed;margin:0;z-index:60;pointer-events:none;'
        + 'left:' + s.left + 'px;top:' + s.top + 'px;height:' + s.height + 'px;width:auto;'
        + 'transition:transform .3s cubic-bezier(.4,.8,.3,1),opacity .3s ease;'
        + 'box-shadow:0 10px 22px rgba(0,0,0,.55)';
      document.body.appendChild(clone);
      slot.style.visibility = 'hidden';
      const dx = (t.left + t.width / 2) - (s.left + s.width / 2);
      const dy = (t.top + t.height / 2) - (s.top + s.height / 2);
      requestAnimationFrame(() => { clone.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; });
      let done = false;
      const fin = () => { if (done) return; done = true; clone.remove(); resolve(); };
      clone.addEventListener('transitionend', fin, {once: true});
      setTimeout(fin, 380);
    });
  }

  function hasLegal(pred){ return (V.legal || []).some(pred); }

  function render(v){
    V = v;
    curRules = v.rules || 'standard';
    $('rulestag').textContent = (curRules === 'oma') ? G.rules_oma : G.rules_std;
    curLevel = v.level || 'medium';
    $('leveltag').textContent = (curLevel === 'adaptive')
      ? levelName(curLevel) + ' · ' + (v.ai_strength != null ? v.ai_strength + '%' : '')
      : levelName(curLevel);
    $('bm-p').textContent = v.bummerl.p;
    $('bm-a').textContent = v.bummerl.a;
    $('me-pts').textContent = v.pts.p;
    $('opp-pts').textContent = v.pts.a;
    $('me-tricks').textContent = v.tricks.p;
    $('opp-tricks').textContent = v.tricks.a;
    $('me-meld').innerHTML = meldBadge(v.melds.p);
    $('opp-meld').innerHTML = meldBadge(v.melds.a);
    $('me-turn').style.display = (v.turn === 'p' && v.status === 'playing') ? '' : 'none';
    $('opp-turn').style.display = (v.turn === 'a' && v.status === 'playing') ? '' : 'none';

    // Gegnerhand (Rückseiten)
    const oh = $('opp-hand'); oh.innerHTML = '';
    for (let i = 0; i < v.ai_count; i++) oh.appendChild(cardImg('back'));

    // Talon + Trumpf
    if (v.trump_card){
      $('trump-card').src = img(v.trump_card); $('trump-card').style.display = '';
      $('stock-back').style.display = v.stock_count > 1 ? '' : 'none';
    } else {
      $('trump-card').style.display = 'none'; $('stock-back').style.display = 'none';
    }
    $('stock-count').textContent = v.stock_count;
    $('trump-suit').textContent = suitSym(v.trump);
    $('closed-badge').innerHTML = v.closed ? '<span class="badge">' + G.closed_badge + '</span>' : '';

    // Tisch
    const tc = $('table-cards'); tc.innerHTML = '';
    v.table.forEach((p, idx) => tc.appendChild(cardImg(p.card, idx === 0 ? 'lead' : 'follow')));

    // Eigene Hand
    const mh = $('me-hand'); mh.innerHTML = '';
    v.hand.forEach(card => {
      const slot = document.createElement('div');
      slot.className = 'card-slot';
      slot.dataset.card = card;
      const playable = (v.turn === 'p' && v.status === 'playing'
        && hasLegal(a => a.type === 'play' && a.card === card));
      slot.classList.add(playable ? 'playable' : 'disabled');
      slot.appendChild(cardImg(card));
      if (playable) slot.onclick = () => onCard(card);
      mh.appendChild(slot);
    });

    renderActions(v);
    renderHint(v);
    renderLog(v);
    renderBanner(v);
  }

  function suitSym(s){ return {c:'♣', d:'♦', h:'♥', s:'♠'}[s] || s; }
  function meldBadge(arr){
    return arr && arr.length
      ? '<span class="badge">' + arr.map(suitSym).join('') + '</span>' : '';
  }

  function renderActions(v){
    const bar = $('actionbar'); bar.innerHTML = '';
    if (v.status !== 'playing' || v.turn !== 'p') return;
    if (hasLegal(a => a.type === 'exchange')){
      const b = document.createElement('button');
      b.className = 'btn ghost'; b.textContent = '🔄 ' + G.exchange;
      b.onclick = () => send({type: 'exchange'}); bar.appendChild(b);
    }
    if (hasLegal(a => a.type === 'close')){
      const b = document.createElement('button');
      b.className = 'btn ghost'; b.textContent = '🔒 ' + G.close_talon;
      b.onclick = () => { if (confirm(G.close_confirm)) send({type: 'close'}); };
      bar.appendChild(b);
    }
  }

  async function onCard(card){
    if (busy) return;
    const canMarry = hasLegal(a => a.type === 'play' && a.card === card && a.marry);
    const marry = canMarry && confirm(G.marry_ask);
    busy = true;
    await flyCard(card);
    await doMove(marry ? {type: 'play', card, marry: true} : {type: 'play', card});
    busy = false;
  }

  function renderHint(v){
    let h = '';
    if (v.status === 'playing') h = (v.turn === 'p') ? G.your_turn : G.ai_turn;
    $('hint').textContent = h;
  }

  function renderLog(v){
    const el = $('log'); el.innerHTML = '';
    (v.log || []).slice(-30).forEach(e => {
      const d = document.createElement('div');
      d.textContent = G.lang === 'en' ? e.en : e.de;
      el.appendChild(d);
    });
    el.scrollTop = el.scrollHeight;
  }

  function renderBanner(v){
    const b = $('banner');
    if (v.status === 'playing' || !v.result){ b.classList.remove('show'); return; }
    const win = v.result.winner === 'p';
    const matchOver = (v.status === 'match_over');
    $('banner-big').textContent = win ? '🏆' : '🙂';
    $('banner-title').textContent = matchOver
      ? (win ? G.match_win : G.match_lose)
      : (win ? G.deal_win : G.deal_lose);
    $('banner-text').textContent = '+' + v.result.gp + ' ' + G.gp
      + '  ·  ' + v.result.pts.p + ' : ' + v.result.pts.a;
    const btn = $('banner-btn');
    btn.textContent = matchOver ? G.new_match : G.next;
    btn.onclick = matchOver ? () => newMatch() : () => send({type: 'next'});
    b.classList.add('show');
  }

  async function newMatch(rules, level){
    if (busy) return; busy = true;
    rules = rules || curRules; level = level || curLevel;
    const r = await api('/api/66/new', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({rules, level})
    });
    await applyResult(r);
    busy = false;
  }

  function openRules(){
    const list = $('rules-list'); list.innerHTML = '';
    [['standard', G.rules_std, G.rules_std_desc], ['oma', G.rules_oma, G.rules_oma_desc]]
      .forEach(([key, name, desc]) => {
        const o = document.createElement('div');
        o.className = 'rule-opt' + (key === curRules ? ' active' : '');
        const tag = (key === curRules) ? ' <span class="act">' + G.rules_active + '</span>' : '';
        const h = document.createElement('h3'); h.innerHTML = name + tag;
        const p = document.createElement('p'); p.textContent = desc;
        o.appendChild(h); o.appendChild(p);
        o.onclick = () => chooseRules(key);
        list.appendChild(o);
      });
    $('rules-modal').classList.add('show');
  }
  function closeRules(){ $('rules-modal').classList.remove('show'); }
  async function chooseRules(key){ closeRules(); await newMatch(key, curLevel); }

  function openLevel(){
    const list = $('level-list'); list.innerHTML = '';
    LEVEL_DEFS.forEach(([key, name, desc]) => {
      const o = document.createElement('div');
      o.className = 'rule-opt' + (key === curLevel ? ' active' : '');
      let label = name;
      if (key === 'adaptive' && key === curLevel && V && V.ai_strength != null)
        label += ' · ' + V.ai_strength + '%';
      const tag = (key === curLevel) ? ' <span class="act">' + G.rules_active + '</span>' : '';
      const h = document.createElement('h3'); h.innerHTML = label + tag;
      const p = document.createElement('p'); p.textContent = desc;
      o.appendChild(h); o.appendChild(p);
      o.onclick = () => chooseLevel(key);
      list.appendChild(o);
    });
    $('level-modal').classList.add('show');
  }
  function closeLevel(){ $('level-modal').classList.remove('show'); }
  async function chooseLevel(key){ closeLevel(); await newMatch(curRules, key); }

  const fmtWhen = ts => {
    try { return new Date(ts * 1000).toLocaleString(G.lang); }
    catch(e){ return new Date(ts * 1000).toLocaleString(); }
  };
  async function openHistory(){
    const list = $('history-list');
    list.innerHTML = '';
    $('history-modal').classList.add('show');
    const r = await api('/api/66/history');
    const games = (r && r.games) || [];
    if (!games.length){
      const e = document.createElement('div');
      e.className = 'hist-empty'; e.textContent = G.history_empty;
      list.appendChild(e); return;
    }
    games.forEach(gm => {
      const win = gm.winner === 'p';
      const row = document.createElement('div');
      row.className = 'hist-row' + (win ? ' win' : '');
      const ico = document.createElement('div');
      ico.className = 'ico'; ico.textContent = win ? '🏆' : '🙂';
      const meta = document.createElement('div');
      meta.className = 'meta';
      const when = document.createElement('div');
      when.className = 'when'; when.textContent = fmtWhen(gm.ts);
      const tags = document.createElement('div');
      tags.className = 'tags';
      const rname = (gm.rules === 'oma') ? G.rules_oma : G.rules_std;
      tags.textContent = rname + ' · ' + levelName(gm.level)
        + ' · ' + (gm.deals || 0) + ' ' + G.history_deals;
      meta.appendChild(when); meta.appendChild(tags);
      const score = document.createElement('div');
      score.className = 'score';
      const bm = gm.bummerl || {};
      score.textContent = (bm.p != null ? bm.p : '–') + ' : ' + (bm.a != null ? bm.a : '–');
      row.appendChild(ico); row.appendChild(meta); row.appendChild(score);
      list.appendChild(row);
    });
  }
  function closeHistory(){ $('history-modal').classList.remove('show'); }

  let rulesLoaded = false;
  async function openRulesDoc(){
    $('rulesdoc-modal').classList.add('show');
    if (rulesLoaded) return;
    const r = await api('/api/66/rules');
    if (r && r.html){ $('rulesdoc-body').innerHTML = r.html; rulesLoaded = true; }
  }
  function closeRulesDoc(){ $('rulesdoc-modal').classList.remove('show'); }

  function closeGame(){
    if (window.parent !== window) window.parent.postMessage('close-66', location.origin);
    else location.href = '/bereich';
  }

  $('btn-close').onclick = closeGame;
  $('btn-log').onclick = () => $('log').classList.toggle('show');
  $('btn-new').onclick = () => { if (confirm(G.new_confirm)) newMatch(); };
  $('btn-rules').onclick = openRules;
  $('rules-cancel').onclick = closeRules;
  $('btn-level').onclick = openLevel;
  $('level-cancel').onclick = closeLevel;
  $('btn-history').onclick = openHistory;
  $('history-cancel').onclick = closeHistory;
  $('btn-rulesdoc').onclick = openRulesDoc;
  $('rulesdoc-cancel').onclick = closeRulesDoc;
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('cut-modal').classList.contains('show')) return;  // erst "Los geht's"
    if ($('rules-modal').classList.contains('show')) closeRules();
    else if ($('level-modal').classList.contains('show')) closeLevel();
    else if ($('history-modal').classList.contains('show')) closeHistory();
    else if ($('rulesdoc-modal').classList.contains('show')) closeRulesDoc();
    else closeGame();
  });

  loadState();
  </script>
</body>
</html>
