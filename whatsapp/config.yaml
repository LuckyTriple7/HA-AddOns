name: WhatsApp
description: WhatsApp Web als persistente Session mit REST-API und Webhook für Home Assistant
version: "1.3.30"
slug: whatsapp
url: https://github.com/LuckyTriple7/HA-AddOns

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

map:
  - addon_config:rw

ingress: true
ingress_port: 3000
panel_icon: mdi:whatsapp
panel_title: WhatsApp

ports:
  3000/tcp: 3000

ports_description:
  3000/tcp: WhatsApp Web-UI und REST-API

options:
  dark_mode: true
  download_media: false
  webhook_incoming: ""
  initial_chats: 30
  initial_messages: 20
  max_messages_per_chat: 200
  debug_mode: false
  ha_notifications: false
  ha_notifications_privacy: false
  ha_token: ""

schema:
  dark_mode: bool
  download_media: bool
  webhook_incoming: str?
  initial_chats: int?
  initial_messages: int?
  max_messages_per_chat: int?
  debug_mode: bool
  ha_notifications: bool
  ha_notifications_privacy: bool
  ha_token: str?
