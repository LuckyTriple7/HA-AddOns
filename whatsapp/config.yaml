name: WhatsApp
description: WhatsApp Web als persistente Session mit REST-API und Webhook für Home Assistant
version: "1.0.2"
slug: whatsapp
url: https://github.com/LuckyTriple7/HA-AddOns

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

ingress: true
ingress_port: 3000
panel_icon: mdi:whatsapp
panel_title: WhatsApp

ports:
  3000/tcp: 3000

ports_description:
  3000/tcp: WhatsApp Web-UI und REST-API

map:
  - addon_config:rw

options:
  webhook_url: ""
  webhook_incoming: ""

schema:
  webhook_url: str?
  webhook_incoming: str?
