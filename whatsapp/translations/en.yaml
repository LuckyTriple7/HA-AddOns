configuration:
  dark_mode:
    name: Dark Mode
    description: Enable dark theme in the Web UI.
  download_media:
    name: Download Media
    description: Automatically download and display received photos. Only works reliably for newly incoming messages, not for historical ones.
  media_max_mb:
    name: Media Storage Limit (MB)
    description: "Maximum size of the media folder in MB. When the limit is exceeded, the oldest files (photos, videos, voice messages) are automatically deleted until the folder shrinks back to 80 % of the limit. Default: 500 MB."
  video_max_mb:
    name: Video Size Limit (MB)
    description: "Maximum size of a video that is automatically downloaded. Larger videos are shown as a placeholder and can be loaded on demand. Default: 50 MB."
  webhook_incoming:
    name: Webhook URL
    description: URL to forward incoming messages to (e.g. http://homeassistant:8123/api/webhook/whatsapp).
  initial_chats:
    name: Initial Chats
    description: "Number of most recently active chats loaded on startup. Chats not in this list are loaded dynamically when first opened. Recommended: 20–50."
  initial_messages:
    name: Initial Messages per Chat
    description: "Messages fetched per chat on startup from WhatsApp history. Note: WhatsApp Web only caches the most recent messages per chat — in practice rarely more than 20–50 are available regardless of this setting. Higher values slow down startup without benefit."
  keep_deleted:
    name: Keep Deleted Messages
    description: "true = Original message content stays visible with a small 🚫 badge below; forward/react/reply buttons are hidden. false = Message is replaced with a 🚫 deleted notice (default)."
  presence_announce:
    name: Announce your own availability
    description: "Required for \"last seen\" to show up for contacts — WhatsApp only sends other people's presence to devices that announce themselves as available. Note: this makes you appear online to your contacts while the add-on is running. false = off (default)."
  debug_mode:
    name: Debug Mode
    description: Enable verbose logging including detailed request logs. Useful for troubleshooting.
  ha_notifications:
    name: HA Notifications
    description: Show a persistent HA notification for each new incoming message (one per chat, overwritten by newer messages).
  ha_notifications_privacy:
    name: HA Notifications Privacy Mode
    description: When enabled, notifications only show "WhatsApp / New message" — no sender name or message content.
  ha_notifications_skip_groups:
    name: HA Notifications Skip Groups
    description: No HA notification and no REST API update for messages from group chats.
