configuration:
  dark_mode:
    name: Dunkles Theme
    description: Dunkles Theme in der Web-UI aktivieren.
  download_media:
    name: Medien herunterladen
    description: Empfangene Fotos automatisch herunterladen und anzeigen. Funktioniert nur zuverlässig bei neu eingehenden Nachrichten, nicht für historische Nachrichten.
  media_max_mb:
    name: Medienspeicher-Limit (MB)
    description: "Maximale Größe des Medienordners in MB. Wird das Limit überschritten, werden automatisch die ältesten Dateien (Fotos, Videos, Sprachnachrichten) gelöscht, bis der Ordner wieder auf 80 % des Limits schrumpft. Standard: 500 MB."
  video_max_mb:
    name: Video-Größen-Limit (MB)
    description: "Maximale Größe eines Videos das automatisch heruntergeladen wird. Größere Videos werden als Platzhalter angezeigt und können bei Bedarf manuell geladen werden. Standard: 50 MB."
  webhook_incoming:
    name: Webhook-URL
    description: URL für eingehende Nachrichten (z.B. http://homeassistant:8123/api/webhook/whatsapp).
  initial_chats:
    name: Chats beim Start
    description: "Anzahl der zuletzt aktiven Chats die beim Start geladen werden. Nicht enthaltene Chats werden beim ersten Öffnen nachgeladen. Empfehlung: 20–50."
  initial_messages:
    name: Nachrichten pro Chat beim Start
    description: "Nachrichten die beim Start pro Chat aus der WhatsApp-History geladen werden. Hinweis: WhatsApp Web cached pro Chat nur die neuesten Nachrichten — in der Praxis sind selten mehr als 20–50 verfügbar, unabhängig von diesem Wert. Höhere Werte verlangsamen den Start ohne Nutzen."
  keep_deleted:
    name: Gelöschte Nachrichten behalten
    description: "true = Originaler Nachrichteninhalt bleibt sichtbar, darunter erscheint ein kleines 🚫-Badge; Weiterleiten/Reaktion/Antworten-Buttons werden ausgeblendet. false = Nachricht wird durch eine 🚫-Meldung ersetzt (Standard)."
  presence_mode:
    name: Eigene Verfügbarkeit für "zuletzt online"
    description: "WhatsApp liefert die Präsenz anderer nur an Geräte, die sich selbst als verfügbar melden. temporary = nur während einer Abfrage kurz melden und danach wieder abmelden (Standard); always = dauerhaft melden, dann erscheinst du für deine Kontakte durchgehend online; off = nie melden, \"zuletzt online\" bleibt dann meist leer."
  presence_scan_minutes:
    name: Zuletzt-online-Übersicht automatisch aktualisieren (Minuten)
    description: "Wie oft die Übersicht aller Kontakte im Hintergrund aktualisiert wird. 0 = aus (Standard), die Übersicht lässt sich dann nur von Hand aktualisieren. Sinnvoll sind 15 bis 60 Minuten. Achtung: für die Dauer eines Rundlaufs (rund 15 Sekunden) meldest du dich als verfügbar und erscheinst so lange für deine Kontakte online — es sei denn, presence_mode steht auf off."
  debug_mode:
    name: Debug-Modus
    description: Ausführliches Logging aktivieren. Nützlich für die Fehlersuche.
  ha_notifications:
    name: HA-Benachrichtigungen
    description: Persistente HA-Benachrichtigung bei neuen Nachrichten (eine pro Chat, wird von neueren Nachrichten überschrieben).
  ha_notifications_privacy:
    name: HA-Benachrichtigungen Datenschutzmodus
    description: Zeigt nur „WhatsApp / Neue Nachricht" an — kein Absendername, kein Nachrichteninhalt.
  ha_notifications_skip_groups:
    name: HA-Benachrichtigungen Gruppen ignorieren
    description: Keine HA-Benachrichtigung und kein REST-API-Update bei Nachrichten aus Gruppenchats.
