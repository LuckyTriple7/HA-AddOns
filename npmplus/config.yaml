name: NPMplus
description: Reverse Proxy mit Web-Oberfläche auf Basis von NPMplus — HTTP/3, Let's Encrypt, CrowdSec-Bouncer und AppSec/WAF
version: "0.1.31"
slug: npmplus
url: https://github.com/LuckyTriple7/HA-AddOns

image: "ghcr.io/luckytriple7/npmplus"

arch:
  - amd64
  - aarch64

startup: services
boot: auto

# Der Supervisor prüft, ob die Oberfläche noch auf ihrem Port antwortet, und
# startet das Add-on sonst neu. Ohne das greift nur der Exit-Code aus run.sh —
# ein hängendes nginx merkt dort niemand. Bewusst tcp:// statt https://: die
# Oberfläche spricht HTTPS mit einem selbstsignierten Zertifikat.
watchdog: "tcp://[HOST]:[PORT:81]"

# Nur lesend: run.sh fragt die Add-on-Liste ab, um bei crowdsec_lapi_url "auto"
# den Container-Hostnamen des CrowdSec-Add-ons zu finden.
hassio_api: true

# Das Upstream-Image bringt tini als eigenes Init mit — HA darf kein zweites davorsetzen.
init: false

panel_icon: mdi:shield-lock-outline

# Kein Ingress: die NPMplus-Oberfläche spricht ausschließlich HTTPS mit einem
# selbstsignierten Zertifikat, Ingress erwartet aber einfaches HTTP hinter dem
# Supervisor-Proxy. Die UI läuft deshalb direkt auf admin_port.
webui: "https://[HOST]:[PORT:81]"

# Reverse Proxy braucht die echten Client-IPs und bindet 80/443 selbst —
# im Bridge-Netz sähe nginx nur die Docker-Gateway-IP.
host_network: true

ports:
  80/tcp: 80
  443/tcp: 443
  443/udp: 443
  81/tcp: 81
  91/tcp: 91

ports_description:
  80/tcp: HTTP (ACME-Challenge, Weiterleitung auf HTTPS)
  443/tcp: HTTPS
  443/udp: HTTP/3 (QUIC)
  81/tcp: NPMplus Web-Oberfläche (HTTPS)
  91/tcp: GoAccess-Statistik (HTTPS, ohne Anmeldung — nur bei goaccess_listen_localhost = false erreichbar)

map:
  - share:rw

options:
  TZ: "Europe/Berlin"
  acme_email: ""
  acme_profile: "shortlived"
  initial_admin_email: ""
  initial_admin_password: ""
  http_port: 80
  https_port: 443
  admin_port: 81
  disable_ipv6: false
  disable_h3_quic: false
  enable_mptcp: false
  logrotate: true
  logrotations: 3
  error_log_level: "warn"
  share_logs: true
  log_to_stdout: true
  goaccess: false
  goaccess_listen_localhost: true
  trust_ip: ""
  trust_cloudflare: false
  crowdsec_enabled: false
  crowdsec_lapi_url: "http://127.0.0.1:8080"
  crowdsec_api_key: ""
  crowdsec_appsec_url: "http://127.0.0.1:7422"
  crowdsec_fallback_remediation: ""
  crowdsec_captcha_provider: ""
  crowdsec_captcha_site_key: ""
  crowdsec_captcha_secret_key: ""
  geo_mode: "off"
  geo_preset: "none"
  geo_countries: []
  geo_exempt_hosts: []
  geo_deny_ips: []
  geo_allow_ips: []
  geo_refresh_hours: 24
  geo_deny_action: "403"
  geo_log_country: true
  nginx_worker_processes: "auto"
  nginx_worker_connections: 512
  cookie_secret: ""
  extra_env: []

schema:
  TZ: str
  acme_email: str?
  acme_profile: list(shortlived|tlsserver|classic)
  initial_admin_email: str?
  initial_admin_password: password?
  http_port: int(1,65535)
  https_port: int(1,65535)
  admin_port: int(1,65535)
  disable_ipv6: bool
  disable_h3_quic: bool
  enable_mptcp: bool
  logrotate: bool
  logrotations: int(1,365)
  error_log_level: list(debug|info|notice|warn|error|crit)
  share_logs: bool
  log_to_stdout: bool
  goaccess: bool
  goaccess_listen_localhost: bool
  trust_ip: str?
  trust_cloudflare: bool
  crowdsec_enabled: bool
  crowdsec_lapi_url: str?
  crowdsec_api_key: password?
  crowdsec_appsec_url: str?
  crowdsec_fallback_remediation: list(|bypass|captcha|ban)?
  crowdsec_captcha_provider: list(|turnstile|hcaptcha|recaptcha)?
  crowdsec_captcha_site_key: str?
  crowdsec_captcha_secret_key: password?
  geo_mode: list(off|block|allow)
  geo_preset: list(none|high_risk)
  geo_countries:
    - str
  geo_exempt_hosts:
    - str
  geo_deny_ips:
    - str
  geo_allow_ips:
    - str
  geo_refresh_hours: int(0,720)
  geo_deny_action: list(403|444)
  geo_log_country: bool
  nginx_worker_processes: str
  nginx_worker_connections: int(1,65535)
  cookie_secret: password?
  extra_env:
    - str
