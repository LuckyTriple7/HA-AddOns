configuration:
  TZ:
    name: Timezone
    description: Container timezone, e.g. Europe/Berlin. Used for logs, certificate renewal and log rotation.
  acme_email:
    name: ACME email
    description: Email address for Let's Encrypt. Expiry warnings go there. Optional for Let's Encrypt, required for ZeroSSL and Google Public CA.
  initial_admin_email:
    name: Initial admin email
    description: Only used on the very first start to create the first user. Leave empty for admin@example.org.
  initial_admin_password:
    name: Initial admin password
    description: Only used on the very first start. Leave empty and NPMplus generates a random password, printed to the add-on log.
  http_port:
    name: HTTP port
    description: Port for unencrypted traffic. Default 80. Changing it breaks the Let's Encrypt HTTP challenge.
  https_port:
    name: HTTPS port
    description: Port for encrypted traffic, TCP and UDP (HTTP/3). Default 443.
  admin_port:
    name: Web interface port
    description: Port of the NPMplus interface. Default 81. Always HTTPS with a self-signed certificate.
  disable_ipv6:
    name: Disable IPv6
    description: Stops nginx from listening on IPv6. Only enable if your network has no IPv6.
  disable_h3_quic:
    name: Disable HTTP/3
    description: Turns off QUIC on UDP 443. Only needed if your router cannot forward UDP 443.
  enable_mptcp:
    name: Enable Multipath TCP
    description: Enables MPTCP. Requires a kernel with MPTCP support.
  logrotate:
    name: Write access logs
    description: Writes access and error logs to /data/nginx/logs and rotates them daily. Required for CrowdSec and GoAccess.
  logrotations:
    name: Log files to keep
    description: How many rotated log files are kept before they are deleted.
  error_log_level:
    name: Error log verbosity
    description: From which level nginx writes to the error log. "warn" is the sensible default; "info" logs every worker change and floods both the log view and the disk.
  share_logs:
    name: Mirror logs to /share
    description: Stores the logs under /share/npmplus/logs so other add-ons (e.g. CrowdSec) can read them via file acquisition.
  log_to_stdout:
    name: Logs to add-on log
    description: Also mirrors the access log to the container output. Required if CrowdSec reads the logs through journald.
  goaccess:
    name: GoAccess statistics
    description: Enables the GoAccess dashboard under /goaccess of the NPMplus interface. Visible to logged-in admins only.
  trust_ip:
    name: Trusted IPs
    description: Space separated list of IPs or subnets of upstream proxies whose X-Forwarded-For header nginx may trust.
  trust_cloudflare:
    name: Trust Cloudflare
    description: Fetches the Cloudflare IP ranges and trusts their X-Forwarded-For header. Only enable if Cloudflare really sits in front.
  crowdsec_enabled:
    name: Enable CrowdSec bouncer
    description: Enables the nginx bouncer. Blocks requests from IPs banned by your CrowdSec instance.
  crowdsec_lapi_url:
    name: CrowdSec LAPI URL
    description: Address of the local CrowdSec API, e.g. http://127.0.0.1:8080.
  crowdsec_api_key:
    name: CrowdSec bouncer key
    description: Output of "cscli bouncers add npmplus" in your CrowdSec instance.
  crowdsec_appsec_url:
    name: CrowdSec AppSec URL
    description: Address of the AppSec/WAF endpoint, e.g. http://127.0.0.1:7422. Leave empty if AppSec is not running.
  nginx_worker_processes:
    name: nginx worker processes
    description: Number of nginx workers. Default "auto" matches the CPU core count.
  nginx_worker_connections:
    name: Connections per worker
    description: Maximum concurrent connections per worker process.
  cookie_secret:
    name: Cookie secret
    description: Static key for login cookies. Left empty a new one is generated on every restart, forcing a new login each time.
  extra_env:
    name: Extra environment variables
    description: Additional NPMplus variables as KEY=VALUE, one per line. All names are listed in the NPMplus project's compose.yaml.
network:
  80/tcp: HTTP (ACME challenge, redirect to HTTPS)
  443/tcp: HTTPS
  443/udp: HTTP/3 (QUIC)
  81/tcp: NPMplus web interface (HTTPS)
