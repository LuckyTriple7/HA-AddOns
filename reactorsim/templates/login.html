<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>{{ t.app_title }} — {{ t.login_title }}</title>
<style nonce="{{ csp_nonce() }}">
  /* Bewusst alles hier drin: die Anmeldeseite darf keine Datei nachladen, die
     hinter derselben Anmeldung liegt. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-items: center;
    padding: 24px 16px;
    background: radial-gradient(1200px 600px at 50% -10%, #14263a 0%, transparent 60%), #080b10;
    color: #c9d6e3;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .box {
    width: 100%; max-width: 380px;
    background: #121a24; border: 1px solid #223040; border-radius: 10px;
    padding: 24px; display: grid; gap: 14px;
  }
  h1 { margin: 0; font-size: 24px; letter-spacing: .04em; }
  h1 span {
    display: block; font-size: 11px; font-weight: 400; letter-spacing: .18em;
    text-transform: uppercase; color: #56656f; margin-top: 3px;
  }
  label { display: grid; gap: 5px; font-size: 12px; color: #7e8fa0; }
  input {
    background: #0d1219; border: 1px solid #223040; border-radius: 5px;
    color: #c9d6e3; padding: 10px 12px; font: inherit; min-height: 42px;
  }
  input:focus { outline: none; border-color: #64d8ff; }
  button {
    background: #12405f; border: 1px solid #1d6c9c; border-radius: 6px;
    color: #dff1ff; font: 600 14px/1 inherit; padding: 12px; min-height: 44px;
    cursor: pointer;
  }
  button:hover { background: #17537b; }
  .err {
    margin: 0; padding: 9px 11px; border-radius: 5px; font-size: 13px;
    background: #3a0f16; border: 1px solid #7a1020; color: #ffb3bd;
  }
  .foot {
    display: flex; gap: 12px; align-items: center;
    font-size: 11px; color: #56656f; border-top: 1px solid #1a242f; padding-top: 12px;
  }
  .foot a { color: #64d8ff; text-decoration: none; }
  .foot .ver { margin-left: auto; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <form class="box" method="post" action="/login" autocomplete="on">
    <h1>{{ t.app_title }}<span>{{ t.login_title }}</span></h1>

    {% if error %}<p class="err">{{ t[error] }}</p>{% endif %}

    <label>{{ t.login_user }}
      <input type="text" name="user" autocomplete="username" autocapitalize="none"
             spellcheck="false" required autofocus value="{{ prefill }}">
    </label>
    <label>{{ t.login_password }}
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <button type="submit">{{ t.login_submit }}</button>

    <div class="foot">
      <span>{{ t.start_language }}:
        <a href="/set-lang/de">DE</a>
        <a href="/set-lang/en">EN</a>
      </span>
      <span class="ver">v{{ app_version }}</span>
    </div>
  </form>
</body>
</html>
