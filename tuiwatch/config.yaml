name: TUIWatch
description: Reisepreis-Tracker — verfolgt TUI-Angebotspreise und zeigt den Verlauf
version: "0.52.10"
slug: tuiwatch
url: https://github.com/LuckyTriple7/HA-AddOns
image: "ghcr.io/luckytriple7/tuiwatch"

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: true

homeassistant_api: true

panel_icon: mdi:airplane-clock
panel_title: TUIWatch

ingress: true
ingress_port: 17794
ingress_stream: true

map:
  - addon_config:rw

ports:
  17794/tcp: 17794

ports_description:
  17794/tcp: TUIWatch Web-UI (direkt)

options:
  username: "admin"
  password: "secret"
  session_hours: 24
  poll_interval: 21600
  market_trend_threshold: 1.0
  trippilot_home_location: ""
  ha_sensors: true
  notify_ha: true
  notify_price_change: true
  notify_cheaper_date: true
  cheaper_date_min_diff: 50
  notify_calendar_trend: true
  calendar_trend_min_diff: 20
  calendar_daily_refresh: true
  notify_errors: true
  notify_api_errors: true
  notify_booked_drop: true
  booked_drop_min_diff: 50
  digest_enabled: false
  digest_weekday: 1
  notify_aktionscodes: true
  aktionscode_min: 0
  aktionscode_interval: 21600
  auto_backup: true
  auto_backup_keep: 5
  telegram_bot_token: ""
  telegram_chat_id: ""
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  smtp_from: ""
  smtp_to: ""
  smtp_tls: true
  nc_addressbook_url: ""
  nc_user: ""
  nc_app_password: ""
  anthropic_api_key: ""
  anthropic_model: "claude-opus-4-8"
  ai_provider: "anthropic"
  gemini_api_key: ""
  gemini_model: "gemini-3.1-pro"
  perplexity_api_key: ""
  perplexity_model: "sonar-pro"
  ai_max_web_searches: 12
  ai_prompt_preview: false
  verbose_log: false

schema:
  username: str
  password: str
  session_hours: int
  poll_interval: int?
  market_trend_threshold: float?
  trippilot_home_location: str?
  ha_sensors: bool?
  notify_ha: bool?
  notify_price_change: bool?
  notify_cheaper_date: bool?
  cheaper_date_min_diff: int?
  notify_calendar_trend: bool?
  calendar_trend_min_diff: int?
  calendar_daily_refresh: bool?
  notify_errors: bool?
  notify_api_errors: bool?
  notify_booked_drop: bool?
  booked_drop_min_diff: int?
  digest_enabled: bool?
  digest_weekday: int?
  notify_aktionscodes: bool?
  aktionscode_min: int?
  aktionscode_interval: int?
  auto_backup: bool?
  auto_backup_keep: int?
  telegram_bot_token: str?
  telegram_chat_id: str?
  smtp_host: str?
  smtp_port: int?
  smtp_user: str?
  smtp_password: str?
  smtp_from: str?
  smtp_to: str?
  smtp_tls: bool?
  nc_addressbook_url: str?
  nc_user: str?
  nc_app_password: str?
  anthropic_api_key: password?
  anthropic_model: list(claude-opus-4-8|claude-sonnet-5|claude-haiku-4-5|claude-fable-5)?
  ai_provider: list(anthropic|gemini|perplexity)?
  gemini_api_key: password?
  gemini_model: list(gemini-3.1-pro|gemini-3.5-flash|gemini-2.5-flash)?
  perplexity_api_key: password?
  perplexity_model: list(sonar|sonar-pro|sonar-reasoning-pro|sonar-deep-research)?
  ai_max_web_searches: int?
  ai_prompt_preview: bool?
  verbose_log: bool?
