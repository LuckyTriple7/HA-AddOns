name: TUIWatch
description: Reisepreis-Tracker — verfolgt TUI-Angebotspreise und zeigt den Verlauf
version: "0.20.4"
slug: tuiwatch
url: https://github.com/LuckyTriple7/HA-AddOns
image: "ghcr.io/luckytriple7/tuiwatch"

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

homeassistant_api: true

panel_icon: mdi:airplane-clock
panel_title: TUIWatch

ingress: true
ingress_port: 17794
ingress_stream: true

map:
  - addon_config:rw

ports:
  17794/tcp: 17794

ports_description:
  17794/tcp: TUIWatch Web-UI (direkt)

options:
  username: "admin"
  password: "secret"
  session_hours: 24
  poll_interval: 21600
  ha_sensors: true
  notify_ha: true
  notify_price_change: true
  notify_cheaper_date: true
  cheaper_date_min_diff: 50
  notify_errors: true
  notify_api_errors: true
  notify_booked_drop: true
  booked_drop_min_diff: 50
  digest_enabled: false
  digest_weekday: 1
  telegram_bot_token: ""
  telegram_chat_id: ""
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  smtp_from: ""
  smtp_to: ""
  smtp_tls: true
  verbose_log: false

schema:
  username: str
  password: str
  session_hours: int
  poll_interval: int?
  ha_sensors: bool?
  notify_ha: bool?
  notify_price_change: bool?
  notify_cheaper_date: bool?
  cheaper_date_min_diff: int?
  notify_errors: bool?
  notify_api_errors: bool?
  notify_booked_drop: bool?
  booked_drop_min_diff: int?
  digest_enabled: bool?
  digest_weekday: int?
  telegram_bot_token: str?
  telegram_chat_id: str?
  smtp_host: str?
  smtp_port: int?
  smtp_user: str?
  smtp_password: str?
  smtp_from: str?
  smtp_to: str?
  smtp_tls: bool?
  verbose_log: bool?
