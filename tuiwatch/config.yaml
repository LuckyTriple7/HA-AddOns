name: TUIWatch
description: Reisepreis-Tracker — verfolgt TUI-Angebotspreise und zeigt den Verlauf
version: "0.113.5"
slug: tuiwatch
url: https://github.com/LuckyTriple7/HA-AddOns
image: "ghcr.io/luckytriple7/tuiwatch"

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: true

homeassistant_api: true

panel_icon: mdi:airplane-clock
panel_title: TUIWatch

ingress: true
ingress_port: 17794
ingress_stream: true

map:
  - app_config:rw

ports:
  17794/tcp: 17794
  # Öffentliche Angebots-Seiten (share_routes.py). Standardmäßig NICHT
  # veröffentlicht — erst wenn hier bewusst ein Port gesetzt wird, ist er
  # erreichbar. Nur diesen Port im Reverse-Proxy nach außen geben, nie 17794.
  17796/tcp: null

ports_description:
  17794/tcp: TUIWatch Web-UI (direkt) — nicht ins Internet geben
  17796/tcp: Öffentliche Angebots-Links (nur /s/<token>, ohne Login)

# Ab 0.104.0 pflegt TUIWatch seine Einstellungen selbst: Zahnrad neben „Alle prüfen",
# gespeichert verschlüsselt in settings.json im Add-on-Konfigurationsordner. Hier stehen
# seit 0.104.1 nur noch die Login-Daten — der Notzugang, falls man sich über die
# Oberfläche aussperrt.
options:
  username: "admin"
  password: "secret"
  session_hours: 24

schema:
  username: str
  password: str
  session_hours: int
