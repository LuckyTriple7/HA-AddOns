<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUIWatch – Anmelden</title>
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233b82f6' d='M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/%3E%3C/svg%3E">
  <style>
    :root { --bg:#0e1215; --surf:#171d21; --border:#263035; --text:#e4eaec; --muted:#8a9aa1; --accent:#3b9cd9; --green:#2e8fd6; --green-h:#4aa6e4; --red:#e4685f; --r-card:14px; --r-ui:10px; }
    [data-theme="light"] { --bg:#f1f4f6; --surf:#ffffff; --border:#d5dde1; --text:#161c1f; --muted:#5e6c72; --accent:#12689b; --green:#12689b; --green-h:#0f7bb8; --red:#c0392f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; transition: background .2s, color .2s; }
    .card { background: var(--surf); border: 1px solid var(--border); border-radius: var(--r-card); padding: 32px 28px; width: 100%; max-width: 360px; }
    .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .subtitle { font-size: 0.8rem; color: var(--muted); margin-bottom: 28px; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    input[type="text"], input[type="password"] { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: var(--r-ui); font-size: 0.9rem; margin-bottom: 16px; }
    input:focus { outline: none; border-color: var(--accent); }
    button[type="submit"] { width: 100%; background: var(--green); border: 1px solid var(--green-h); color: #fff; padding: 9px; border-radius: var(--r-ui); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background .15s; }
    button[type="submit"]:hover { background: var(--green-h); }
    .error { background: rgba(192,57,47,.12); border: 1px solid var(--red); color: var(--red); padding: 9px 12px; border-radius: var(--r-ui); font-size: 0.83rem; margin-bottom: 16px; }
    .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-bottom: 20px; }
    .lang-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 2px 8px; border-radius: var(--r-ui); font-size: 0.75rem; cursor: pointer; text-decoration: none; }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); }
    .theme-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 3px 6px; border-radius: var(--r-ui); cursor: pointer; display: inline-flex; align-items: center; }
    .theme-btn svg { width: 13px; height: 13px; fill: currentColor; }
    .icon-moon { display: block; } .icon-sun { display: none; }
    [data-theme="light"] .icon-moon { display: none; } [data-theme="light"] .icon-sun { display: block; }
    footer { text-align: center; margin-top: 20px; font-size: 0.72rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <button class="theme-btn" onclick="toggleTheme()" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        <svg class="icon-sun"  viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2v-2H2v2zm18 0h2v-2h-2v2zM11 2v2h2V2h-2zm0 18v2h2v-2h-2zM5.99 4.58 4.58 5.99l1.41 1.41 1.41-1.41L5.99 4.58zm12.03 12.03-1.41 1.41 1.41 1.41 1.41-1.41-1.41-1.41zm1.41-12.44-1.41-1.41-1.41 1.41 1.41 1.41 1.41-1.41zM5.99 19.42l1.41 1.41 1.41-1.41-1.41-1.41-1.41 1.41z"/></svg>
      </button>
    </div>
    <div class="logo-row">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="var(--accent)"><path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      <div class="logo">TUIWatch</div>
    </div>
    <p class="subtitle">Reisepreis-Tracker</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="on">
      <label for="username">Benutzername</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
    </form>
    <footer>TUIWatch &mdash; verfolgt TUI-Reisepreise</footer>
  </div>
  <script>
    (function(){ const t=localStorage.getItem('tw-theme')||'dark'; document.documentElement.setAttribute('data-theme',t); })();
    function toggleTheme(){ const c=document.documentElement.getAttribute('data-theme')||'dark'; const n=c==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('tw-theme',n); }
  </script>
</body>
</html>
