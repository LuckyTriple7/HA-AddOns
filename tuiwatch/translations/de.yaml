# Nur noch die Login-Daten: alles Weitere pflegt TUIWatch selbst
# (Zahnrad neben "Alle pruefen"), die Beschriftungen dazu stehen in settings.py.
configuration:
  username:
    name: Benutzername
    description: Benutzername für das Web-Interface (nur beim Direktzugriff auf Port 17794 relevant — hinter HA Ingress übernimmt HA die Authentifizierung).
  password:
    name: Passwort
    description: Passwort für das Web-Interface (nur beim Direktzugriff auf Port 17794 relevant). Bitte ändern!
  session_hours:
    name: Session-Dauer (Stunden)
    description: Wie viele Stunden eine Login-Session gültig bleibt. Standard 24.
  twofa_reset:
    name: Zwei-Faktor-Abfrage überspringen (Notzugang)
    description: Nur einschalten, wenn Handy und Backup-Codes weg sind. Solange an, fragt der Login keinen Code ab. Danach in TUIWatch unter Einstellungen → Anmeldung die Zwei-Faktor-Anmeldung abschalten oder neu einrichten und diese Option wieder ausschalten.
