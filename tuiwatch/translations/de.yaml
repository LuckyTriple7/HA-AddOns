configuration:
  username:
    name: Benutzername
    description: Benutzername für das Web-Interface (nur beim Direktzugriff auf Port 17794 relevant — hinter HA Ingress übernimmt HA die Authentifizierung).
  password:
    name: Passwort
    description: Passwort für das Web-Interface (nur beim Direktzugriff auf Port 17794 relevant). Bitte ändern!
  session_hours:
    name: Session-Dauer (Stunden)
    description: Wie viele Stunden eine Login-Session gültig bleibt. Standard 24.
  poll_interval:
    name: Prüfintervall (Sekunden)
    description: "Pause zwischen zwei automatischen Preisprüfungen. Reisepreise ändern sich langsam — Standard 21600 (6 Stunden), Minimum 600 (10 Minuten). Bitte fair wählen, nicht im Minutentakt."
  market_trend_threshold:
    name: Schwelle für Markttrend (%)
    description: "Kumulierte Preisbewegung über 14 Tage, ab der der Markttrend als steigend/fallend statt stabil gilt. Standard 1.0 — kleinerer Wert reagiert empfindlicher auf kleine Bewegungen."
  market_basket_enabled:
    name: Preisbarometer
    description: "Führt 1×/Tag jede deiner gespeicherten Suchen erneut aus (mit deinen Reiseterminen und Filtern) und berechnet den Markttrend aus allen gefundenen Hotels statt nur aus deinen Angeboten. Deutlich breitere Basis, und der Trend gilt genau für deinen Reisetermin. Standard an."
  market_basket_lead_days:
    name: Ersatz-Vorlaufzeit fürs Preisbarometer (Tage)
    description: "Nur Rückfallebene: Messreihen holen ihren Reisetermin aus der gespeicherten Suche bzw. dem getrackten Angebot. Fehlt dort ein Datum, wird ersatzweise „heute + X Tage“ gesucht. Standard 91."
  market_basket_max_regions:
    name: Maximale Messreihen
    description: "Obergrenze für die täglich abgefragten Messreihen (1…50), also für die Zahl der gespeicherten Suchen, die neu ausgeführt werden. Reiner Lastschutz: je 50 Hotels ein API-Aufruf pro Tag (typisch 1–6 je Suche). Werden mehr gefunden als erlaubt, nennt das Add-on-Log die weggelassenen. Standard 20."
  trippilot_home_location:
    name: TripPilot Heimatort (PLZ/Ort)
    description: "Vorbelegung für die TripPilot-Frage 'Von wo geht's los?' (bei Anreise mit Auto/Bus/Bahn oder Tagesausflug). Leer lassen, wenn nicht gewünscht — im Fragebogen jederzeit änderbar."
  ha_sensors:
    name: Home-Assistant-Sensoren
    description: "Je verfolgtem Angebot einen Sensor (sensor.tuiwatch_<hotelname>) in Home Assistant anlegen. Wert = aktueller Preis in €, bei Fehler 'unknown'; Reise-Eckdaten stehen im Attribut 'description'. Standard an."
  notify_ha:
    name: HA-Benachrichtigungen
    description: "Bei Preisänderung oder erreichtem Wunschpreis eine persistente Home-Assistant-Benachrichtigung anzeigen. Standard an."
  ha_notify_service:
    name: Zusätzlicher HA-Notify-Dienst
    description: "Optional: Name eines notify-Dienstes (z. B. mobile_app_mein_handy für Push über die Companion-App), an den jede Benachrichtigung zusätzlich geht. Mehrere Dienste mit Komma trennen; leer = nur persistente Benachrichtigung."
  notify_price_change:
    name: Bei jeder Preisänderung benachrichtigen
    description: "Benachrichtigen, sobald sich ein Preis ändert (gestiegen/gefallen). Wunschpreis-Benachrichtigungen kommen unabhängig davon immer. Standard an."
  notify_cheaper_date:
    name: Günstigerer-Termin-Alarm
    description: "Benachrichtigen, wenn der Preiskalender einen anderen Abreisetag (auch außerhalb deines Zeitraums) deutlich günstiger zeigt als dein getrackter Preis. Standard an."
  cheaper_date_min_diff:
    name: Mindest-Ersparnis für Termin-Alarm (€)
    description: "Ab welcher Ersparnis pro Person der Günstigerer-Termin-Alarm auslöst. Standard 50 €."
  notify_calendar_trend:
    name: Kalender-Preisänderung
    description: "Benachrichtigen, wenn sich im Preiskalender eines Angebots ein Preis für ein bereits bekanntes Reisedatum ändert (Hotelname + betroffener Monat, keine Details). Standard an."
  calendar_trend_min_diff:
    name: Mindest-Änderung für Kalender-Preisänderung (€)
    description: "Ab welcher Preisänderung pro Reisedatum die Kalender-Preisänderung-Benachrichtigung auslöst. Standard 20 € — kleinere Schwankungen werden nicht gemeldet (im Kalender selbst, Trend-Ansicht, weiterhin sichtbar, nur die Benachrichtigung wird gefiltert)."
  calendar_daily_refresh:
    name: Täglicher Kalender-Refresh
    description: "Hält den Preiskalender aktiver Angebote 1×/Tag aktuell (macht Trend-Ansicht und Buchungsscore-Signal aussagekräftiger). Standard an."
  notify_errors:
    name: Ausverkauft-/Fehler-Alarm
    description: "Benachrichtigen, wenn ein Angebot mehrmals hintereinander kein Ergebnis liefert (Kontingent ausgebucht oder URL veraltet). Standard an."
  notify_api_errors:
    name: API-Ausfall-Alarm
    description: "Benachrichtigen, wenn der API-Selbsttest einen kritischen TUI-Endpunkt als gestört erkennt (TUI hat evtl. die API geändert), und Entwarnung geben, sobald wieder alles läuft. Standard an."
  notify_unavailable:
    name: Alarm nicht mehr buchbar
    description: "Benachrichtigen, wenn das TUI-Buchungssystem ein zuvor bestätigtes Angebot nicht mehr bestätigt (evtl. ausgebucht) — und Entwarnung geben, sobald es wieder bestätigt wird. Standard an."
  notify_booking_changes:
    name: Alarm Buchungsdetails geändert
    description: "Benachrichtigen, wenn sich bestätigte Buchungsdetails eines Angebots ändern: Flugzeiten/Flugnummern/Buchungsklasse oder die Veranstalter-Hinweise (Errata). Standard an."
  notify_booked_drop:
    name: Alarm günstiger als gebucht
    description: "Benachrichtigen, wenn der Preis nach deiner Buchung unter den hinterlegten gebuchten Preis fällt (Umbuchen könnte sich lohnen). Standard an."
  booked_drop_min_diff:
    name: Mindest-Ersparnis unter Buchungspreis (€)
    description: "Ab welcher Ersparnis pro Person der Alarm günstiger als gebucht auslöst. Standard 50 €."
  digest_enabled:
    name: Wochenüberblick senden
    description: "Wöchentliche Zusammenfassung (größte Rückgänge, neue Tiefstwerte, Angebote unter Wunschpreis) per Telegram und/oder E-Mail verschicken. Benötigt Telegram oder SMTP. Standard aus."
  digest_weekday:
    name: Wochentag für den Überblick
    description: "An welchem Wochentag der Wochenüberblick verschickt wird: 1 = Montag … 7 = Sonntag. Standard 1 (Montag)."
  notify_aktionscodes:
    name: Aktionscode-Alarm
    description: "Benachrichtigen, wenn neue öffentliche TUI-Aktionscodes erscheinen. Standard an."
  aktionscode_min:
    name: Mindestwert für Aktionscode-Alarm (€)
    description: "Nur Aktionscodes ab diesem Wert melden (0 = alle). Standard 0."
  aktionscode_interval:
    name: Aktionscode-Prüfintervall (Sekunden)
    description: "Wie oft die öffentlichen Aktionscodes geprüft werden. Standard 21600 (6 Stunden), Minimum 1800."
  auto_backup:
    name: Automatisches Backup
    description: "Wöchentlich ein vollständiges Backup (Angebote inkl. Verlauf, Reisen inkl. PDF, gespeicherte Suchen) als ZIP unter /addon_config/backups ablegen — übersteht eine Neuinstallation des Add-ons. Standard an."
  auto_backup_keep:
    name: Auto-Backups behalten (Anzahl)
    description: "Wie viele automatische Backups aufbewahrt werden; ältere werden gelöscht. Standard 5."
  telegram_bot_token:
    name: Telegram Bot Token
    description: "Token eines Telegram-Bots (Format 123456789:ABC-...), um Benachrichtigungen per Telegram zu erhalten. Leer lassen, um Telegram zu deaktivieren. Bot erstellen via @BotFather."
  telegram_chat_id:
    name: Telegram Chat ID
    description: "Chat-ID des Empfängers für Telegram-Nachrichten. Ermitteln via @userinfobot oder dem Bot /start schicken."
  smtp_host:
    name: SMTP-Server
    description: "Mailserver für den E-Mail-Versand der Angebote (z. B. smtp.gmail.com). Leer lassen = E-Mail-Funktion aus."
  smtp_port:
    name: SMTP-Port
    description: "Port des Mailservers. 587 für STARTTLS (Standard), 465 für SSL."
  smtp_user:
    name: SMTP-Benutzer
    description: "Benutzername/Anmeldung am Mailserver (oft die E-Mail-Adresse)."
  smtp_password:
    name: SMTP-Passwort
    description: "Passwort bzw. App-Passwort für den Mailserver."
  smtp_from:
    name: Absenderadresse
    description: "Sichtbare Absenderadresse. Leer = SMTP-Benutzer wird verwendet."
  smtp_to:
    name: Standard-Empfänger
    description: "Vorbelegter Empfänger für die Angebots-E-Mail (kann vor dem Senden im UI geändert werden)."
  smtp_tls:
    name: STARTTLS verwenden
    description: "An = STARTTLS (Port 587). Aus = SSL/TLS direkt (Port 465)."
  nc_addressbook_url:
    name: Nextcloud-Adressbuch-URL
    description: "Volle CardDAV-URL des Adressbuchs, wie sie Nextcloud in der Kontakte-App zum Kopieren anbietet (z. B. https://cloud.example.com/remote.php/dav/addressbooks/users/nutzer/contacts/). Leer lassen = kein Adressbuch, E-Mail-Empfänger bleibt Freitext."
  nc_user:
    name: Nextcloud-Benutzername
    description: "Nextcloud-Benutzername für den Zugriff auf das Adressbuch."
  nc_app_password:
    name: Nextcloud-App-Passwort
    description: "App-Passwort (nicht das normale Login-Passwort!) — erstellbar unter Nextcloud-Einstellungen → Sicherheit → Geräte & Sitzungen → Neues App-Passwort."
  anthropic_api_key:
    name: Anthropic API-Key
    description: "API-Key für Claude (console.anthropic.com), aktiviert das 'KI-Fazit' in der Hotelsuche (Lage, Zimmer, Restaurants, Pool, Ausstattung). Leer lassen = Funktion aus."
  anthropic_model:
    name: Claude-Modell fürs KI-Fazit
    description: "Welches Claude-Modell für die Hotel-Zusammenfassung genutzt wird. Opus = Standard, sehr gründlich. Sonnet = schneller/günstiger bei kaum schlechterer Qualität. Haiku = am günstigsten, kürzer. Fable = leistungsfähigstes Modell, teuerster Aufruf."
  ai_provider:
    name: KI-Anbieter
    description: "Welcher KI-Anbieter für ALLE KI-Features genutzt wird (KI-Fazit, Vergleich, TripPilot/Tagesausflug, Auto-Tags, Portfolio-Frage). anthropic = Claude (Standard), gemini = Google Gemini (z. B. für Google-Search-Grounding), perplexity = Perplexity Sonar (auf Websuche spezialisiert, teurer). Braucht den jeweils passenden API-Key unten. Sind mehrere Keys hinterlegt, lässt sich im Footer der Web-Oberfläche live umschalten."
  gemini_api_key:
    name: Gemini API-Key
    description: "API-Key für Google Gemini (aistudio.google.com), nur relevant wenn 'KI-Anbieter' = gemini. Leer lassen = Funktion aus."
  gemini_model:
    name: Gemini-Modell
    description: "Welches Gemini-Modell genutzt wird, wenn 'KI-Anbieter' = gemini. 3.1 Pro = Flaggschiff, sehr gründlich. 3.6 Flash = neuestes Flash-Modell, günstiger als 3.5. 3.5 Flash = ausgewogen. 2.5 Flash = am günstigsten, wird aber am 16.10.2026 von Google abgeschaltet — rechtzeitig umstellen."
  perplexity_api_key:
    name: Perplexity API-Key
    description: "API-Key für Perplexity (perplexity.ai/settings/api), nur relevant wenn 'KI-Anbieter' = perplexity. Sonar-Modelle durchsuchen bei JEDER Anfrage automatisch das Web (kein Websuche-Schalter nötig) — dafür pro Anfrage teurer als Claude/Gemini, inkl. zusätzlicher Request-Gebühr oben auf die Tokenkosten. Leer lassen = Funktion aus."
  perplexity_model:
    name: Perplexity-Modell
    description: "Welches Perplexity-Modell genutzt wird, wenn 'KI-Anbieter' = perplexity. sonar = günstigstes Basismodell. sonar-pro = Standard, gründlicher bei komplexeren Fragen. sonar-reasoning-pro = mit Zwischenschritten für schwierigere Abwägungen. sonar-deep-research = ausführlichste, teuerste Recherche."
  ai_max_web_searches:
    name: Max. Websuchen pro KI-Aufruf
    description: "Deckelt, wie oft Claude bei einem einzelnen KI-Aufruf (Fazit, Vergleich, Reiseberater/TripPilot, Tagesausflug) selbstständig das Web durchsuchen darf. Mehr Suchen = gründlicher, aber mehr Input-Tokens und höhere Kosten. Standard 12 — z. B. 8 für sparsamer, 20 für sehr gründlich bei mehreren Zielen/Hotels. Gilt nur bei Anthropic/Claude — Gemini/Perplexity kennen kein Limit für die Anzahl Websuchen."
  ai_prompt_preview:
    name: KI-Prompt vor dem Senden anzeigen
    description: "Zeigt bei interaktiven KI-Anfragen (KI-Fazit, Vergleich, Buchungsscore, Kalender-Analyse, Region-Ausblick, Portfolio-Frage, TripPilot/Tagesausflug, Verlauf-Wiederholen, Folgefrage) den fertigen Prompt vorher in einem editierbaren Fenster an — erst nach Bestätigung/ggf. Anpassung wird er wirklich an die KI geschickt. Automatische Hintergrund-Läufe (Wochenüberblick, Aktionscode-Check, Auto-Tags) sind davon nicht betroffen. Standard aus."
  enable_check24_compare:
    name: Check24-Preisvergleich (Beta)
    description: "Erlaubt, ein Angebot mit einem manuell verknüpften Check24-Hotel zu vergleichen (andere Reiseveranstalter, gleiche Reisedaten). Nutzt Headless-Chromium gegen Check24 (kein offenes API), daher fragiler als der TUI-Abruf und ein zusätzliches externes ToS-Risiko. Standard aus — bewusst opt-in."
  enable_public_share:
    name: Öffentliche Angebots-Links
    description: "Schaltet Links frei, mit denen sich ausgewählte Angebote ohne Login anschauen lassen (wie die Angebotsseite eines Reisebüros) — inklusive gespeicherter Klimatabelle, Reiseführer und Reiseberater-Ergebnis. Die Seite läuft auf einem eigenen Port (siehe „Port für öffentliche Links“), zeigt nur einen beim Erzeugen eingefrorenen Stand und erlaubt keinerlei Abfragen. Nur diesen zweiten Port im Reverse-Proxy nach außen geben, niemals 17794. Standard aus."
  public_port:
    name: Port für öffentliche Links
    description: "Port, auf dem die öffentlichen Angebots-Seiten ausgeliefert werden. Standard 17796. Der Port muss zusätzlich in der Konfiguration des Add-ons unter „Netzwerk“ veröffentlicht werden, sonst ist er nur containerintern erreichbar."
  public_base_url:
    name: Öffentliche Basis-URL
    description: "Adresse, unter der die öffentlichen Links von außen erreichbar sind, z. B. https://reise.example.com — daraus baut TUIWatch den fertigen Link zum Weitergeben. Bleibt das Feld leer, wird nur der Pfad /s/<token> angezeigt."
  public_share_days:
    name: Gültigkeit öffentlicher Links (Tage)
    description: "Voreingestellte Gültigkeit beim Erzeugen eines öffentlichen Links. Danach zeigt der Link nur noch einen Hinweis; im Dialog lässt sich pro Link ein anderer Wert wählen (1 bis 365). Standard 30."
  verbose_log:
    name: Ausführliches Logging
    description: Gibt mehr Details pro Prüfung im Log aus. Standard aus — nur Fehler und wichtige Ereignisse werden geloggt.
