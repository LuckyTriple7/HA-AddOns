name: Playwright Browser
description: Headless Chromium browser with CDP endpoint for Claude Code browser automation
version: "1.0.14"
image: "ghcr.io/luckytriple7/playwright-browser"
slug: playwright-browser
url: https://github.com/LuckyTriple7/HA-AddOns
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
ingress: false
panel_icon: mdi:google-chrome
panel_title: Playwright Browser
options:
  cdp_port: 9222
  idle_timeout: 5
schema:
  cdp_port: port
  idle_timeout: int
ports:
  9222/tcp: null
ports_description:
  9222/tcp: Chrome DevTools Protocol (CDP) endpoint
