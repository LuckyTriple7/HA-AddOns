name: Check Webtop Package Updates

on:
  schedule:
    - cron: '0 1 * * *'   # täglich um 1:00 UTC (3:00 CEST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Versionen prüfen und eintragen
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/webtop-updates.sh

      - name: PR mit Updates erstellen
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          # fester Branch: ein offener PR wird beim nächsten Lauf aktualisiert statt blockiert
          branch: update/webtop
          delete-branch: true
          add-paths: |
            ubuntu-webtop/Dockerfile
            ubuntu-webtop/config.yaml
            ubuntu-webtop/CHANGELOG.md
            .webtop-*-version
          commit-message: "Webtop v${{ steps.update.outputs.new_version }}: Paket-Updates ${{ steps.update.outputs.date }}"
          title: "Webtop ${{ steps.update.outputs.new_version }}: Paket-Updates (${{ steps.update.outputs.date }})"
          body: |
            ## Webtop Paket-Updates

            ### Geänderte Versionen
            ${{ steps.update.outputs.changes }}

            ### Hinweis
            Nach dem Merge: **Update + Neu Aufbauen** in Home Assistant.
            Alle Pakete (inkl. LibreOffice, XFCE, VLC) werden dann auf den neuesten Stand gebracht.

            _Automatisch erstellt von GitHub Actions._
