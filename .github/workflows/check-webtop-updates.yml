name: Check Webtop Package Updates

on:
  schedule:
    - cron: '0 1 * * *'   # täglich um 1:00 UTC (3:00 CEST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Aktuelle Versionen ermitteln
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER="Authorization: Bearer ${GH_TOKEN}"

          check_version() {
            NAME="$1"; VALUE="$2"
            if [ -z "$VALUE" ] || [ "$VALUE" = "null" ]; then
              echo "::error::Konnte Version für ${NAME} nicht ermitteln — API-Fehler oder Rate-Limit?"
              exit 1
            fi
          }

          BW=$(curl -s -H "$AUTH_HEADER" "https://api.github.com/repos/bitwarden/clients/releases" \
            | jq -r '[.[] | select(.tag_name | startswith("desktop-v")) | select(.prerelease==false)][0].tag_name' \
            | sed 's/desktop-v//')
          check_version "Bitwarden" "$BW"

          IPSCAN=$(curl -s -H "$AUTH_HEADER" "https://api.github.com/repos/angryip/ipscan/releases/latest" \
            | jq -r '.tag_name' | sed 's/^v//')
          check_version "Angry IP Scanner" "$IPSCAN"

          VSCODE=$(curl -s -H "$AUTH_HEADER" "https://api.github.com/repos/microsoft/vscode/releases/latest" \
            | jq -r '.tag_name')
          check_version "VS Code" "$VSCODE"

          GHCLI=$(curl -s -H "$AUTH_HEADER" "https://api.github.com/repos/cli/cli/releases/latest" \
            | jq -r '.tag_name' | sed 's/^v//')
          check_version "GitHub CLI" "$GHCLI"

          FIREFOX=$(curl -s "https://product-details.mozilla.org/1.0/firefox_versions.json" \
            | jq -r '.LATEST_FIREFOX_VERSION')
          check_version "Firefox" "$FIREFOX"

          THUNDERBIRD=$(curl -s "https://product-details.mozilla.org/1.0/thunderbird_versions.json" \
            | jq -r '.LATEST_THUNDERBIRD_VERSION')
          check_version "Thunderbird" "$THUNDERBIRD"

          RCLONE=$(curl -s -H "$AUTH_HEADER" "https://api.github.com/repos/rclone/rclone/releases/latest" \
            | jq -r '.tag_name' | sed 's/^v//')
          check_version "rclone" "$RCLONE"

          CLAUDE_DESKTOP=$(curl -s -H "$AUTH_HEADER" "https://api.github.com/repos/aaddrick/claude-desktop-debian/releases/latest" \
            | jq -r '.tag_name' | sed 's/^v//')
          check_version "Claude Desktop" "$CLAUDE_DESKTOP"

          OPENCODE=$(curl -s -H "$AUTH_HEADER" "https://api.github.com/repos/anomalyco/opencode/releases/latest" \
            | jq -r '.tag_name' | sed 's/^v//')
          check_version "OpenCode" "$OPENCODE"

          echo "bitwarden=${BW}"              >> $GITHUB_OUTPUT
          echo "ipscan=${IPSCAN}"             >> $GITHUB_OUTPUT
          echo "vscode=${VSCODE}"             >> $GITHUB_OUTPUT
          echo "ghcli=${GHCLI}"               >> $GITHUB_OUTPUT
          echo "firefox=${FIREFOX}"           >> $GITHUB_OUTPUT
          echo "thunderbird=${THUNDERBIRD}"   >> $GITHUB_OUTPUT
          echo "rclone=${RCLONE}"             >> $GITHUB_OUTPUT
          echo "claude_desktop=${CLAUDE_DESKTOP}" >> $GITHUB_OUTPUT
          echo "opencode=${OPENCODE}"         >> $GITHUB_OUTPUT
          echo "Bitwarden: ${BW} | AngryIP: ${IPSCAN} | VSCode: ${VSCODE} | GH CLI: ${GHCLI} | Firefox: ${FIREFOX} | Thunderbird: ${THUNDERBIRD} | rclone: ${RCLONE} | Claude Desktop: ${CLAUDE_DESKTOP} | OpenCode: ${OPENCODE}"

      - name: Getrackte Versionen lesen
        id: tracked
        run: |
          echo "bitwarden=$(cat .webtop-bitwarden-version   2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          echo "ipscan=$(cat .webtop-ipscan-version         2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          echo "vscode=$(cat .webtop-vscode-version         2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          echo "ghcli=$(cat .webtop-ghcli-version           2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          echo "firefox=$(cat .webtop-firefox-version       2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          echo "thunderbird=$(cat .webtop-thunderbird-version 2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          echo "rclone=$(cat .webtop-rclone-version         2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          echo "claude_desktop=$(cat .webtop-claude-desktop-version 2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          echo "opencode=$(cat .webtop-opencode-version     2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT

      - name: Änderungen prüfen
        id: check
        run: |
          CHANGED=false
          CHANGES=""
          if [ "${{ steps.latest.outputs.bitwarden }}"    != "${{ steps.tracked.outputs.bitwarden }}" ];    then CHANGED=true; CHANGES="${CHANGES}\n- Bitwarden: ${{ steps.tracked.outputs.bitwarden }} → ${{ steps.latest.outputs.bitwarden }}"; fi
          if [ "${{ steps.latest.outputs.ipscan }}"       != "${{ steps.tracked.outputs.ipscan }}" ];       then CHANGED=true; CHANGES="${CHANGES}\n- Angry IP Scanner: ${{ steps.tracked.outputs.ipscan }} → ${{ steps.latest.outputs.ipscan }}"; fi
          if [ "${{ steps.latest.outputs.vscode }}"       != "${{ steps.tracked.outputs.vscode }}" ];       then CHANGED=true; CHANGES="${CHANGES}\n- VS Code: ${{ steps.tracked.outputs.vscode }} → ${{ steps.latest.outputs.vscode }}"; fi
          if [ "${{ steps.latest.outputs.ghcli }}"        != "${{ steps.tracked.outputs.ghcli }}" ];        then CHANGED=true; CHANGES="${CHANGES}\n- GitHub CLI: ${{ steps.tracked.outputs.ghcli }} → ${{ steps.latest.outputs.ghcli }}"; fi
          if [ "${{ steps.latest.outputs.firefox }}"      != "${{ steps.tracked.outputs.firefox }}" ];      then CHANGED=true; CHANGES="${CHANGES}\n- Firefox: ${{ steps.tracked.outputs.firefox }} → ${{ steps.latest.outputs.firefox }}"; fi
          if [ "${{ steps.latest.outputs.thunderbird }}"  != "${{ steps.tracked.outputs.thunderbird }}" ];  then CHANGED=true; CHANGES="${CHANGES}\n- Thunderbird: ${{ steps.tracked.outputs.thunderbird }} → ${{ steps.latest.outputs.thunderbird }}"; fi
          if [ "${{ steps.latest.outputs.rclone }}"         != "${{ steps.tracked.outputs.rclone }}" ];         then CHANGED=true; CHANGES="${CHANGES}\n- rclone: ${{ steps.tracked.outputs.rclone }} → ${{ steps.latest.outputs.rclone }}"; fi
          if [ "${{ steps.latest.outputs.claude_desktop }}" != "${{ steps.tracked.outputs.claude_desktop }}" ]; then CHANGED=true; CHANGES="${CHANGES}\n- Claude Desktop: ${{ steps.tracked.outputs.claude_desktop }} → ${{ steps.latest.outputs.claude_desktop }}"; fi
          if [ "${{ steps.latest.outputs.opencode }}"       != "${{ steps.tracked.outputs.opencode }}" ];       then CHANGED=true; CHANGES="${CHANGES}\n- OpenCode: ${{ steps.tracked.outputs.opencode }} → ${{ steps.latest.outputs.opencode }}"; fi
          echo "changed=${CHANGED}" >> $GITHUB_OUTPUT
          echo "changes=${CHANGES}" >> $GITHUB_OUTPUT
          if [ "$CHANGED" = "false" ]; then echo "Alle Webtop-Pakete aktuell — nichts zu tun."; fi

      - name: PR mit Updates erstellen
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BW_VER:   ${{ steps.latest.outputs.bitwarden }}
          IP_VER:   ${{ steps.latest.outputs.ipscan }}
          VS_VER:   ${{ steps.latest.outputs.vscode }}
          GH_VER:   ${{ steps.latest.outputs.ghcli }}
          FF_VER:   ${{ steps.latest.outputs.firefox }}
          TB_VER:   ${{ steps.latest.outputs.thunderbird }}
          RC_VER:   ${{ steps.latest.outputs.rclone }}
          CD_VER:   ${{ steps.latest.outputs.claude_desktop }}
          OC_VER:   ${{ steps.latest.outputs.opencode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE=$(date +%Y-%m-%d)
          BRANCH="update/webtop-${DATE}"

          EXISTING_PR=$(gh pr list --state open --json headRefName,number \
            --jq '[.[] | select(.headRefName | startswith("update/webtop-"))][0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "Offener Webtop-PR #${EXISTING_PR} existiert bereits — überspringe."
            exit 0
          fi

          git checkout -b "$BRANCH"

          # Dockerfile ARGs aktualisieren
          sed -i "s/ARG BITWARDEN_VERSION=.*/ARG BITWARDEN_VERSION=${BW_VER}/" ubuntu-webtop/Dockerfile
          sed -i "s/ARG IPSCAN_VERSION=.*/ARG IPSCAN_VERSION=${IP_VER}/"       ubuntu-webtop/Dockerfile
          sed -i "s/ARG VSCODE_VERSION=.*/ARG VSCODE_VERSION=${VS_VER}/"       ubuntu-webtop/Dockerfile
          sed -i "s/ARG GH_CLI_VERSION=.*/ARG GH_CLI_VERSION=${GH_VER}/"       ubuntu-webtop/Dockerfile
          sed -i "s/ARG FIREFOX_VERSION=.*/ARG FIREFOX_VERSION=${FF_VER}/"     ubuntu-webtop/Dockerfile
          sed -i "s/ARG THUNDERBIRD_VERSION=.*/ARG THUNDERBIRD_VERSION=${TB_VER}/" ubuntu-webtop/Dockerfile
          sed -i "s/ARG RCLONE_VERSION=.*/ARG RCLONE_VERSION=${RC_VER}/"         ubuntu-webtop/Dockerfile
          sed -i "s/ARG OPENCODE_VERSION=.*/ARG OPENCODE_VERSION=${OC_VER}/"     ubuntu-webtop/Dockerfile

          # Tracking-Dateien aktualisieren
          echo "$BW_VER" > .webtop-bitwarden-version
          echo "$IP_VER" > .webtop-ipscan-version
          echo "$VS_VER" > .webtop-vscode-version
          echo "$GH_VER" > .webtop-ghcli-version
          echo "$FF_VER" > .webtop-firefox-version
          echo "$TB_VER" > .webtop-thunderbird-version
          echo "$RC_VER" > .webtop-rclone-version
          echo "$CD_VER" > .webtop-claude-desktop-version
          echo "$OC_VER" > .webtop-opencode-version

          # Add-on Version bumpen
          ADDON_VER=$(grep '^version:' ubuntu-webtop/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          MAJOR=$(echo $ADDON_VER | cut -d. -f1)
          MINOR=$(echo $ADDON_VER | cut -d. -f2)
          PATCH=$(echo $ADDON_VER | cut -d. -f3)
          NEW_ADDON_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"

          sed -i "s/version: \"${ADDON_VER}\"/version: \"${NEW_ADDON_VER}\"/" ubuntu-webtop/config.yaml

          # CHANGELOG aktualisieren (kein sed — CHANGES_TEXT enthält echte Zeilenumbrüche)
          CHANGES_TEXT=$(printf "${{ steps.check.outputs.changes }}")
          {
            printf "## [%s] - %s\n\n### Aktualisiert\n%s\n\n" "${NEW_ADDON_VER}" "${DATE}" "${CHANGES_TEXT}"
            cat ubuntu-webtop/CHANGELOG.md
          } > /tmp/changelog_new.md
          mv /tmp/changelog_new.md ubuntu-webtop/CHANGELOG.md

          git add ubuntu-webtop/Dockerfile ubuntu-webtop/config.yaml ubuntu-webtop/CHANGELOG.md \
                  .webtop-bitwarden-version .webtop-ipscan-version .webtop-vscode-version \
                  .webtop-ghcli-version .webtop-firefox-version .webtop-thunderbird-version \
                  .webtop-rclone-version .webtop-claude-desktop-version .webtop-opencode-version
          git commit -m "Webtop v${NEW_ADDON_VER}: Paket-Updates ${DATE}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Webtop ${NEW_ADDON_VER}: Paket-Updates (${DATE})" \
            --body "$(printf '## Webtop Paket-Updates\n\n### Geänderte Versionen\n%s\n\n### Hinweis\nNach dem Merge: **Update + Neu Aufbauen** in Home Assistant.\nAlle Pakete (inkl. LibreOffice, XFCE, VLC) werden dann auf den neuesten Stand gebracht.\n\n_Automatisch erstellt von GitHub Actions._' "${{ steps.check.outputs.changes }}")" \
            --base dev
