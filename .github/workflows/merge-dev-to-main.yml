name: Dev → Main PR erstellen

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prüfen ob Commits vorhanden
        id: check
        run: |
          AHEAD=$(git log origin/main..origin/dev --oneline --no-merges | wc -l | tr -d ' ')
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -eq "0" ]; then
            echo "main ist bereits aktuell – kein PR nötig."
          else
            echo "$AHEAD Commit(s) von dev bereit für main."
          fi

      - name: PR erstellen
        if: steps.check.outputs.ahead != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: dev
          title: "chore: merge dev → main (${{ github.run_id }})"
          body: |
            Automatisch erstellter PR – ${{ steps.check.outputs.ahead }} Commit(s) von `dev` nach `main`.

            Bitte vor dem Merge prüfen.
          labels: auto-merge
          draft: false
