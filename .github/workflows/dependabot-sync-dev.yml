name: Dependabot → Sync main nach dev

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    if: github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: main → dev mergen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout dev
          git merge origin/main --no-edit -m "chore(deps): Dependabot-Fix von main nach dev übernommen"
          git push origin dev
