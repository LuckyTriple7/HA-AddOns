name: Check Firefox Update

on:
  schedule:
    - cron: '0 1 * * *'   # täglich um 1:00 UTC (3:00 CEST)
    - cron: '0 13 * * *'  # täglich um 13:00 UTC (15:00 CEST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Get latest Firefox ESR version (Mozilla API)
        id: upstream
        run: |
          VERSION=$(curl -s "https://product-details.mozilla.org/1.0/firefox_versions.json" | jq -r '.FIREFOX_ESR')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Upstream Firefox ESR: ${VERSION}"

      - name: Get tracked version
        id: tracked
        run: |
          if [ -f .firefox-version ]; then
            echo "version=$(cat .firefox-version)" >> $GITHUB_OUTPUT
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Skip if already up to date
        if: steps.upstream.outputs.version == steps.tracked.outputs.version
        run: echo "Firefox ESR ${{ steps.upstream.outputs.version }} wird bereits gebaut — nichts zu tun."

      - name: Compute new add-on version
        if: steps.upstream.outputs.version != steps.tracked.outputs.version
        id: versions
        run: |
          ADDON_VER=$(grep '^version:' firefox/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          MAJOR=$(echo $ADDON_VER | cut -d. -f1)
          MINOR=$(echo $ADDON_VER | cut -d. -f2)
          PATCH=$(echo $ADDON_VER | cut -d. -f3)
          NEW_ADDON_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "old=${ADDON_VER}" >> $GITHUB_OUTPUT
          echo "new=${NEW_ADDON_VER}" >> $GITHUB_OUTPUT

      - name: Prepare files
        if: steps.upstream.outputs.version != steps.tracked.outputs.version
        env:
          FF_VER: ${{ steps.upstream.outputs.version }}
          OLD_ADDON_VER: ${{ steps.versions.outputs.old }}
          NEW_ADDON_VER: ${{ steps.versions.outputs.new }}
        run: |
          DATE=$(date +%Y-%m-%d)

          sed -i "s/version: \"${OLD_ADDON_VER}\"/version: \"${NEW_ADDON_VER}\"/" firefox/config.yaml
          echo "$FF_VER" > .firefox-version

          ENTRY="## [${NEW_ADDON_VER}] - ${DATE}\n\n### Geändert\n- Rebuild für Firefox ESR ${FF_VER}\n"
          sed -i "0,/^## \[/{s/^## \[/ENTRY_PLACEHOLDER\n\n## [/}" firefox/CHANGELOG.md
          sed -i "s|ENTRY_PLACEHOLDER|${ENTRY}|" firefox/CHANGELOG.md

      - name: Create Pull Request
        if: steps.upstream.outputs.version != steps.tracked.outputs.version
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          branch: update/firefox-esr-${{ steps.upstream.outputs.version }}
          delete-branch: true
          commit-message: "Bump Firefox Add-on zu v${{ steps.versions.outputs.new }} — Firefox ESR ${{ steps.upstream.outputs.version }}"
          title: "Update Firefox ESR ${{ steps.upstream.outputs.version }} (Add-on v${{ steps.versions.outputs.new }})"
          body: |
            ## Firefox Update

            Neue Firefox ESR Version **${{ steps.upstream.outputs.version }}** verfügbar.

            ### Änderungen
            - Add-on Version: `${{ steps.versions.outputs.old }}` → `${{ steps.versions.outputs.new }}`
            - Firefox ESR: `${{ steps.upstream.outputs.version }}`

            Nach dem Merge wird das Image automatisch via `build-firefox.yml` gebaut.

            ---
            _Automatisch erstellt von GitHub Actions._
          labels: "auto-update"
