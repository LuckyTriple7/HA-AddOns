name: Check Nextcloud Update

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Hole aktuelle Nextcloud-Version (linuxserver.io)
        id: remote
        run: |
          # Wir bleiben bewusst auf Nextcloud 33. Seit linuxserver 34 als Mainline
          # ausliefert, erscheinen 33er-Releases im "previous-"-Kanal:
          # previous-33.x.y-lsNNN (z. B. previous-33.0.6-ls105).
          FULL_TAG=$(curl -s "https://hub.docker.com/v2/repositories/linuxserver/nextcloud/tags/?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E '^previous-33\.[0-9]+\.[0-9]+-ls[0-9]+$' \
            | sort -V | tail -1 || true)
          if [ -z "$FULL_TAG" ]; then
            echo "Konnte aktuelle Version nicht ermitteln — API-Fehler oder 33 nicht mehr im previous-Kanal?"
            exit 1
          fi
          VERSION=$(echo "$FULL_TAG" | grep -oE '33\.[0-9]+\.[0-9]+')
          echo "remote=${VERSION}" >> $GITHUB_OUTPUT
          echo "full_tag=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "Aktuelle linuxserver Nextcloud-Version: ${VERSION} (Tag: ${FULL_TAG})"

      - name: Hole gebaute Version aus Versionsdatei
        id: local
        run: |
          if [ -f .nextcloud-version ]; then
            echo "version=$(cat .nextcloud-version)" >> $GITHUB_OUTPUT
            echo "Gebaute Version: $(cat .nextcloud-version)"
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
            echo "Noch keine Versionsdatei vorhanden"
          fi

      - name: Vergleiche Versionen
        id: compare
        run: |
          REMOTE="${{ steps.remote.outputs.remote }}"
          LOCAL="${{ steps.local.outputs.version }}"
          echo "Remote: ${REMOTE} | Lokal: ${LOCAL}"
          if [ "$REMOTE" != "$LOCAL" ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "Neue Version verfügbar: ${REMOTE} (bisher: ${LOCAL})"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "Kein Update notwendig"
          fi

      - name: Berechne neue Add-on-Version
        id: newversion
        if: steps.compare.outputs.rebuild == 'true'
        run: |
          CURRENT=$(grep '^version:' nextcloud/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Add-on Version: ${CURRENT} → ${NEW_VERSION}"

      - name: Versionsdatei, config.yaml, Dockerfile und CHANGELOG aktualisieren
        if: steps.compare.outputs.rebuild == 'true'
        run: |
          NC_VERSION="${{ steps.remote.outputs.remote }}"
          FULL_TAG="${{ steps.remote.outputs.full_tag }}"
          NEW_VERSION="${{ steps.newversion.outputs.new_version }}"
          CURRENT=$(grep '^version:' nextcloud/config.yaml | sed 's/version: *"\(.*\)"/\1/')

          echo "${NC_VERSION}" > .nextcloud-version
          sed -i "s/^version: \"${CURRENT}\"/version: \"${NEW_VERSION}\"/" nextcloud/config.yaml
          sed -i "s|FROM lscr.io/linuxserver/nextcloud:.*|FROM lscr.io/linuxserver/nextcloud:${FULL_TAG}|" nextcloud/Dockerfile

          CHANGELOG_ENTRY="## ${NEW_VERSION}\n- Nextcloud Base-Image aktualisiert auf linuxserver/nextcloud ${NC_VERSION} (${FULL_TAG})"
          sed -i "s|# Changelog — Nextcloud|# Changelog — Nextcloud\n\n${CHANGELOG_ENTRY}|" nextcloud/CHANGELOG.md

      - name: Pull Request erstellen
        if: steps.compare.outputs.rebuild == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          commit-message: "Nextcloud: Update auf linuxserver/nextcloud ${{ steps.remote.outputs.remote }}"
          branch: "nextcloud-update/${{ steps.remote.outputs.remote }}"
          delete-branch: true
          title: "Nextcloud Update: linuxserver/nextcloud ${{ steps.remote.outputs.remote }}"
          body: |
            ## Nextcloud Base-Image Update

            | | Version |
            |---|---|
            | Nextcloud (linuxserver) | `${{ steps.remote.outputs.remote }}` |
            | Docker-Tag | `${{ steps.remote.outputs.full_tag }}` |
            | Add-on Version | `${{ steps.newversion.outputs.new_version }}` |

            Nach dem Merge wird das Image automatisch via `build-nextcloud.yml` gebaut.
          labels: "auto-update"
