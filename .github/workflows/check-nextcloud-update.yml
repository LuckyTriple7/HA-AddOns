name: Check Nextcloud Update

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Hole aktuelle Nextcloud-Version (linuxserver.io)
        id: remote
        run: |
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/linuxserver/nextcloud/tags/?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-ls' \
            | sort -V | tail -1 || true)
          if [ -z "$TAGS" ]; then
            echo "Konnte aktuelle Version nicht ermitteln — API-Fehler?"
            exit 1
          fi
          VERSION=$(echo "$TAGS" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "remote=${VERSION}" >> $GITHUB_OUTPUT
          echo "Aktuelle linuxserver Nextcloud-Version: ${VERSION} (Tag: ${TAGS})"

      - name: Hole gebaute Version aus Versionsdatei
        id: local
        run: |
          if [ -f .nextcloud-version ]; then
            echo "version=$(cat .nextcloud-version)" >> $GITHUB_OUTPUT
            echo "Gebaute Version: $(cat .nextcloud-version)"
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
            echo "Noch keine Versionsdatei vorhanden"
          fi

      - name: Vergleiche Versionen
        id: compare
        run: |
          REMOTE="${{ steps.remote.outputs.remote }}"
          LOCAL="${{ steps.local.outputs.version }}"
          echo "Remote: ${REMOTE} | Lokal: ${LOCAL}"
          if [ "$REMOTE" != "$LOCAL" ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "Neue Version verfügbar: ${REMOTE} (bisher: ${LOCAL})"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "Kein Update notwendig"
          fi

      - name: Set up Docker Buildx
        if: steps.compare.outputs.rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.compare.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push updated image
        if: steps.compare.outputs.rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: nextcloud
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ghcr.io/luckytriple7/nextcloud:latest

      - name: Versionsdatei + config.yaml aktualisieren
        if: steps.compare.outputs.rebuild == 'true'
        run: |
          echo "${{ steps.remote.outputs.remote }}" > .nextcloud-version
          CURRENT=$(grep '^version:' nextcloud/config.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          sed -i "s/^version: \"${CURRENT}\"/version: \"${NEW_VERSION}\"/" nextcloud/config.yaml
          echo "Version: ${CURRENT} → ${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .nextcloud-version nextcloud/config.yaml
          git commit -m "Nextcloud: Auto-Update auf Nextcloud ${{ steps.remote.outputs.remote }} (v${NEW_VERSION})"
          git push
