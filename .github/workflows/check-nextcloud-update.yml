name: Check Nextcloud Update

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Hole aktuelle Nextcloud-Version (linuxserver.io)
        id: remote
        run: |
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/linuxserver/nextcloud/tags/?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-ls' \
            | sort -V | tail -1 || true)
          if [ -z "$TAGS" ]; then
            echo "Konnte aktuelle Version nicht ermitteln — API-Fehler?"
            exit 1
          fi
          VERSION=$(echo "$TAGS" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "remote=${VERSION}" >> $GITHUB_OUTPUT
          echo "Aktuelle linuxserver Nextcloud-Version: ${VERSION} (Tag: ${TAGS})"

      - name: Hole gebaute Version aus Versionsdatei
        id: local
        run: |
          if [ -f .nextcloud-version ]; then
            echo "version=$(cat .nextcloud-version)" >> $GITHUB_OUTPUT
            echo "Gebaute Version: $(cat .nextcloud-version)"
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
            echo "Noch keine Versionsdatei vorhanden"
          fi

      - name: Vergleiche Versionen
        id: compare
        run: |
          REMOTE="${{ steps.remote.outputs.remote }}"
          LOCAL="${{ steps.local.outputs.version }}"
          echo "Remote: ${REMOTE} | Lokal: ${LOCAL}"
          if [ "$REMOTE" != "$LOCAL" ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "Neue Version verfügbar: ${REMOTE} (bisher: ${LOCAL})"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "Kein Update notwendig"
          fi

      - name: Set up Docker Buildx
        if: steps.compare.outputs.rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.compare.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push updated image
        if: steps.compare.outputs.rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: nextcloud
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ghcr.io/luckytriple7/nextcloud:latest

      - name: Versionsdatei, config.yaml und CHANGELOG aktualisieren
        id: version
        if: steps.compare.outputs.rebuild == 'true'
        run: |
          NC_VERSION="${{ steps.remote.outputs.remote }}"
          echo "${NC_VERSION}" > .nextcloud-version

          CURRENT=$(grep '^version:' nextcloud/config.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          sed -i "s/^version: \"${CURRENT}\"/version: \"${NEW_VERSION}\"/" nextcloud/config.yaml
          echo "Version: ${CURRENT} → ${NEW_VERSION}"

          CHANGELOG_ENTRY="## ${NEW_VERSION}\n- Nextcloud Base-Image aktualisiert auf linuxserver/nextcloud ${NC_VERSION}"
          sed -i "s|# Changelog — Nextcloud|# Changelog — Nextcloud\n\n${CHANGELOG_ENTRY}|" nextcloud/CHANGELOG.md

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Pull Request erstellen
        if: steps.compare.outputs.rebuild == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Nextcloud: Update auf linuxserver/nextcloud ${{ steps.remote.outputs.remote }}"
          branch: "nextcloud-update/${{ steps.remote.outputs.remote }}"
          delete-branch: true
          title: "Nextcloud Update: linuxserver/nextcloud ${{ steps.remote.outputs.remote }}"
          body: |
            ## Nextcloud Base-Image Update

            | | Version |
            |---|---|
            | Nextcloud (linuxserver) | `${{ steps.remote.outputs.remote }}` |
            | Add-on Version | `${{ steps.version.outputs.new_version }}` |

            Das neue Image wurde bereits gebaut und in die GHCR gepusht.
            Bitte prüfen und mergen, um das Update zu aktivieren.
          labels: "auto-update"
