name: Build ReactorSim Image

on:
  push:
    branches: [dev]
    paths:
      - 'reactorsim/VERSION'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Erst prüfen, dann bauen. Vorher ging jeder VERSION-Bump ungeprüft als
  # Image nach GHCR -- die 68 Tests im Ordner liefen ausschließlich von Hand,
  # und ein rot gewordener Test wäre erst in der laufenden Anlage aufgefallen.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Abhängigkeiten
        run: |
          pip install --no-cache-dir -r reactorsim/requirements.txt pytest

      - name: Python-Tests
        working-directory: reactorsim
        run: pytest tests/ -q

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Die Simulation selbst ist JavaScript -- ohne diesen Schritt prüft die
      # CI ausgerechnet den Teil nicht, um den es in diesem Projekt geht.
      #
      # Das Muster steht in Anführungszeichen, damit node es selbst auflöst,
      # und es ist bewusst enger als `tests/`: daneben liegt tests/tools/ mit
      # Untersuchungsskripten, die keine Zusicherungen enthalten und beim
      # Einsammeln über das ganze Verzeichnis als leerer Fehlschlag zählen.
      - name: Simulationstests
        working-directory: reactorsim
        run: node --test "tests/test-*.mjs"

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: ver
        run: |
          VERSION=$(tr -d ' \t\r\n' < reactorsim/VERSION)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Baue Image für ReactorSim v${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: reactorsim
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ghcr.io/luckytriple7/reactorsim:${{ steps.ver.outputs.version }}
            ghcr.io/luckytriple7/reactorsim:latest

      - name: Alte Image-Versionen aufräumen
        uses: actions/delete-package-versions@v5
        with:
          package-name: reactorsim
          package-type: container
          min-versions-to-keep: 20
          token: ${{ secrets.GITHUB_TOKEN }}
