name: Check Claude Code Update

on:
  schedule:
    - cron: '0 1 * * *'   # täglich um 1:00 UTC (3:00 CEST)
    - cron: '0 13 * * *'  # täglich um 13:00 UTC (15:00 CEST)
  workflow_dispatch:       # manuell auslösbar

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Get latest Claude Code npm version
        id: claude
        run: |
          VERSION=$(npm show @anthropic-ai/claude-code version)
          if [ -z "$VERSION" ]; then
            echo "::error::Konnte Claude Code Version nicht ermitteln (npm show leer)."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get currently tracked version
        id: tracked
        run: |
          if [ -f .claude-code-version ]; then
            echo "version=$(cat .claude-code-version)" >> $GITHUB_OUTPUT
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Skip if already up to date
        if: steps.claude.outputs.version == steps.tracked.outputs.version
        run: echo "Claude Code ${{ steps.claude.outputs.version }} already tracked — nothing to do."

      - name: Prepare files
        if: steps.claude.outputs.version != steps.tracked.outputs.version
        id: prepare
        env:
          CLAUDE_VER: ${{ steps.claude.outputs.version }}
        run: |
          ADDON_VER=$(grep '^version:' claudecode/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          MAJOR=$(echo $ADDON_VER | cut -d. -f1)
          MINOR=$(echo $ADDON_VER | cut -d. -f2)
          PATCH=$(echo $ADDON_VER | cut -d. -f3)
          NEW_ADDON_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
          DATE=$(date +%Y-%m-%d)

          sed -i "s/version: \"${ADDON_VER}\"/version: \"${NEW_ADDON_VER}\"/" claudecode/config.yaml
          echo "$CLAUDE_VER" > .claude-code-version

          ENTRY="## [${NEW_ADDON_VER}] - ${DATE}\n\n### Changed\n- Rebuild für Claude Code ${CLAUDE_VER}\n"
          sed -i "0,/^## \[/{s/^## \[/ENTRY_PLACEHOLDER\n\n## [/}" claudecode/CHANGELOG.md
          sed -i "s|ENTRY_PLACEHOLDER|${ENTRY}|" claudecode/CHANGELOG.md

          echo "old=${ADDON_VER}" >> $GITHUB_OUTPUT
          echo "new=${NEW_ADDON_VER}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.claude.outputs.version != steps.tracked.outputs.version
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          branch: update/claude-code-${{ steps.claude.outputs.version }}
          delete-branch: true
          commit-message: "Bump add-on to v${{ steps.prepare.outputs.new }} — Claude Code ${{ steps.claude.outputs.version }}"
          title: "Update Claude Code ${{ steps.claude.outputs.version }} (Add-on v${{ steps.prepare.outputs.new }})"
          body: |
            ## Claude Code Update

            Neue Version **${{ steps.claude.outputs.version }}** von [@anthropic-ai/claude-code](https://www.npmjs.com/package/@anthropic-ai/claude-code) verfügbar.

            ### Änderungen
            - Add-on Version: `${{ steps.prepare.outputs.old }}` → `${{ steps.prepare.outputs.new }}`
            - Claude Code Version: `${{ steps.claude.outputs.version }}`

            ---
            _Automatisch erstellt von GitHub Actions. Bitte prüfen und mergen._
          labels: "auto-update"
