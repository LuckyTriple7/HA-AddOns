name: Build Firefox Image

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Get add-on version
        id: ver
        run: |
          VERSION=$(grep '^version:' firefox/config.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Baue Image für Add-on v${VERSION}"

      - name: Get current Firefox ESR version
        id: ffver
        run: |
          VERSION=$(curl -s "https://product-details.mozilla.org/1.0/firefox_versions.json" | jq -r '.FIREFOX_ESR')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Firefox ESR: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: firefox
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            FIREFOX_VERSION=${{ steps.ffver.outputs.version }}
          tags: |
            ghcr.io/luckytriple7/firefox:${{ steps.ver.outputs.version }}
            ghcr.io/luckytriple7/firefox:latest

      - name: Track Firefox ESR version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.ffver.outputs.version }}" > .firefox-version
          git add .firefox-version
          git diff --staged --quiet || git commit -m "Track Firefox ESR ${{ steps.ffver.outputs.version }}"
          git pull --rebase origin main
          git push
