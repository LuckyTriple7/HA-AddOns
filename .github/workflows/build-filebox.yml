name: Build FileBox Image

on:
  push:
    branches: [dev]
    paths:
      - 'filebox/config.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Get add-on version
        id: ver
        run: |
          VERSION=$(grep '^version:' filebox/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Baue Image für Add-on v${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get FileBrowser version
        id: fbver
        run: |
          VERSION=$(cat .filebox-version 2>/dev/null || echo "")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "FileBrowser Version: ${VERSION}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: filebox
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            FILEBROWSER_VERSION=${{ steps.fbver.outputs.version }}
          tags: |
            ghcr.io/luckytriple7/filebox:${{ steps.ver.outputs.version }}
            ghcr.io/luckytriple7/filebox:latest

      - name: Alte Image-Versionen aufräumen
        uses: actions/delete-package-versions@v5
        with:
          package-name: filebox
          package-type: container
          min-versions-to-keep: 20
          token: ${{ secrets.GITHUB_TOKEN }}
