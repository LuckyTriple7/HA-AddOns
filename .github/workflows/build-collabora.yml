name: Build Collabora Image

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Get add-on version
        id: ver
        run: |
          VERSION=$(grep '^version:' collabora/config.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Baue Image für Add-on v${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: collabora
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ghcr.io/luckytriple7/collabora:${{ steps.ver.outputs.version }}
            ghcr.io/luckytriple7/collabora:latest
