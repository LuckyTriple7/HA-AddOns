name: Check Collabora Update

# Verfolgt den Versions-Tag von collabora/code (nicht mehr den latest-Digest).
# Das Add-on baut seit 1.0.13 nicht mehr auf collabora/code auf, sondern kopiert
# nur die Nutzlast heraus — ein neues Upstream-Image kann den Build also nicht
# mehr kaputtmachen, ohne dass die ldd-/getcap-Gates im Dockerfile anschlagen.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Hole neuesten collabora/code Versions-Tag
        id: remote
        run: |
          VERSION=$(curl -s "https://hub.docker.com/v2/repositories/collabora/code/tags?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+(\.[0-9]+)+$' \
            | head -1)
          if [ -z "$VERSION" ]; then
            echo "Konnte Versions-Tag nicht ermitteln — API-Fehler?"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Aktueller collabora/code Tag: ${VERSION}"

      - name: Hole gespeicherte Version
        id: local
        run: |
          if [ -f .collabora-version ]; then
            echo "version=$(cat .collabora-version)" >> $GITHUB_OUTPUT
            echo "Gespeicherte Version: $(cat .collabora-version)"
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
            echo "Noch keine Versions-Datei vorhanden — erster Lauf"
          fi

      - name: Vergleiche Versionen
        id: compare
        run: |
          REMOTE="${{ steps.remote.outputs.version }}"
          LOCAL="${{ steps.local.outputs.version }}"
          echo "Remote: ${REMOTE} | Lokal: ${LOCAL}"
          if [ "$REMOTE" != "$LOCAL" ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "Neue Collabora-Version verfügbar"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "Kein Update notwendig"
          fi

      - name: Berechne neue Add-on-Version
        id: newversion
        if: steps.compare.outputs.rebuild == 'true'
        run: |
          CURRENT=$(grep '^version:' collabora/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Add-on Version: ${CURRENT} → ${NEW_VERSION}"

      - name: Versions-Datei, config.yaml und CHANGELOG aktualisieren
        if: steps.compare.outputs.rebuild == 'true'
        run: |
          NEW_VERSION="${{ steps.newversion.outputs.new_version }}"
          UPSTREAM="${{ steps.remote.outputs.version }}"
          CURRENT=$(grep '^version:' collabora/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          TODAY=$(date -u '+%Y-%m-%d')

          echo "${UPSTREAM}" > .collabora-version
          sed -i "s/^version: \"${CURRENT}\"/version: \"${NEW_VERSION}\"/" collabora/config.yaml

          CHANGELOG_ENTRY="## [${NEW_VERSION}] - ${TODAY}\n- Collabora auf Upstream-Version ${UPSTREAM} aktualisiert"
          sed -i "s|# Changelog|# Changelog\n\n${CHANGELOG_ENTRY}|" collabora/CHANGELOG.md

      - name: Pull Request erstellen
        if: steps.compare.outputs.rebuild == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          commit-message: "Collabora: Update auf Upstream ${{ steps.remote.outputs.version }} (v${{ steps.newversion.outputs.new_version }})"
          branch: "collabora-update/${{ steps.newversion.outputs.new_version }}"
          delete-branch: true
          title: "Collabora Update: Upstream ${{ steps.remote.outputs.version }} (v${{ steps.newversion.outputs.new_version }})"
          body: |
            ## Collabora Upstream-Update

            | | |
            |---|---|
            | Upstream-Version | `${{ steps.remote.outputs.version }}` |
            | Bisher | `${{ steps.local.outputs.version }}` |
            | Add-on Version | `${{ steps.newversion.outputs.new_version }}` |

            Nach dem Merge wird das Image automatisch via `build-collabora.yml` gebaut.
            Der Build prüft selbst per `getcap` und `ldd`, ob die Nutzlast aus dem neuen
            Upstream-Image vollständig und lauffähig ist, und schlägt sonst fehl.

            Trotzdem nach dem Deploy einmal ein Dokument öffnen — ein Packaging-Wechsel
            im Upstream-Image kann Pfade verschieben, ohne dass die Gates anschlagen.
          labels: "auto-update"
