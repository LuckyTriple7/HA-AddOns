name: Build WhatsApp Image

on:
  push:
    branches: [dev, main]
    paths:
      - 'whatsapp/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Get add-on version
        id: ver
        run: |
          VERSION=$(grep '^version:' whatsapp/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Baue Image für Add-on v${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: whatsapp
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ghcr.io/luckytriple7/whatsapp:${{ steps.ver.outputs.version }}
            ghcr.io/luckytriple7/whatsapp:latest

      - name: Alte Image-Versionen aufräumen
        uses: actions/delete-package-versions@v5
        with:
          package-name: whatsapp
          package-type: container
          min-versions-to-keep: 5
          token: ${{ secrets.GITHUB_TOKEN }}
