      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/cardboard/rootfs/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # ── Docker (Base Images) ──────────────────────────────────────────────────────
