name: 🐛 Bug Report (English)
description: Report a bug in one of the add-ons
labels: ["bug"]
body:
  - type: dropdown
    id: addon
    attributes:
      label: Affected Add-on
      options:
        - Signal
        - WhatsApp
        - Telegram
        - Webtop XFCE
        - Filebox
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Add-on Version
      placeholder: e.g. 1.1.5
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: e.g. 2025.5.3
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - amd64
        - aarch64
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Relevant lines from the add-on log (Supervisor → Add-on → Log)
      render: text
