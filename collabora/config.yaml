name: Collabora Online
description: Collabora Online Office-Server für Nextcloud — Dokumente direkt im Browser bearbeiten
version: "1.1.3"
slug: collabora
url: https://github.com/LuckyTriple7/HA-AddOns

image: "ghcr.io/luckytriple7/collabora"

arch:
  - amd64

map:
  - app_config:rw

startup: application
boot: manual
init: false

# Kein Ingress: Home Assistant wertet "webui" nur aus, wenn ingress aus ist
# (_computeShowWebUI = !addon.ingress && addon.webui). Mit Ingress zeigte der
# Button auf der Add-on-Seite immer das Terminal statt der Admin-Konsole.
# ttyd bleibt über Port 7682 erreichbar, dann aber ohne HA-Anmeldung.
webui: "https://[HOST]:[PORT:9980]/browser/dist/admin/admin.html"

ports:
  9980/tcp: 9980
  7682/tcp: 7682

ports_description:
  9980/tcp: Collabora Online
  7682/tcp: Web-Terminal

options:
  TZ: "Europe/Berlin"
  nextcloud_url: ""
  aliasgroup1: ""
  domain1: ""
  admin_user: admin
  admin_password: ""
  extra_params: ""

schema:
  TZ: str?
  nextcloud_url: str?
  aliasgroup1: str?
  domain1: str?
  admin_user: str
  admin_password: password
  extra_params: str?
