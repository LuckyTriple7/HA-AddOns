name: Collabora Online
description: Collabora Online Office-Server für Nextcloud — Dokumente direkt im Browser bearbeiten
version: "0.0.28"
slug: collabora
url: https://github.com/LuckyTriple7/HA-AddOns

image: "ghcr.io/luckytriple7/collabora"

arch:
  - amd64

map:
  - addon_config:rw

startup: application
boot: manual
init: false

ingress: true
ingress_port: 7682
panel_icon: mdi:console
panel_title: Collabora Terminal

ports:
  9980/tcp: 9980
  7682/tcp: 7682

ports_description:
  9980/tcp: Collabora Online
  7682/tcp: Web-Terminal

options:
  TZ: "Europe/Berlin"
  nextcloud_url: ""
  aliasgroup1: ""
  domain1: ""
  admin_user: admin
  admin_password: ""
  extra_params: ""

schema:
  TZ: str?
  nextcloud_url: str?
  aliasgroup1: str?
  domain1: str?
  admin_user: str
  admin_password: password
  extra_params: str?
