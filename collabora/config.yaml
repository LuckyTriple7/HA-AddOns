name: Collabora Online
description: Collabora Online Office-Server für Nextcloud — Dokumente direkt im Browser bearbeiten
version: "0.0.8"
slug: collabora
url: https://github.com/LuckyTriple7/HA-AddOns

image: "ghcr.io/luckytriple7/collabora"

arch:
  - amd64

map:
  - addon_config:rw

startup: application
boot: manual
init: false

ports:
  9980/tcp: 9980

ports_description:
  9980/tcp: Collabora Online

options:
  nextcloud_url: ""
  aliasgroup1: ""
  domain1: ""
  admin_user: admin
  admin_password: ""
  extra_params: ""

schema:
  nextcloud_url: str?
  aliasgroup1: str?
  domain1: str?
  admin_user: str
  admin_password: password
  extra_params: str?
