name: MessengerPortal
description: Zentrale, passwortgeschützte Startseite für WhatsApp, Telegram und Signal Add-ons
version: "1.2.3"
slug: messenger-portal
url: https://github.com/LuckyTriple7/HA-AddOns
image: "ghcr.io/luckytriple7/messenger-portal"

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

map:
  - addon_config:rw

ports:
  17770/tcp: 17770

ports_description:
  17770/tcp: MessengerPortal Web-UI

options:
  username: "admin"
  password: "secret"
  session_hours: 24
  poll_interval: 30
  internal_host: ""
  messengers:
    - name: WhatsApp
      icon: whatsapp
      port: 17776
      enabled: true
    - name: Telegram
      icon: telegram
      port: 17778
      enabled: true
    - name: Signal
      icon: signal
      port: 17777
      enabled: true

schema:
  username: str
  password: str
  session_hours: int
  poll_interval: int?
  internal_host: str?
  messengers:
    - name: str
      icon: str
      port: int
      enabled: bool
