configuration:
  username:
    name: Username
    description: Username for the login.
  password:
    name: Password
    description: Password for the login.
  session_hours:
    name: Session Duration (hours)
    description: How many hours a login session stays valid before requiring re-authentication.
  poll_interval:
    name: Poll Interval (seconds)
    description: How often status and last message are refreshed. Minimum 5 seconds, default 30 seconds.
  internal_host:
    name: Internal Host IP
    description: Only needed as a fallback. The portal reaches the messenger add-ons by their container name, which works even without a published port. Setting a value here forces the old path via the HA host (e.g. 172.30.32.2) and its port mappings instead.
  messengers:
    name: Messengers
    description: List of configured messengers with name, icon type, port and enabled state.
