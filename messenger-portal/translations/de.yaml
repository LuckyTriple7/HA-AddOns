configuration:
  username:
    name: Benutzername
    description: Benutzername für den Login.
  password:
    name: Passwort
    description: Passwort für den Login.
  session_hours:
    name: Session-Dauer (Stunden)
    description: Wie viele Stunden eine Login-Session gültig bleibt, bevor eine erneute Anmeldung nötig ist.
  internal_host:
    name: Interne Host-IP
    description: IP-Adresse des HA-Hosts im internen Docker-Netzwerk (Standard 172.30.32.2). Wird für den nginx Reverse Proxy zu den Messenger-Ports benötigt.
  messengers:
    name: Messenger
    description: Liste der konfigurierten Messenger mit Name, Icon-Typ, Port und Aktivierungsstatus.
