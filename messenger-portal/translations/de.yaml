configuration:
  username:
    name: Benutzername
    description: Benutzername für den Login.
  password:
    name: Passwort
    description: Passwort für den Login.
  session_hours:
    name: Session-Dauer (Stunden)
    description: Wie viele Stunden eine Login-Session gültig bleibt, bevor eine erneute Anmeldung nötig ist.
  poll_interval:
    name: Abfrageintervall (Sekunden)
    description: Wie oft der Status und die letzte Nachricht abgefragt werden. Minimum 5 Sekunden, Standard 30 Sekunden.
  internal_host:
    name: Interne Host-IP
    description: Nur noch als Notnagel nötig. Das Portal spricht die Messenger-Add-ons über ihren Container-Namen an und kommt damit auch ohne veröffentlichten Port aus. Wer hier etwas einträgt, erzwingt stattdessen den alten Weg über den HA-Host (z. B. 172.30.32.2) und dessen Port-Freigaben.
  ingress_trusted:
    name: Vertrauenswürdige Ingress-Adressen
    description: "Leer lassen. Von diesen Adressen nimmt der Ingress-Zugang ohne Portal-Passwort an — voreingestellt ist allein der Supervisor (172.30.32.2/32). Mehrere Einträge durch Komma trennen, CIDR erlaubt. Ein Eintrag wie 0.0.0.0/0 wird abgelehnt, er würde die Anmeldung für jeden aufheben. Ein falscher Wert macht das Ingress-Panel unerreichbar (403) — dann hier wieder leeren."
  trusted_proxies:
    name: Vertrauenswürdige Proxys
    description: "Adresse des vorgeschalteten Reverse-Proxys (z. B. NPMplus), mehrere durch Komma getrennt, CIDR erlaubt. Nur von dort übernimmt das Portal die echte Adresse des Aufrufers aus X-Forwarded-For bzw. CF-Connecting-IP – wichtig für die Anmeldesperre nach fünf Fehlversuchen. Leer: gezählt wird die Adresse, die direkt beim Portal ankommt; hinter einem Proxy teilen sich dann alle Aufrufer eine Sperre. Welche Adresse einzutragen ist, steht im Log hinter „Login fehlgeschlagen: ip=“."
  status_mirror_signal:
    name: WhatsApp-Status nach Signal spiegeln
    description: "Neue eigene WhatsApp-Statusmeldungen werden alle 5 Minuten als Signal-Story gepostet. Text-Status kommen als Bild an, Bildunterschriften fallen weg. Bilder und Videos brauchen im WhatsApp-Add-on download_media. Was beim Einschalten schon läuft, wird nicht gespiegelt; Zurückziehen in WhatsApp löscht die Signal-Story nicht. Braucht Signal 1.7.5."
  status_mirror_telegram:
    name: WhatsApp-Status nach Telegram spiegeln
    description: "Wie der Signal-Spiegel, nur als Telegram-Story (sichtbar für Kontakte). Bildunterschriften bleiben erhalten, Videos werden übersprungen. Braucht Telegram 1.7.31."
  messengers:
    name: Messenger
    description: Liste der konfigurierten Messenger mit Name, Icon-Typ, Port und Aktivierungsstatus.
