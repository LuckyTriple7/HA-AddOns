name: HA SysWatch
description: Docker container resource monitor — CPU, RAM, Network, Disk I/O
version: "0.1.4"
slug: syswatch
url: https://github.com/LuckyTriple7/HA-AddOns
image: "ghcr.io/luckytriple7/syswatch"

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

# Docker API access required for container stats (mounts /var/run/docker.sock)
docker_api: true

map:
  - addon_config:rw

ports:
  17790/tcp: 17790

ports_description:
  17790/tcp: SysWatch Web-UI

options:
  username: "admin"
  password: "secret"
  session_hours: 24
  collect_interval: 3
  collect_workers: 16
  show_stopped: false

schema:
  username: str
  password: str
  session_hours: int
  collect_interval: int?
  collect_workers: int?
  show_stopped: bool?
