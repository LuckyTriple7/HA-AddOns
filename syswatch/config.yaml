name: HA SysWatch
description: Docker container resource monitor — CPU, RAM, Network, Disk I/O
version: "1.2.13"
slug: syswatch
url: https://github.com/LuckyTriple7/HA-AddOns
image: "ghcr.io/luckytriple7/syswatch"

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: true

# Docker API access required for container stats (mounts /var/run/docker.sock)
docker_api: true

# Supervisor API read access — needed to list stopped add-ons (HA removes their Docker containers)
hassio_api: true
hassio_role: manager

map:
  - app_config:rw

webui: http://[HOST]:[PORT:17790]

ports:
  17790/tcp: 17790

ports_description:
  17790/tcp: SysWatch Web-UI

options:
  username: "admin"
  password: "secret"
  session_hours: 24
  collect_interval: 3
  collect_workers: 16
  viewer_timeout: 180
  show_stopped: true
  verbose_log: false
  telegram_bot_token: ""
  telegram_chat_id: ""
  notify_cpu_threshold: 0
  notify_ram_threshold: 0
  notify_over_duration: 0
  notify_clear_duration: 120

schema:
  username: str
  password: str
  session_hours: int
  collect_interval: int?
  collect_workers: int?
  viewer_timeout: int?
  show_stopped: bool?
  verbose_log: bool?
  telegram_bot_token: str?
  telegram_chat_id: str?
  notify_cpu_threshold: int?
  notify_ram_threshold: int?
  notify_over_duration: int?
  notify_clear_duration: int?
