<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t.title }} – {{ t.login }}</title>
  <meta name="theme-color" content="#0d1117">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 32px 28px;
      width: 100%;
      max-width: 360px;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      transition: border-color .15s;
    }
    input:focus { outline: none; border-color: #58a6ff; }
    button[type="submit"] {
      width: 100%;
      background: #238636;
      border: 1px solid #2ea043;
      color: #fff;
      padding: 9px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button[type="submit"]:hover { background: #2ea043; }
    .error {
      background: rgba(248,81,73,0.12);
      border: 1px solid #f85149;
      color: #f85149;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.83rem;
      margin-bottom: 16px;
    }
    .lang-bar {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 20px;
    }
    .lang-btn {
      background: none;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
    }
    .lang-btn.active { border-color: #58a6ff; color: #58a6ff; }
    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.72rem;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="lang-bar">
      <a href="/set-lang/de" class="lang-btn {% if lang == 'de' %}active{% endif %}">DE</a>
      <a href="/set-lang/en" class="lang-btn {% if lang == 'en' %}active{% endif %}">EN</a>
    </div>

    <div class="logo">HA SysWatch</div>
    <p class="subtitle">{{ t.subtitle }}</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" autocomplete="on">
      <label for="username">{{ t.username }}</label>
      <input type="text" id="username" name="username"
             autocomplete="username" autofocus required>

      <label for="password">{{ t.password }}</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required>

      <button type="submit">{{ t.login }}</button>
    </form>

    <footer>HA SysWatch &mdash; Docker Monitor</footer>
  </div>
</body>
</html>
