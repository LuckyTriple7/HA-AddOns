configuration:
  username:
    name: Username
    description: Login username for the web interface.
  password:
    name: Password
    description: Login password for the web interface. Also required to confirm container restart or kill actions.
  session_hours:
    name: Session Duration (hours)
    description: How many hours a login session stays valid before requiring re-authentication. Default 24.
  collect_interval:
    name: Collect Interval (seconds)
    description: "Pause between Docker stat queries. Total cycle time = query time + this value. Example: 49 containers take ~2s to query + 3s pause = ~5s cycle. Lower = faster updates but more CPU load. Default 3, minimum 2."
  collect_workers:
    name: Parallel Workers
    description: "Number of simultaneous Docker stats calls. More workers = faster queries but more CPU and memory usage. With 49 containers: 16 workers = ~4s, 32 workers = ~2.5s, 49+ workers = ~2s (same as docker stats CLI). Range 4–64, default 16."
  viewer_timeout:
    name: Idle Timeout (seconds)
    description: "After this many seconds without an active browser session, the collector switches to idle mode (2 workers, 60s interval) to save resources. The browser sends a heartbeat every 10s while the tab is open. Range 30–1800 (30min), default 180."
  show_stopped:
    name: Show Stopped Containers
    description: Show stopped/exited containers in the table by default. Can also be toggled in the UI. Default true.
  verbose_log:
    name: Verbose Logging
    description: Logs container count, worker count and query duration on every collection cycle. Default false — only mode changes, errors and actions are logged.
  telegram_bot_token:
    name: Telegram Bot Token
    description: "Token of the Telegram bot for notifications (format: 123456:ABC-...). Leave empty to disable notifications. Create a bot via @BotFather."
  telegram_chat_id:
    name: Telegram Chat ID
    description: Chat ID of the recipient (user, group or channel). Find your own chat ID via @userinfobot.
  notify_cpu_threshold:
    name: CPU Alert Threshold (%)
    description: "Send a Telegram alert when system CPU exceeds this value. All-clear after 2 min below threshold. 0 = disabled. Example: 80 (alert above 80% CPU)."
  notify_ram_threshold:
    name: RAM Alert Threshold (%)
    description: "Send a Telegram alert when system RAM exceeds this value. All-clear after 2 min below threshold. 0 = disabled. Example: 85 (alert above 85% RAM)."
