name: MediaGrab
description: yt-dlp Web-GUI — Videos und Audio herunterladen (YouTube, Vimeo, SoundCloud u.v.m.)
version: "0.0.2"
slug: mediagrab
url: https://github.com/LuckyTriple7/HA-AddOns
image: "ghcr.io/luckytriple7/mediagrab"

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

map:
  - media:rw

ports:
  17791/tcp: 17791

ports_description:
  17791/tcp: MediaGrab Web-UI

options:
  username: "admin"
  password: "secret"
  session_hours: 24
  max_concurrent: 3
  verbose_log: false

schema:
  username: str
  password: str
  session_hours: int?
  max_concurrent: int?
  verbose_log: bool?
