<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ t.title }}</title>
  <link rel="icon" href="/static/icon.png">
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg:#0d1117; --surf:#161b22; --surf2:#1c2128; --border:#30363d;
      --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff;
      --green:#3fb950; --yellow:#d29922; --red:#f85149; --r:6px;
    }
    [data-theme="light"] {
      --bg:#f0f2f5; --surf:#ffffff; --surf2:#f6f8fa; --border:#d0d7de;
      --text:#1f2328; --muted:#636c76; --accent:#0969da;
      --green:#1a7f37; --yellow:#9a6700; --red:#cf222e;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; transition:background-color .2s,border-color .2s,color .2s; }
    html,body { height:100%; overflow:hidden; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); font-size:14px; display:flex; flex-direction:column; }

    /* ── Header ── */
    header { background:var(--surf); border-bottom:1px solid var(--border); padding:9px 14px; display:flex; align-items:center; gap:8px; flex-shrink:0; z-index:200; }
    .logo { font-size:1.05rem; font-weight:700; color:var(--accent); white-space:nowrap; }
    .hdr-spacer { flex:1; }
    .lang-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:2px 8px; border-radius:4px; font-size:.75rem; cursor:pointer; text-decoration:none; }
    .lang-btn.active,.lang-btn:hover { border-color:var(--accent); color:var(--accent); }
    .theme-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:3px 6px; border-radius:4px; cursor:pointer; display:inline-flex; align-items:center; }
    .theme-btn svg { width:13px; height:13px; fill:currentColor; }
    .icon-moon { display:block; } .icon-sun { display:none; }
    [data-theme="light"] .icon-moon { display:none; } [data-theme="light"] .icon-sun { display:block; }
    .logout-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:2px 10px; border-radius:4px; font-size:.75rem; cursor:pointer; text-decoration:none; }
    .logout-btn:hover { border-color:var(--red); color:var(--red); }

    /* ── Scroll ── */
    #main-scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:14px; display:flex; flex-direction:column; gap:12px; }

    /* ── Cards ── */
    .card { background:var(--surf); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; }
    .card-title { font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .badge { background:var(--surf2); border:1px solid var(--border); border-radius:10px; padding:1px 7px; font-size:.7rem; color:var(--muted); font-weight:500; text-transform:none; }
    .spacer { flex:1; }

    /* ── Download form ── */
    .dl-textarea { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:var(--r); font-size:.9rem; font-family:inherit; resize:none; min-height:40px; max-height:160px; line-height:1.5; overflow-y:auto; }
    .dl-textarea:focus { outline:none; border-color:var(--accent); }
    .dl-row { display:flex; gap:8px; align-items:stretch; flex-wrap:wrap; margin-top:8px; }
    .dl-select { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:var(--r); font-size:.85rem; cursor:pointer; }
    .dl-select:focus { outline:none; border-color:var(--accent); }
    .dl-btn { background:var(--accent); border:none; color:#fff; padding:8px 16px; border-radius:var(--r); font-size:.9rem; font-weight:600; cursor:pointer; white-space:nowrap; }
    .dl-btn:hover { opacity:.85; } .dl-btn:disabled { opacity:.4; cursor:default; }
    .info-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:8px 12px; border-radius:var(--r); font-size:.85rem; cursor:pointer; white-space:nowrap; }
    .info-btn:hover { border-color:var(--accent); color:var(--accent); }
    .dl-opts { display:flex; gap:18px; margin-top:10px; flex-wrap:wrap; }
    .dl-opts label { display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--muted); cursor:pointer; user-select:none; }
    .dl-opts input[type="checkbox"] { cursor:pointer; accent-color:var(--accent); }

    /* ── Info card ── */
    #info-card { display:none; background:var(--surf2); border:1px solid var(--border); border-radius:var(--r); padding:12px; margin-top:10px; }
    #info-card.visible { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
    #info-thumb { width:100px; height:56px; object-fit:cover; border-radius:4px; flex-shrink:0; background:var(--border); }
    .info-meta { flex:1; min-width:120px; }
    .info-title { font-size:.88rem; font-weight:600; margin-bottom:4px; }
    .info-sub { font-size:.75rem; color:var(--muted); }
    .info-close { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.1rem; margin-left:auto; align-self:flex-start; padding:0 4px; }
    .info-close:hover { color:var(--text); }
    .info-loading { font-size:.83rem; color:var(--muted); margin-top:10px; }

    /* ── Toast ── */
    #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surf2); border:1px solid var(--border); color:var(--text); padding:8px 18px; border-radius:var(--r); font-size:.85rem; box-shadow:0 4px 20px rgba(0,0,0,.4); z-index:999; opacity:0; pointer-events:none; transition:opacity .3s; white-space:nowrap; }
    #toast.show { opacity:1; } #toast.err { border-color:var(--red); color:var(--red); }

    /* ── Queue ── */
    .job-item { background:var(--surf2); border:1px solid var(--border); border-radius:var(--r); padding:11px 13px; margin-bottom:8px; }
    .job-item:last-child { margin-bottom:0; }
    .job-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
    .job-name { font-size:.85rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .job-fmt { font-size:.7rem; color:var(--muted); background:var(--surf); border:1px solid var(--border); padding:1px 6px; border-radius:3px; }
    .job-status { font-size:.72rem; padding:2px 8px; border-radius:10px; font-weight:600; }
    .s-pending  { background:rgba(210,153,34,.15); color:var(--yellow); }
    .s-running  { background:rgba(88,166,255,.15);  color:var(--accent); }
    .s-done     { background:rgba(63,185,80,.15);   color:var(--green); }
    .s-error    { background:rgba(248,81,73,.15);   color:var(--red); }
    .s-cancelled{ background:rgba(139,148,158,.15); color:var(--muted); }
    .job-bar-wrap { height:4px; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:6px; }
    .job-bar { height:100%; background:var(--accent); border-radius:2px; transition:width .4s; }
    .job-bar.done { background:var(--green); } .job-bar.err { background:var(--red); }
    .job-meta { font-size:.75rem; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
    .job-error { font-size:.75rem; color:var(--red); margin-top:3px; }
    .job-actions { margin-top:8px; display:flex; gap:8px; }

    /* ── Buttons small ── */
    .sm-btn { font-size:.75rem; padding:3px 10px; border-radius:4px; cursor:pointer; border:1px solid var(--border); background:none; color:var(--muted); }
    .sm-btn:hover { border-color:var(--accent); color:var(--accent); }
    .sm-btn.danger:hover { border-color:var(--red); color:var(--red); }
    .empty-note { color:var(--muted); font-size:.83rem; padding:6px 0; }

    /* ── Disk bar ── */
    .disk-bar-wrap { height:5px; background:var(--border); border-radius:3px; overflow:hidden; margin:6px 0 10px; }
    .disk-bar { height:100%; background:var(--accent); border-radius:3px; transition:width .5s; }
    .disk-bar.warn { background:var(--yellow); } .disk-bar.crit { background:var(--red); }
    .disk-info { font-size:.73rem; color:var(--muted); margin-bottom:8px; }

    /* ── File list ── */
    .files-toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
    .files-search { flex:1; min-width:120px; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:var(--r); font-size:.83rem; }
    .files-search:focus { outline:none; border-color:var(--accent); }
    .sort-btn { font-size:.72rem; padding:3px 8px; border-radius:4px; cursor:pointer; border:1px solid var(--border); background:none; color:var(--muted); }
    .sort-btn.active { border-color:var(--accent); color:var(--accent); }
    .sort-btn:hover { border-color:var(--accent); color:var(--accent); }
    .platform-filters { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0 4px; }
    .plat-btn { font-size:.72rem; padding:3px 9px; border-radius:10px; cursor:pointer; border:1px solid var(--border); background:none; color:var(--muted); }
    .plat-btn.active { border-color:var(--accent); background:var(--accent); color:#fff; }
    .plat-btn:hover:not(.active) { border-color:var(--accent); color:var(--accent); }
    .file-platform { font-size:.68rem; padding:1px 6px; border-radius:8px; background:var(--accent); color:#fff; opacity:.75; white-space:nowrap; cursor:pointer; }
    .file-platform:hover { opacity:1; }
    .file-tag-btn { font-size:.68rem; padding:1px 6px; border-radius:8px; border:1px dashed var(--muted); background:none; color:var(--muted); cursor:pointer; white-space:nowrap; }
    .file-tag-btn:hover { border-color:var(--accent); color:var(--accent); }
    .plat-popup { position:fixed; z-index:9999; background:var(--surf); border:1px solid var(--accent); border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.55); padding:10px; display:flex; flex-wrap:wrap; gap:6px; max-width:270px; }
    .plat-popup .pp-opt { font-size:.78rem; padding:4px 11px; border-radius:10px; border:1px solid var(--border); background:var(--surf2); color:var(--text); cursor:pointer; font-weight:500; }
    .plat-popup .pp-opt:hover, .plat-popup .pp-opt.active { border-color:var(--accent); background:var(--accent); color:#fff; }
    .plat-popup .pp-remove { font-size:.78rem; padding:4px 11px; border-radius:10px; border:1px solid var(--red); background:var(--surf2); color:var(--red); cursor:pointer; font-weight:500; width:100%; text-align:center; }
    .plat-popup .pp-remove:hover { background:var(--red); color:#fff; }
    .file-item { display:flex; align-items:flex-start; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); }
    .file-item:last-child { border-bottom:none; }
    .file-icon { color:var(--muted); font-size:1rem; flex-shrink:0; padding-top:1px; }
    .file-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
    .file-name { font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .file-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .file-size { font-size:.73rem; color:var(--muted); white-space:nowrap; }
    .file-date { font-size:.73rem; color:var(--muted); white-space:nowrap; }
    .file-acts { display:flex; gap:6px; flex-shrink:0; margin-left:auto; }
    .path-note { font-size:.73rem; color:var(--muted); margin-bottom:8px; }

    /* ── Player modal ── */
    #player-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:500; align-items:center; justify-content:center; flex-direction:column; padding:16px; }
    #player-modal.open { display:flex; }
    #player-modal video, #player-modal audio { max-width:100%; max-height:80vh; border-radius:var(--r); outline:none; }
    #player-modal audio { width:360px; margin-top:20px; }
    .player-title { color:#fff; font-size:.85rem; margin-bottom:10px; max-width:90vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
    .player-close { position:absolute; top:14px; right:18px; background:none; border:none; color:#fff; font-size:1.6rem; cursor:pointer; opacity:.7; }
    .player-close:hover { opacity:1; }

    /* ── Settings ── */
    .settings-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .settings-row:last-child { border-bottom:none; }
    .settings-label { font-size:.8rem; color:var(--muted); width:90px; flex-shrink:0; }
    .settings-value { font-size:.85rem; flex:1; }
    .settings-hint { font-size:.72rem; color:var(--muted); margin-top:2px; }
    .cookie-status { font-size:.78rem; padding:2px 8px; border-radius:10px; font-weight:600; }
    .cookie-ok  { background:rgba(63,185,80,.15);  color:var(--green); }
    .cookie-no  { background:rgba(139,148,158,.15); color:var(--muted); }
    #cookie-upload-input { display:none; }

  </style>
</head>
<body>
  <header>
    <div class="logo">MediaGrab</div>
    <div class="hdr-spacer"></div>
    <a href="/set-lang/de" class="lang-btn {% if lang == 'de' %}active{% endif %}">DE</a>
    <a href="/set-lang/en" class="lang-btn {% if lang == 'en' %}active{% endif %}">EN</a>
    <button class="theme-btn" onclick="toggleTheme()" type="button">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      <svg class="icon-sun"  viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2v-2H2v2zm18 0h2v-2h-2v2zM11 2v2h2V2h-2zm0 18v2h2v-2h-2zM5.99 4.58 4.58 5.99l1.41 1.41 1.41-1.41L5.99 4.58zm12.03 12.03-1.41 1.41 1.41 1.41 1.41-1.41-1.41-1.41zm1.41-12.44-1.41-1.41-1.41 1.41 1.41 1.41 1.41-1.41zM5.99 19.42l1.41 1.41 1.41-1.41-1.41-1.41-1.41 1.41z"/></svg>
    </button>
    <a href="/logout" class="logout-btn">{{ t.logout }}</a>
  </header>

  <div id="main-scroll">

    <!-- Download -->
    <div class="card">
      <div class="card-title">{{ t.section_download }}</div>
      <textarea id="url-input" class="dl-textarea" rows="1"
                placeholder="{{ t.url_placeholder }}"
                autocomplete="off" spellcheck="false"></textarea>
      <div class="dl-row">
        <select id="fmt-select" class="dl-select">
          <option value="best_video">{{ t.fmt_best_video }}</option>
          <option value="1080p">{{ t.fmt_1080p }}</option>
          <option value="720p">{{ t.fmt_720p }}</option>
          <option value="480p">{{ t.fmt_480p }}</option>
          <option value="360p">{{ t.fmt_360p }}</option>
          <option value="mp3">{{ t.fmt_mp3 }}</option>
          <option value="m4a">{{ t.fmt_m4a }}</option>
        </select>
        <button class="info-btn" onclick="fetchInfo()">{{ t.btn_info }}</button>
        <button id="dl-btn" class="dl-btn" onclick="startDownload()">{{ t.btn_download }}</button>
      </div>
      <div class="dl-opts">
        <label><input type="checkbox" id="cb-subtitles"> {{ t.label_subtitles }}</label>
        <label><input type="checkbox" id="cb-playlist"> {{ t.label_playlist }}</label>
        <label id="cb-cookies-wrap" style="display:none"><input type="checkbox" id="cb-cookies" checked> {{ t.label_cookies }}</label>
      </div>
      <!-- Info card -->
      <div id="info-card">
        <img id="info-thumb" src="" alt="">
        <div class="info-meta">
          <div class="info-title" id="info-title"></div>
          <div class="info-sub" id="info-sub"></div>
        </div>
        <button class="info-close" onclick="closeInfo()">&times;</button>
      </div>
    </div>

    <!-- Queue -->
    <div class="card">
      <div class="card-title">
        {{ t.section_queue }}
        <span class="badge" id="queue-badge">0</span>
        <span class="spacer"></span>
        <button class="sm-btn" onclick="clearQueue()">{{ t.btn_clear_queue }}</button>
      </div>
      <div id="jobs-list"><p class="empty-note">{{ t.queue_empty }}</p></div>
    </div>

    <!-- Files -->
    <div class="card">
      <div class="card-title">
        {{ t.section_files }}
        <span class="badge" id="files-badge">0</span>
        <span class="spacer"></span>
        <button class="sm-btn" onclick="loadFiles()">{{ t.btn_refresh }}</button>
      </div>
      <p class="path-note">{{ t.files_path }}</p>
      <div class="disk-info" id="disk-info"></div>
      <div class="disk-bar-wrap"><div class="disk-bar" id="disk-bar" style="width:0%"></div></div>
      <div class="files-toolbar">
        <input id="file-search" class="files-search" type="search" placeholder="{{ t.lbl_search }}" oninput="renderFiles()">
        <button class="sort-btn active" id="sort-date" onclick="setSort('date')">{{ t.sort_date }}</button>
        <button class="sort-btn" id="sort-name" onclick="setSort('name')">{{ t.sort_name }}</button>
        <button class="sort-btn" id="sort-size" onclick="setSort('size')">{{ t.sort_size }}</button>
      </div>
      <div class="platform-filters" id="platform-filters" style="display:none"></div>
      <div id="files-list"><p class="empty-note">{{ t.files_empty }}</p></div>
    </div>

    <!-- Settings -->
    <div class="card">
      <div class="card-title">{{ t.section_settings }}</div>
      <div class="settings-row">
        <span class="settings-label">{{ t.ytdlp_label }}</span>
        <span class="settings-value" id="ytdlp-ver">—</span>
        <button class="sm-btn" id="ytdlp-update-btn" onclick="updateYtdlp()">{{ t.btn_update_ytdlp }}</button>
      </div>
      <div class="settings-row">
        <span class="settings-label">{{ t.cookies_label }}</span>
        <span class="settings-value">
          <span class="cookie-status cookie-no" id="cookie-status">{{ t.cookies_none }}</span>
        </span>
        <button class="sm-btn" onclick="document.getElementById('cookie-upload-input').click()">{{ t.btn_upload_cookies }}</button>
        <button class="sm-btn danger" id="cookie-del-btn" onclick="deleteCookies()" style="display:none">{{ t.btn_delete_cookies }}</button>
        <input type="file" id="cookie-upload-input" accept=".txt,text/plain" onchange="uploadCookies(this)">
      </div>
      <div class="settings-row" style="border:none;padding-top:2px">
        <span class="settings-label"></span>
        <span class="settings-hint">{{ t.cookies_hint }}</span>
      </div>
    </div>

  </div>

  <!-- Player modal -->
  <div id="player-modal" onclick="closePlayer(event)">
    <button class="player-close" onclick="closePlayer()">&times;</button>
    <div class="player-title" id="player-title"></div>
    <div id="player-content"></div>
  </div>

  <div id="toast"></div>

  <script>
    const T = {
      queue_empty:    {{ t.queue_empty | tojson }},
      files_empty:    {{ t.files_empty | tojson }},
      error_no_url:   {{ t.error_no_url | tojson }},
      error_queue_full: {{ t.error_queue_full | tojson }},
      error_network:  {{ t.error_network | tojson }},
      error_unknown:  {{ t.error_unknown | tojson }},
      confirm_delete: {{ t.confirm_delete | tojson }},
      confirm_delete_cookies: {{ t.confirm_delete_cookies | tojson }},
      btn_cancel:     {{ t.btn_cancel | tojson }},
      btn_remove:     {{ t.btn_remove | tojson }},
      btn_delete:     {{ t.btn_delete | tojson }},
      btn_download_file: {{ t.btn_download_file | tojson }},
      lbl_speed:      {{ t.lbl_speed | tojson }},
      lbl_eta:        {{ t.lbl_eta | tojson }},
      status_pending:   {{ t.status_pending | tojson }},
      status_running:   {{ t.status_running | tojson }},
      status_done:      {{ t.status_done | tojson }},
      status_error:     {{ t.status_error | tojson }},
      status_cancelled: {{ t.status_cancelled | tojson }},
      cookies_loaded: {{ t.cookies_loaded | tojson }},
      cookies_none:   {{ t.cookies_none | tojson }},
      ytdlp_updating: {{ t.ytdlp_updating | tojson }},
      ytdlp_updated:  {{ t.ytdlp_updated | tojson }},
      disk_free:      {{ t.disk_free | tojson }},
      disk_used_by_folder: {{ t.disk_used_by_folder | tojson }},
      info_loading:   {{ t.info_loading | tojson }},
      info_error:     {{ t.info_error | tojson }},
      info_duration:  {{ t.info_duration | tojson }},
      info_timeout:   {{ t.info_timeout | tojson }},
      // error keys
      err_age_restricted: {{ t.err_age_restricted | tojson }},
      err_private:        {{ t.err_private | tojson }},
      err_unavailable:    {{ t.err_unavailable | tojson }},
      err_removed:        {{ t.err_removed | tojson }},
      err_format:         {{ t.err_format | tojson }},
      err_rate_limited:   {{ t.err_rate_limited | tojson }},
      err_network:        {{ t.err_network | tojson }},
      err_extract:        {{ t.err_extract | tojson }},
      err_not_found:      {{ t.err_not_found | tojson }},
      err_invalid_url:    {{ t.err_invalid_url | tojson }},
      err_unsupported:    {{ t.err_unsupported | tojson }},
      err_interrupted:    {{ t.err_interrupted | tojson }},
      err_unknown:        {{ t.err_unknown | tojson }},
    };

    // ── Theme ─────────────────────────────────────────────────────────────────
    (function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('mg-theme') || 'dark'); })();
    function toggleTheme(){ const n = (document.documentElement.getAttribute('data-theme')||'dark') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); localStorage.setItem('mg-theme', n); }

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer = null;
    function toast(msg, isErr=false) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = 'show' + (isErr ? ' err' : '');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.className = '', 3500);
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function fmtSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
      if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
      return (b/1073741824).toFixed(2) + ' GB';
    }
    function fmtDate(ts) { return new Date(ts*1000).toLocaleString(); }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function errMsg(key) { return T[key] || key; }

    // ── Download ──────────────────────────────────────────────────────────────
    async function startDownload() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) { toast(T.error_no_url, true); return; }
      const btn = document.getElementById('dl-btn');
      btn.disabled = true;
      closeInfo();
      try {
        const r = await fetch('/api/download', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            url,
            fmt:      document.getElementById('fmt-select').value,
            subtitles: document.getElementById('cb-subtitles').checked,
            playlist:  document.getElementById('cb-playlist').checked,
            use_cookies: document.getElementById('cb-cookies').checked,
          })
        });
        const data = await r.json();
        if (!r.ok) {
          toast(data.error === 'queue_full' ? T.error_queue_full : T.error_unknown + ': ' + data.error, true);
          return;
        }
        document.getElementById('url-input').value = '';
        loadJobs();
      } catch(e) { toast(T.error_network, true); }
      finally { btn.disabled = false; }
    }

    // ── Video Info ────────────────────────────────────────────────────────────
    async function fetchInfo() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) { toast(T.error_no_url, true); return; }
      const card = document.getElementById('info-card');
      card.className = 'visible';
      document.getElementById('info-thumb').src = '';
      document.getElementById('info-title').textContent = T.info_loading;
      document.getElementById('info-sub').textContent = '';
      try {
        const r = await fetch('/api/info', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({url})
        });
        const d = await r.json();
        if (!r.ok || d.error) {
          document.getElementById('info-title').textContent = d.error === 'timeout' ? T.info_timeout : T.info_error;
          return;
        }
        if (d.thumbnail) document.getElementById('info-thumb').src = d.thumbnail;
        document.getElementById('info-title').textContent = d.title || '—';
        document.getElementById('info-sub').textContent =
          [d.uploader, d.duration ? T.info_duration + ': ' + d.duration : '', d.extractor]
          .filter(Boolean).join(' · ');
      } catch(e) { document.getElementById('info-title').textContent = T.info_error; }
    }
    function closeInfo() {
      document.getElementById('info-card').className = '';
      document.getElementById('info-thumb').src = '';
    }

    // ── Polling ───────────────────────────────────────────────────────────────
    let _pollInterval = 2000;
    let _pollTimer    = null;
    function schedulePoll() {
      clearTimeout(_pollTimer);
      _pollTimer = setTimeout(async () => { await loadJobs(); schedulePoll(); }, _pollInterval);
    }

    // ── Queue ─────────────────────────────────────────────────────────────────
    const STATUS_LABEL = { pending:T.status_pending, running:T.status_running, done:T.status_done, error:T.status_error, cancelled:T.status_cancelled };
    let _prevDoneIds = new Set();

    async function loadJobs() {
      try {
        const r = await fetch('/api/jobs');
        if (!r.ok) return;
        const jobs = await r.json();
        renderJobs(jobs);
        const nowDone = new Set(jobs.filter(j => j.status === 'done').map(j => j.id));
        if ([...nowDone].some(id => !_prevDoneIds.has(id))) { loadFiles(); loadDiskSpace(); }
        _prevDoneIds = nowDone;
        const hasActive = jobs.some(j => j.status === 'pending' || j.status === 'running');
        _pollInterval = hasActive ? 500 : 2000;
      } catch(e) {}
    }

    function renderJobs(jobs) {
      const list  = document.getElementById('jobs-list');
      const badge = document.getElementById('queue-badge');
      badge.textContent = jobs.filter(j => j.status === 'pending' || j.status === 'running').length;
      if (!jobs.length) { list.innerHTML = '<p class="empty-note">' + esc(T.queue_empty) + '</p>'; return; }
      list.innerHTML = jobs.map(j => {
        const pct    = Math.min(100, Math.max(0, j.progress || 0));
        const barCls = j.status === 'done' ? 'done' : j.status === 'error' ? 'err' : '';
        const name   = j.filename || j.url;
        const metaParts = [];
        if (j.status === 'running') {
          if (j.speed) metaParts.push(T.lbl_speed + ': ' + esc(j.speed));
          if (j.eta)   metaParts.push(T.lbl_eta   + ': ' + esc(j.eta));
        }
        const canCancel = j.status === 'pending' || j.status === 'running';
        return `
          <div class="job-item">
            <div class="job-header">
              <span class="job-name" title="${esc(name)}">${esc(name)}</span>
              <span class="job-fmt">${esc(j.fmt)}</span>
              <span class="job-status s-${j.status}">${esc(STATUS_LABEL[j.status]||j.status)}</span>
            </div>
            <div class="job-bar-wrap"><div class="job-bar ${barCls}" style="width:${pct}%"></div></div>
            <div class="job-meta">${pct.toFixed(1)}%${metaParts.length ? '&nbsp;&nbsp;' + metaParts.join('&nbsp;&nbsp;') : ''}</div>
            ${j.status === 'error' ? `<div class="job-error">${esc(errMsg(j.error))}</div>` : ''}
            <div class="job-actions">
              ${canCancel  ? `<button class="sm-btn danger" onclick="cancelJob('${esc(j.id)}')">${esc(T.btn_cancel)}</button>` : ''}
              ${!canCancel ? `<button class="sm-btn"        onclick="removeJob('${esc(j.id)}')">${esc(T.btn_remove)}</button>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    async function cancelJob(id) { await fetch('/api/cancel/'+id,{method:'POST'}); loadJobs(); }
    async function removeJob(id) { await fetch('/api/remove/'+id,{method:'POST'}); loadJobs(); }
    async function clearQueue() { await fetch('/api/jobs/clear',{method:'POST'}); loadJobs(); }

    // ── Disk space ────────────────────────────────────────────────────────────
    async function loadDiskSpace() {
      try {
        const r = await fetch('/api/diskspace');
        if (!r.ok) return;
        const d = await r.json();
        const pct = d.total > 0 ? (d.used / d.total * 100) : 0;
        const bar = document.getElementById('disk-bar');
        bar.style.width = pct.toFixed(1) + '%';
        bar.className = 'disk-bar' + (pct > 90 ? ' crit' : pct > 75 ? ' warn' : '');
        document.getElementById('disk-info').textContent =
          fmtSize(d.folder) + ' ' + T.disk_used_by_folder + ' · ' + fmtSize(d.free) + ' ' + T.disk_free;
      } catch(e) {}
    }

    // ── Files ─────────────────────────────────────────────────────────────────
    let _allFiles       = [];
    let _sortKey        = 'date';
    let _platformFilter = null;

    function setSort(key) {
      _sortKey = key;
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('sort-' + key).classList.add('active');
      renderFiles();
    }

    async function loadFiles() {
      try {
        const r = await fetch('/api/files');
        if (!r.ok) return;
        _allFiles = await r.json();
        document.getElementById('files-badge').textContent = _allFiles.length;
        _buildPlatformFilters();
        renderFiles();
      } catch(e) {}
    }

    function _buildPlatformFilters() {
      const wrap = document.getElementById('platform-filters');
      const platforms = [...new Set(_allFiles.map(f => f.platform).filter(Boolean))].sort();
      if (!platforms.length) { wrap.style.display = 'none'; return; }
      // reset active filter if platform no longer present
      if (_platformFilter && !platforms.includes(_platformFilter)) _platformFilter = null;
      wrap.style.display = 'flex';
      wrap.innerHTML = platforms.map(p =>
        `<button class="plat-btn${_platformFilter === p ? ' active' : ''}" onclick="setPlatformFilter('${p}')">${p}</button>`
      ).join('');
    }

    function setPlatformFilter(p) {
      _platformFilter = (_platformFilter === p) ? null : p;
      _buildPlatformFilters();
      renderFiles();
    }

    const _PLATFORMS = ['YouTube','TikTok','Instagram','X','Vimeo','SoundCloud','Twitch','Reddit','Dailymotion','Sonstiges'];
    let   _platPopup = null;

    function openPlatformPicker(evt, filename, current) {
      evt.stopPropagation();
      closePlatformPicker();
      const popup = document.createElement('div');
      popup.className = 'plat-popup';
      _PLATFORMS.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'pp-opt' + (p === current ? ' active' : '');
        btn.textContent = p;
        btn.onclick = (e) => { e.stopPropagation(); savePlatform(filename, p); };
        popup.appendChild(btn);
      });
      if (current) {
        const rem = document.createElement('button');
        rem.className = 'pp-remove';
        rem.textContent = '✕ Entfernen';
        rem.onclick = (e) => { e.stopPropagation(); savePlatform(filename, ''); };
        popup.appendChild(rem);
      }
      const rect = evt.target.getBoundingClientRect();
      popup.style.top  = (rect.bottom + window.scrollY + 4) + 'px';
      popup.style.left = Math.min(rect.left + window.scrollX, window.innerWidth - 270) + 'px';
      document.body.appendChild(popup);
      _platPopup = popup;
      setTimeout(() => document.addEventListener('click', closePlatformPicker, {once:true}), 0);
    }

    function closePlatformPicker() {
      if (_platPopup) { _platPopup.remove(); _platPopup = null; }
    }

    async function savePlatform(filename, platform) {
      closePlatformPicker();
      try {
        const r = await fetch('/api/file/platform/' + encodeURIComponent(filename), {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({platform})
        });
        if (r.ok) {
          const f = _allFiles.find(x => x.name === filename);
          if (f) f.platform = platform;
          _buildPlatformFilters();
          renderFiles();
        } else { toast(T.error_unknown, true); }
      } catch(e) { toast(T.error_network, true); }
    }

    function renderFiles() {
      const list   = document.getElementById('files-list');
      const q      = (document.getElementById('file-search').value || '').toLowerCase();
      let   files  = [..._allFiles];
      if (q)               files = files.filter(f => f.name.toLowerCase().includes(q));
      if (_platformFilter) files = files.filter(f => f.platform === _platformFilter);

      if (_sortKey === 'name') files.sort((a,b) => a.name.localeCompare(b.name));
      else if (_sortKey === 'size') files.sort((a,b) => b.size - a.size);
      else files.sort((a,b) => b.mtime - a.mtime);

      document.getElementById('files-badge').textContent = _allFiles.length;

      if (!files.length) { list.innerHTML = '<p class="empty-note">' + esc(T.files_empty) + '</p>'; return; }
      const VIDEO_EXT = ['mp4','mkv','webm','avi','mov'];
      const AUDIO_EXT = ['mp3','m4a','ogg','opus','aac','flac','wav'];
      const icon = f => {
        const ext = f.name.split('.').pop().toLowerCase();
        if (VIDEO_EXT.includes(ext)) return '🎬';
        if (AUDIO_EXT.includes(ext)) return '🎵';
        return '📄';
      };
      const isPlayable = f => {
        const ext = f.name.split('.').pop().toLowerCase();
        return VIDEO_EXT.includes(ext) || AUDIO_EXT.includes(ext);
      };
      list.innerHTML = files.map(f => `
        <div class="file-item">
          <span class="file-icon">${icon(f)}</span>
          <div class="file-body">
            <span class="file-name" title="${esc(f.name)}">${esc(f.name)}</span>
            <div class="file-meta">
              ${f.platform
                ? `<span class="file-platform" onclick="openPlatformPicker(event,'${esc(f.name)}','${esc(f.platform)}')">${esc(f.platform)}</span>`
                : `<button class="file-tag-btn" onclick="openPlatformPicker(event,'${esc(f.name)}','')">＋ Tag</button>`}
              <span class="file-size">${fmtSize(f.size)}</span>
              <span class="file-date">${fmtDate(f.mtime)}</span>
              <div class="file-acts">
                ${isPlayable(f) ? `<button class="sm-btn" onclick="playFile('${esc(f.name)}')">▶</button>` : ''}
                <a class="sm-btn" href="/files/${encodeURIComponent(f.name)}" download>${esc(T.btn_download_file)}</a>
                <button class="sm-btn danger" onclick="deleteFile('${esc(f.name)}')">${esc(T.btn_delete)}</button>
              </div>
            </div>
          </div>
        </div>`).join('');
    }

    function playFile(name) {
      const ext = name.split('.').pop().toLowerCase();
      const isVideo = ['mp4','mkv','webm','avi','mov'].includes(ext);
      const src = '/stream/' + encodeURIComponent(name);
      const tag = isVideo ? 'video' : 'audio';
      document.getElementById('player-title').textContent = name;
      document.getElementById('player-content').innerHTML =
        `<${tag} src="${src}" controls autoplay ${isVideo ? 'playsinline' : ''}></${tag}>`;
      document.getElementById('player-modal').classList.add('open');
      document.addEventListener('keydown', _playerEsc);
    }
    function closePlayer(e) {
      if (e && e.target !== document.getElementById('player-modal') && e.type === 'click') return;
      const modal = document.getElementById('player-modal');
      modal.classList.remove('open');
      document.getElementById('player-content').innerHTML = '';
      document.removeEventListener('keydown', _playerEsc);
    }
    function _playerEsc(e) { if (e.key === 'Escape') closePlayer(); }

    async function deleteFile(name) {
      if (!confirm(T.confirm_delete.replace('{name}', name))) return;
      try {
        const r = await fetch('/api/file/delete/' + encodeURIComponent(name), {method:'POST'});
        if (r.ok) { loadFiles(); loadDiskSpace(); }
        else toast(T.error_unknown, true);
      } catch(e) { toast(T.error_network, true); }
    }

    // ── Settings: yt-dlp ─────────────────────────────────────────────────────
    async function loadYtdlpVersion() {
      try {
        const r = await fetch('/api/ytdlp/version');
        if (!r.ok) return;
        const d = await r.json();
        document.getElementById('ytdlp-ver').textContent = d.version || '—';
      } catch(e) {}
    }

    async function updateYtdlp() {
      const btn = document.getElementById('ytdlp-update-btn');
      const ver = document.getElementById('ytdlp-ver');
      btn.disabled = true;
      ver.textContent = T.ytdlp_updating;
      try {
        const r = await fetch('/api/ytdlp/update', {method:'POST'});
        const d = await r.json();
        if (r.ok && d.version) {
          ver.textContent = d.version;
          toast(T.ytdlp_updated + ' ' + d.version);
        } else {
          ver.textContent = '—';
          toast(T.error_unknown, true);
        }
      } catch(e) { toast(T.error_network, true); ver.textContent = '—'; }
      finally { btn.disabled = false; loadYtdlpVersion(); }
    }

    // ── Settings: Cookies ─────────────────────────────────────────────────────
    async function loadCookiesStatus() {
      try {
        const r = await fetch('/api/cookies/status');
        if (!r.ok) return;
        const d = await r.json();
        const el  = document.getElementById('cookie-status');
        const del = document.getElementById('cookie-del-btn');
        if (d.loaded) {
          const domainStr = d.domains && d.domains.length ? d.domains.join(', ') : fmtSize(d.size);
          el.textContent = domainStr;
          el.title = fmtSize(d.size) + (d.domains && d.domains.length ? ' · ' + d.domains.length + ' Domains' : '');
          el.className = 'cookie-status cookie-ok';
          del.style.display = '';
          document.getElementById('cb-cookies-wrap').style.display = '';
        } else {
          el.textContent = T.cookies_none;
          el.title = '';
          el.className = 'cookie-status cookie-no';
          del.style.display = 'none';
          document.getElementById('cb-cookies-wrap').style.display = 'none';
        }
      } catch(e) {}
    }

    async function uploadCookies(input) {
      if (!input.files.length) return;
      const form = new FormData();
      form.append('file', input.files[0]);
      input.value = '';
      try {
        const r = await fetch('/api/cookies/upload', {method:'POST', body:form});
        const d = await r.json();
        if (r.ok) { toast('Cookies hochgeladen (' + fmtSize(d.size) + ')'); loadCookiesStatus(); }
        else toast(T.error_unknown + ': ' + d.error, true);
      } catch(e) { toast(T.error_network, true); }
    }

    async function deleteCookies() {
      if (!confirm(T.confirm_delete_cookies)) return;
      try {
        await fetch('/api/cookies/delete', {method:'POST'});
        loadCookiesStatus();
      } catch(e) { toast(T.error_network, true); }
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('url-input').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) {
          const lines = e.target.value.split('\n').filter(l => l.trim()).length;
          if (lines <= 1) { e.preventDefault(); startDownload(); }
        }
      });

      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

      // Web Share Target
      const sharedUrl = new URLSearchParams(window.location.search).get('url');
      if (sharedUrl) {
        document.getElementById('url-input').value = sharedUrl;
        history.replaceState({}, '', '/');
        startDownload();
      }

      loadJobs();
      loadFiles();
      loadDiskSpace();
      loadYtdlpVersion();
      loadCookiesStatus();

      schedulePoll();
    });
  </script>
</body>
</html>
