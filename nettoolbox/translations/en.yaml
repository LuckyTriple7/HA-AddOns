configuration:
  username:
    name: Username
    description: Username for signing in on the direct port. The Home Assistant sidebar never asks for credentials.
  password:
    name: Password
    description: Password for signing in on the direct port. Change it — the default changeme123 is public knowledge.
  session_hours:
    name: Session duration (hours)
    description: How long a login stays valid before signing in again is required.
  worker_url:
    name: Root-server worker — address
    description: >-
      Optional, normally left empty. Only fill this in when a second NetToolbox instance runs on
      a root server and should take over the checks — base address without a path, e.g.
      https://tools.example.com. Empty means this instance probes on its own, with the limits of
      a typical home connection (port 25 usually blocked, some blocklists refuse public
      resolvers). Running NetToolbox on a root server in the first place needs nothing here.
  worker_token:
    name: Root-server worker — access token
    description: >-
      Must match the target instance's worker_token. Also enable worker_enabled there, otherwise
      it answers with worker_disabled. The token travels with every request, in the clear over
      http — so put the worker behind a reverse proxy with TLS.
  worker_tls_verify:
    name: Root-server worker — verify TLS certificate
    description: Only disable for an https address with a self-signed certificate.
  worker_enabled:
    name: Act as a worker for other instances
    description: >-
      Belongs on the other side: enable it on the instance that runs the checks, not on the one
      sending them. Exposes the /worker/info and /worker/probe endpoints. Only enable with a
      strong, random worker_token — anyone holding a valid token can use this instance to run DNS
      and HTTP probes.
  resolvers:
    name: DNS resolvers
    description: >-
      Up to eight resolver addresses used for ordinary lookups. Defaults to Quad9 and Cloudflare.
      For blocklist and DNSSEC lookups a recursive resolver of your own (e.g. unbound) on the
      same machine pays off.
  dns_timeout:
    name: DNS timeout (seconds)
    description: How long to wait for a name server's answer.
  http_timeout:
    name: HTTP timeout (seconds)
    description: How long to wait for a web server's answer (MTA-STS policy, BIMI logo).
  allow_private_targets:
    name: Allow private addresses
    description: >-
      Allows probes against addresses on your own network (10.x, 192.168.x, 172.16-31.x,
      localhost). Disabled, this stops NetToolbox from being used as an open scanning proxy into
      your LAN. Only enable when deliberately checking your own network.
  rate_limit_per_min:
    name: Probes per minute
    description: Upper bound on probes per minute, whether requested through the UI or as a worker. 0 removes the limit.
  history_size:
    name: History — entry count
    description: How many past probes are kept in the history. 0 disables history.
  verbose_log:
    name: Verbose logging
    description: Writes extra lines to the add-on log. For troubleshooting only.
  monitoring_enabled:
    name: Monitoring active
    description: >-
      Turns on the background service that checks configured monitors (the "Monitoring" tab)
      automatically at their chosen interval. Has no effect with no monitors set up.
  monitoring_poll_seconds:
    name: Monitoring — background poll interval (seconds)
    description: >-
      How often the background service checks whether a monitor is due. Only affects accuracy,
      not how often a check actually runs — that is set per monitor.
  ha_sensors:
    name: Monitors as Home Assistant entities
    description: >-
      Creates one sensor per monitor in Home Assistant (sensor.nettoolbox_<name>) plus
      sensor.nettoolbox_probleme and binary_sensor.nettoolbox_problem, so the states can be
      shown on dashboards and used in automations. Refreshed every minute, because such states
      do not survive a Home Assistant restart. No effect outside the Supervisor.
  port_check_enabled:
    name: Allow port check
    description: >-
      Enables the “Port check” and “IPv4/IPv6 comparison” cards. Only a fixed, short list of
      well-known services on exactly the host entered is probed — no network ranges, no port
      ranges. Switch it off if this instance should never open connections to third-party
      services.
network:
  17798/tcp: NetToolbox web UI (direct, sign-in required)
