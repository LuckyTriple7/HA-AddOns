<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t.app_title }} – {{ t.pw_title }}</title>
  <meta name="theme-color" content="#0d1117">
  {% include '_auth_style.html' %}
</head>
<body>
  <div class="card">
    {% include '_auth_head.html' %}
    <p class="subtitle" style="margin-bottom:20px">
      {% if forced %}{{ t.pw_forced_hint }}{% else %}{{ t.pw_hint }}{% endif %}
    </p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="off">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <input type="text" name="username" value="{{ username }}" autocomplete="username" hidden>
      <label for="current">{{ t.pw_current }}</label>
      <input type="password" id="current" name="current" autocomplete="current-password" autofocus required>
      <label for="new">{{ t.pw_new }}</label>
      <input type="password" id="new" name="new" autocomplete="new-password" minlength="{{ minimum }}" required>
      <label for="again">{{ t.pw_again }}</label>
      <input type="password" id="again" name="again" autocomplete="new-password" minlength="{{ minimum }}" required>
      <button type="submit">{{ t.pw_submit }}</button>
    </form>
    {% if not forced %}
    <footer><a class="lang-btn" href="{{ url_for('index') }}">{{ t.pw_back }}</a></footer>
    {% else %}
    <footer><a class="lang-btn" href="{{ url_for('logout') }}">{{ t.logout }}</a></footer>
    {% endif %}
  </div>
  {% include '_auth_script.html' %}
</body>
</html>
