# NetToolbox ohne Home Assistant betreiben (Standalone / Dockge).
#
# Schnellstart:
#   1. docker compose up -d
#   2. docker compose logs nettoolbox   → erzeugtes Passwort für "admin"
#   3. http://<server>:17798 öffnen, mit admin + dem geloggten Passwort anmelden
#
# Eine data/options.json wird beim ersten Start automatisch angelegt (mit
# zufälligem Passwort). Danach lässt sich dort alles einstellen — auch, ob
# diese Instanz selbst als Root-Server-Worker für eine andere NetToolbox
# dient (worker_enabled + worker_token) oder umgekehrt ihre eigenen Abfragen
# an eine solche weiterreicht (worker_url + worker_token).

services:
  nettoolbox:
    image: ghcr.io/luckytriple7/nettoolbox:latest
    container_name: nettoolbox
    ports:
      - "17798:17798"
    volumes:
      - ./data:/data              # options.json, Sitzungen, Verlauf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:17798/health"]
      interval: 30s
      timeout: 10s
      retries: 3
