name: GitPulse
description: GitHub Control Panel — PRs, Issues, CI-Status und Release-Tracker auf einen Blick
version: "0.1.33"
slug: gitpulse
url: https://github.com/LuckyTriple7/HA-AddOns
image: "ghcr.io/luckytriple7/gitpulse"

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

panel_icon: mdi:github
panel_title: GitPulse

ingress: true
ingress_port: 17792
ingress_stream: true

map:
  - addon_config:rw

ports:
  17792/tcp: 17792
  17793/tcp: 17793

ports_description:
  17792/tcp: GitPulse Web-UI (direkt)
  17793/tcp: GitPulse Webhook-Empfang (GitHub)

options:
  username: "admin"
  password: "secret"
  session_hours: 24
  github_token: ""
  my_repos:
    - ""
  watch_repos:
    - "home-assistant/core"
  include_ha_betas: true
  poll_interval: 300
  verbose_log: false
  workflow_run_limit: 25
  telegram_bot_token: ""
  telegram_chat_id: ""
  webhook_secret: ""

schema:
  username: str
  password: str
  session_hours: int
  github_token: str
  my_repos:
    - str
  watch_repos:
    - str
  include_ha_betas: bool?
  poll_interval: int?
  verbose_log: bool?
  workflow_run_limit: int?
  telegram_bot_token: str?
  telegram_chat_id: str?
  webhook_secret: str?
