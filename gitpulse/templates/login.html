<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitPulse – {{ t.login }}</title>
  <meta name="theme-color" content="#0d1117">
  <style>
    :root { --bg:#0d1117; --surf:#161b22; --border:#30363d; --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --green:#238636; --green-h:#2ea043; --red:#f85149; }
    [data-theme="light"] { --bg:#f0f2f5; --surf:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#636c76; --accent:#0969da; --green:#1a7f37; --green-h:#2da44e; --red:#cf222e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 16px;
      transition: background .2s, color .2s;
    }
    .card { background: var(--surf); border: 1px solid var(--border); border-radius: 8px; padding: 32px 28px; width: 100%; max-width: 360px; }
    .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .subtitle { font-size: 0.8rem; color: var(--muted); margin-bottom: 28px; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    input[type="text"], input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 9px 12px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 16px;
      transition: border-color .15s;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button[type="submit"] {
      width: 100%; background: var(--green); border: 1px solid var(--green-h); color: #fff;
      padding: 9px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    button[type="submit"]:hover { background: var(--green-h); }
    .error { background: rgba(207,34,46,.12); border: 1px solid var(--red); color: var(--red); padding: 9px 12px; border-radius: 6px; font-size: 0.83rem; margin-bottom: 16px; }
    .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-bottom: 20px; }
    .lang-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; text-decoration: none; }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); }
    .theme-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 3px 6px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; }
    .theme-btn svg { width: 13px; height: 13px; fill: currentColor; }
    .icon-moon { display: block; } .icon-sun { display: none; }
    [data-theme="light"] .icon-moon { display: none; } [data-theme="light"] .icon-sun { display: block; }
    footer { text-align: center; margin-top: 20px; font-size: 0.72rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <a href="/set-lang/de?next=/login" class="lang-btn {% if lang == 'de' %}active{% endif %}">DE</a>
      <a href="/set-lang/en?next=/login" class="lang-btn {% if lang == 'en' %}active{% endif %}">EN</a>
      <button class="theme-btn" onclick="toggleTheme()" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        <svg class="icon-sun"  viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2v-2H2v2zm18 0h2v-2h-2v2zM11 2v2h2V2h-2zm0 18v2h2v-2h-2zM5.99 4.58 4.58 5.99l1.41 1.41 1.41-1.41L5.99 4.58zm12.03 12.03-1.41 1.41 1.41 1.41 1.41-1.41-1.41-1.41zm1.41-12.44-1.41-1.41-1.41 1.41 1.41 1.41 1.41-1.41zM5.99 19.42l1.41 1.41 1.41-1.41-1.41-1.41-1.41 1.41z"/></svg>
      </button>
    </div>
    <div class="logo-row">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.28-.01-1.03-.02-2.03-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.9-.01 3.29 0 .32.21.7.82.58C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
      <div class="logo">GitPulse</div>
    </div>
    <p class="subtitle">{{ t.subtitle }}</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="on">
      <label for="username">{{ t.username }}</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">{{ t.password }}</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">{{ t.login }}</button>
    </form>
    <footer>GitPulse &mdash; GitHub Control Panel</footer>
  </div>
  <script>
    (function(){ const t=localStorage.getItem('gp-theme')||'dark'; document.documentElement.setAttribute('data-theme',t); })();
    function toggleTheme(){ const c=document.documentElement.getAttribute('data-theme')||'dark'; const n=c==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('gp-theme',n); }
  </script>
</body>
</html>
