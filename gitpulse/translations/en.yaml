configuration:
  username:
    name: Username
    description: Login username for the web interface (only relevant for direct access on port 17792 — behind HA Ingress, authentication is handled by Home Assistant).
  password:
    name: Password
    description: Login password for the web interface (only relevant for direct access on port 17792).
  session_hours:
    name: Session Duration (hours)
    description: How many hours a login session stays valid before requiring re-authentication. Default 24.
  github_token:
    name: GitHub Token (Fine-Grained PAT)
    description: "GitHub Fine-Grained Personal Access Token. Required permissions: Contents (read), Pull Requests (read+write), Actions (read+write), Issues (read+write), Metadata (read). Create at: GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens."
  my_repos:
    name: My Repos
    description: "List of your own GitHub repositories in owner/repo format (e.g. LuckyTriple7/HA-AddOns). These repos are fully monitored: PRs, Issues, CI runs, Releases. Tip: Repos can also be managed directly in the dashboard via the ⚙ button — this setting is then ignored."
  watch_repos:
    name: Watch Repos (releases only)
    description: "Repositories to monitor for new releases only (no access to PRs/Issues/CI needed). Ideal for external projects like home-assistant/core or Hyundai-Kia-Connect/kia_uvo."
  include_ha_betas:
    name: Show HA Beta/RC Releases
    description: Show Home Assistant beta and release candidate versions in the Watch Releases tab. Default true.
  poll_interval:
    name: Poll Interval (seconds)
    description: "Pause between GitHub API queries. Lower = faster updates but more API calls (limit: 5000/hour). Default 300 (5 minutes). Minimum 10 seconds. With few repos, 30–60 seconds is recommended."
  verbose_log:
    name: Verbose Logging
    description: Logs repo count and details on every poll cycle. Default false — only errors and important events are logged.
  workflow_run_limit:
    name: Workflow Run Limit
    description: "How many workflow runs per repo are loaded in the CI/Actions tab. Default 25, maximum 50."
  telegram_bot_token:
    name: Telegram Bot Token
    description: "Token of the Telegram bot for notifications (format: 123456789:ABC-...). Leave empty to disable Telegram. Create a bot via @BotFather in Telegram."
  telegram_chat_id:
    name: Telegram Chat ID
    description: "Chat ID of the recipient for Telegram messages. Find it via @userinfobot in Telegram, or send /start to your bot and copy the ID from the response."
  webhook_secret:
    name: Webhook Secret
    description: "Secret password for GitHub webhooks (minimum 20 characters recommended). Must be entered identically in GitHub → Repository → Settings → Webhooks. Webhook URL: https://your-domain:17793/webhook. Leave empty to disable webhooks."
  smtp_host:
    name: SMTP Server (Hostname)
    description: "Hostname of the outgoing mail server, e.g. smtp.gmail.com or smtp.office365.com. Leave empty to disable e-mail notifications."
  smtp_port:
    name: SMTP Port
    description: "Port of the mail server. 587 = STARTTLS (default, recommended), 465 = SSL/TLS, 25 = unencrypted (not recommended)."
  smtp_user:
    name: SMTP Username
    description: "Login name for the mail server, usually the full e-mail address. Leave empty if the server requires no authentication."
  smtp_password:
    name: SMTP Password
    description: "Password for SMTP access. For Gmail use an app password (Google Account → Security → App Passwords). Leave empty if no authentication is needed."
  smtp_to:
    name: Recipient E-Mail Address
    description: "E-mail address to send notifications to. Required if smtp_host is set."
  smtp_tls:
    name: Use STARTTLS
    description: "true (default) = STARTTLS on port 587. false = direct SSL/TLS on port 465. Also set to false for port 25."
  addon_manager:
    name: Enable Add-on Manager
    description: "Enables the 'Add-on Releases' tab in GitPulse. Allows bumping versions and editing CHANGELOG entries for all add-ons in the repo directly from the UI. Default: false."
