configuration:
  username:
    name: Benutzername
    description: Benutzername für das Web-Interface (nur beim Direktzugriff auf Port 17792 relevant — hinter HA Ingress übernimmt HA die Authentifizierung).
  password:
    name: Passwort
    description: Passwort für das Web-Interface (nur beim Direktzugriff auf Port 17792 relevant).
  session_hours:
    name: Session-Dauer (Stunden)
    description: Wie viele Stunden eine Login-Session gültig bleibt. Standard 24.
  github_token:
    name: GitHub Token (Fine-Grained PAT)
    description: "GitHub Fine-Grained Personal Access Token. Benötigte Berechtigungen: Contents (read), Pull Requests (read+write), Actions (read+write), Issues (read+write), Metadata (read). Erstellen unter: GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens."
  my_repos:
    name: Eigene Repos
    description: "Liste der eigenen GitHub-Repositories im Format owner/repo (z.B. LuckyTriple7/HA-AddOns). Diese Repos werden vollständig überwacht: PRs, Issues, CI-Runs, Releases. Tipp: Repos können auch direkt im Dashboard über den ⚙-Button verwaltet werden — diese Einstellung wird dann ignoriert."
  watch_repos:
    name: Watch-Repos (nur Releases)
    description: "Repositories die nur auf neue Releases überwacht werden (kein Zugriff auf PRs/Issues/CI nötig). Ideal für externe Projekte wie home-assistant/core oder Hyundai-Kia-Connect/kia_uvo."
  include_ha_betas:
    name: HA Beta/RC-Releases anzeigen
    description: Beta- und Release-Candidate-Versionen von Home Assistant in den Watch-Releases anzeigen. Standard true.
  poll_interval:
    name: Abfrageintervall (Sekunden)
    description: "Pause zwischen zwei GitHub-API-Abfragen. Kleiner = schnellere Updates, aber mehr API-Aufrufe (Limit: 5000/Stunde). Standard 300 (5 Minuten). Minimum 10 Sekunden. Bei wenigen Repos ist 30–60 empfehlenswert."
  verbose_log:
    name: Ausführliches Logging
    description: Gibt pro Poll-Zyklus die Anzahl der Repos und Details im Log aus. Standard false — nur Fehler und wichtige Ereignisse werden geloggt.
  workflow_run_limit:
    name: Anzahl Workflow-Runs
    description: "Wie viele Workflow-Runs je Repo im CI/Actions-Tab geladen werden. Standard 25, Maximum 50."
  telegram_bot_token:
    name: Telegram Bot Token
    description: "Token des Telegram-Bots für Benachrichtigungen (Format: 123456789:ABC-...). Leer lassen um Telegram zu deaktivieren. Bot erstellen via @BotFather in Telegram."
  telegram_chat_id:
    name: Telegram Chat ID
    description: "Chat-ID des Empfängers für Telegram-Nachrichten. Ermitteln via @userinfobot in Telegram oder einfach dem Bot /start schicken und die ID aus der Antwort kopieren."
  webhook_secret:
    name: Webhook Secret
    description: "Geheimes Passwort für GitHub-Webhooks (mindestens 20 Zeichen empfohlen). Muss identisch in GitHub → Repository → Settings → Webhooks eingetragen werden. Webhook-URL: https://deine-domain:17793/webhook. Leer lassen um Webhooks zu deaktivieren."
  smtp_host:
    name: SMTP-Server (Hostname)
    description: "Hostname des ausgehenden Mailservers, z.B. smtp.gmail.com, smtp.web.de oder mail.your-server.de. Leer lassen um E-Mail-Benachrichtigungen zu deaktivieren."
  smtp_port:
    name: SMTP-Port
    description: "Port des Mailservers. 587 = STARTTLS (Standard, empfohlen), 465 = SSL/TLS, 25 = ohne Verschlüsselung (nicht empfohlen)."
  smtp_user:
    name: SMTP-Benutzername
    description: "Anmelde-Name beim Mailserver, meist die vollständige E-Mail-Adresse. Leer lassen wenn der Server keine Authentifizierung erfordert."
  smtp_password:
    name: SMTP-Passwort
    description: "Passwort für den SMTP-Zugang. Bei Gmail ein App-Passwort verwenden (Google-Konto → Sicherheit → App-Passwörter). Leer lassen wenn keine Authentifizierung nötig."
  smtp_to:
    name: Empfänger-E-Mail-Adresse
    description: "E-Mail-Adresse, an die Benachrichtigungen gesendet werden. Pflichtfeld wenn smtp_host gesetzt ist."
  smtp_tls:
    name: STARTTLS verwenden
    description: "true (Standard) = STARTTLS auf Port 587. false = direktes SSL/TLS auf Port 465. Bei Port 25 ebenfalls false setzen."
  addon_manager:
    name: Add-on Manager aktivieren
    description: "Aktiviert den Tab 'Add-on Releases' in GitPulse. Damit können Versionen und CHANGELOG-Einträge für alle Add-ons im Repo direkt aus der UI heraus committet werden. Standard: false."
  digest_hour:
    name: Tages-Digest Uhrzeit
    description: "Stunde (0–23), zu der einmal täglich eine Zusammenfassung aller offenen PRs, Issues und Security-Alerts per E-Mail und Telegram gesendet wird. -1 = deaktiviert (Standard). Beispiel: 8 = täglich um 08:xx Uhr."
