configuration:
  enable_mcp:
    name: Enable Home Assistant MCP
    description: >-
      Enable the Home Assistant MCP server for direct entity and service
      interaction from Claude Code. Allows Claude to query states, call services,
      and interact with your smart home.
  enable_playwright_mcp:
    name: Enable Playwright MCP
    description: >-
      Enable the Playwright MCP server for browser automation. Requires the
      "Playwright Browser" add-on to be installed and running. Allows Claude to
      navigate web pages, fill forms, click elements, and take screenshots.
  playwright_cdp_host:
    name: Playwright CDP Host
    description: >-
      Hostname of the Playwright Browser add-on for CDP connection. Leave empty
      for default (playwright-browser). If connection fails, check the Playwright
      Browser container hostname (e.g., 1016f397-playwright-browser).
  terminal_font_size:
    name: Terminal Font Size
    description: >-
      Font size for the web terminal in pixels (10-24).
      Adjust for readability on your display.
  terminal_theme:
    name: Terminal Theme
    description: >-
      Color theme for the web terminal.
      Choose 'dark' for dark backgrounds or 'light' for light backgrounds.
  working_directory:
    name: Working Directory
    description: >-
      The default working directory when Claude Code starts.
      Use /homeassistant for direct access to HA configuration files.
  session_persistence:
    name: Session Persistence
    description: >-
      Enable tmux session persistence. When enabled, your terminal session
      survives browser refreshes and disconnects. Recommended for long-running tasks.
  tmux_scroll_mode:
    name: Tmux Scroll Mode
    description: >-
      Scroll behavior when session persistence is enabled. "browser": lines
      flow into the native browser scrollback — mouse wheel, touch scrolling
      (iPad) and normal copy/paste work as usual. "tmux": the mouse wheel
      scrolls through the tmux history (survives browser reloads), but touch
      scrolling is unavailable and copying goes through tmux. If input seems
      blocked, press q (exits copy mode). Default: browser.
  mobile_scroll_ui:
    name: Mobile Scroll Controls
    description: >-
      Swipe to scroll plus two scroll buttons in the terminal — touch devices
      only (phone, tablet, HA Companion App), desktop browsers are left
      unchanged. Needed because xterm.js disables touch scrolling as soon as an
      application turns on mouse tracking (e.g. tmux in scroll mode tmux).
      Default: enabled.
  claude_autostart:
    name: Auto-start Claude
    description: >-
      Automatically start Claude Code when the terminal opens.
      After exiting Claude, a normal bash shell is opened.
      Disabled: terminal opens a bash shell directly without starting Claude.
  auto_update_claude:
    name: Auto-update Claude Code
    description: >-
      Automatically check for and install Claude Code updates on add-on startup.
      Keeps Claude Code current without requiring add-on version bumps.
  notify_on_update:
    name: HA Notification on Update
    description: >-
      Show a persistent Home Assistant notification when a new Claude Code version
      is detected. Disable if you don't want HA notifications (updates are still
      detected and shown in the terminal). Default: enabled.
  model:
    name: Claude Model
    description: >-
      The Claude model to use. claude-sonnet-5 is the newest model and offers the
      best balance of speed and capability. claude-fable-5 is very powerful,
      claude-opus-5 very capable for complex tasks. claude-haiku-4-5-20251001 is the fastest.
      Auto-update Claude Code (above) ensures new models become available
      without an add-on update.
  export_memory:
    name: Export Memory
    description: >-
      On startup, copy memory files, memory index, and custom commands to the
      add-on config folder (/config/memory/ and /config/commands/).
      Enables easy access and backup of Claude's memories. Default: disabled.
  export_memory_interval:
    name: Memory Export Interval (minutes)
    description: >-
      Schedule for automatic memory export in minutes (only active when
      "Export Memory" is enabled). 0 = no scheduled export, startup only.
      Examples: 60 = hourly, 1440 = daily. Default: 60.
  enable_caveman_skill:
    name: Enable Caveman Skills
    description: >-
      Installs the optional "Caveman" skills for Claude Code (terse, technically
      precise responses without filler): /caveman plus /caveman-commit,
      /caveman-review, /caveman-compress, /caveman-help, /caveman-stats and
      /cavecrew together with the three cavecrew subagents. Can be toggled at any
      time; re-synced on every startup. Default: disabled.
  protect_internal_config:
    name: Protect Internal HA Directories
    description: >-
      Denies Claude write access to Home Assistant's internal directories
      (.storage/, .cloud/, deps/, tts/ and the recorder database). Those hold
      everything created through the user interface plus the entity and device
      registries; hand-edited, they can leave Home Assistant unable to start.
      Reading stays allowed. Only turn this off if you know exactly why you need
      to write there. Default: enabled.

network:
  7681/tcp: Web Terminal (ttyd)

