configuration:
  enable_mcp:
    name: Habilitar MCP de Home Assistant
    description: >-
      Habilita el servidor MCP de Home Assistant para interacción directa con
      entidades y servicios desde Claude Code. Permite que Claude consulte
      estados, llame servicios e interactúe con tu hogar inteligente.
  enable_playwright_mcp:
    name: Habilitar MCP Playwright
    description: >-
      Habilita el servidor MCP Playwright para automatización del navegador. Requiere
      el add-on "Playwright Browser" instalado y ejecutándose. Permite que Claude
      navegue páginas web, complete formularios, haga clic en elementos y tome
      capturas de pantalla.
  playwright_cdp_host:
    name: Host CDP de Playwright
    description: >-
      Nombre del host del add-on Playwright Browser para conexión CDP. Deja vacío
      para el predeterminado (playwright-browser). Si la conexión falla, verifica el
      nombre del host del contenedor Playwright Browser (ej: 1016f397-playwright-browser).
  terminal_font_size:
    name: Tamaño de Fuente del Terminal
    description: >-
      Tamaño de fuente del terminal web en píxeles (10-24).
      Ajusta para mejor legibilidad en tu pantalla.
  terminal_theme:
    name: Tema del Terminal
    description: >-
      Tema de colores del terminal web.
      Elige 'dark' para fondo oscuro o 'light' para fondo claro.
  working_directory:
    name: Directorio de Trabajo
    description: >-
      El directorio predeterminado cuando Claude Code inicia.
      Usa /homeassistant para acceso directo a los archivos de configuración de HA.
  session_persistence:
    name: Persistencia de Sesión
    description: >-
      Habilita persistencia de sesión via tmux. Cuando está habilitado, tu sesión
      del terminal sobrevive a actualizaciones del navegador y desconexiones.
      Recomendado para tareas de larga duración.
  tmux_scroll_mode:
    name: Modo de Desplazamiento Tmux
    description: >-
      Comportamiento de desplazamiento con la persistencia de sesión habilitada.
      "browser": las líneas van al scrollback nativo del navegador — rueda del
      ratón, desplazamiento táctil (iPad) y copiar/pegar normal funcionan como
      siempre. "tmux": la rueda del ratón desplaza el historial de tmux
      (sobrevive a recargas del navegador), pero sin desplazamiento táctil y
      el copiado se hace via tmux. Si la entrada parece bloqueada, pulsa q
      (sale del modo copia). Predeterminado: browser.
  auto_update_claude:
    name: Actualización Automática de Claude Code
    description: >-
      Verifica e instala automáticamente actualizaciones de Claude Code al iniciar el add-on.
      Mantiene Claude Code actualizado sin necesidad de actualizar la versión del add-on.
  notify_on_update:
    name: Notificación de HA al Actualizar
    description: >-
      Mostrar una notificación persistente en Home Assistant cuando se detecte una
      nueva versión de Claude Code. Desactiva si no deseas notificaciones en HA
      (las actualizaciones siguen detectándose y mostrándose en el terminal). Predeterminado: activado.
  model:
    name: Modelo Claude
    description: >-
      El modelo Claude a utilizar. claude-sonnet-5 es el modelo más nuevo y ofrece el
      mejor equilibrio entre velocidad y capacidad. claude-fable-5 es muy poderoso,
      claude-opus-4-8 muy capaz para tareas complejas. claude-haiku-4-5-20251001 es el más rápido.
      La actualización automática de Claude Code (arriba) garantiza que
      los nuevos modelos estén disponibles sin necesidad de actualizar el add-on.
  enable_caveman_skill:
    name: Activar habilidad Caveman
    description: >-
      Instala la habilidad opcional "Caveman" para Claude Code (respuestas
      concisas y técnicamente precisas sin relleno). Se puede activar o
      desactivar en cualquier momento; se resincroniza en cada inicio.
      Predeterminado: desactivado.

network:
  7681/tcp: Terminal Web (ttyd)

