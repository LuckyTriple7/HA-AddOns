configuration:
  enable_mcp:
    name: Habilitar MCP de Home Assistant
    description: >-
      Habilita el servidor MCP de Home Assistant para interacción directa con
      entidades y servicios desde Claude Code. Permite que Claude consulte
      estados, llame servicios e interactúe con tu hogar inteligente.
  enable_playwright_mcp:
    name: Habilitar MCP Playwright
    description: >-
      Habilita el servidor MCP Playwright para automatización del navegador. Requiere
      el add-on "Playwright Browser" instalado y ejecutándose. Permite que Claude
      navegue páginas web, complete formularios, haga clic en elementos y tome
      capturas de pantalla.
  playwright_cdp_host:
    name: Host CDP de Playwright
    description: >-
      Nombre del host del add-on Playwright Browser para conexión CDP. Deja vacío
      para el predeterminado (playwright-browser). Si la conexión falla, verifica el
      nombre del host del contenedor Playwright Browser (ej: 1016f397-playwright-browser).
  terminal_font_size:
    name: Tamaño de Fuente del Terminal
    description: >-
      Tamaño de fuente del terminal web en píxeles (10-24).
      Ajusta para mejor legibilidad en tu pantalla.
  terminal_theme:
    name: Tema del Terminal
    description: >-
      Tema de colores del terminal web.
      Elige 'dark' para fondo oscuro o 'light' para fondo claro.
  working_directory:
    name: Directorio de Trabajo
    description: >-
      El directorio predeterminado cuando Claude Code inicia.
      Usa /homeassistant para acceso directo a los archivos de configuración de HA.
  session_persistence:
    name: Persistencia de Sesión
    description: >-
      Habilita persistencia de sesión via tmux. Cuando está habilitado, tu sesión
      del terminal sobrevive a actualizaciones del navegador y desconexiones.
      Recomendado para tareas de larga duración.
  tmux_scroll_mode:
    name: Modo de Desplazamiento Tmux
    description: >-
      Comportamiento de desplazamiento con la persistencia de sesión habilitada.
      "browser": las líneas van al scrollback nativo del navegador — rueda del
      ratón, desplazamiento táctil (iPad) y copiar/pegar normal funcionan como
      siempre. "tmux": la rueda del ratón desplaza el historial de tmux
      (sobrevive a recargas del navegador), pero sin desplazamiento táctil y
      el copiado se hace via tmux. Si la entrada parece bloqueada, pulsa q
      (sale del modo copia). Predeterminado: browser.
  mobile_scroll_ui:
    name: Controles de Desplazamiento Móvil
    description: >-
      Deslizar para desplazar y dos botones de desplazamiento en el terminal —
      solo en dispositivos táctiles (móvil, tablet, app HA Companion); los
      navegadores de escritorio no cambian. Necesario porque xterm.js desactiva
      el desplazamiento táctil en cuanto una aplicación activa el seguimiento
      del ratón (p. ej. tmux en modo de desplazamiento tmux).
      Predeterminado: activado.
  auto_update_claude:
    name: Actualización Automática de Claude Code
    description: >-
      Verifica e instala automáticamente actualizaciones de Claude Code al iniciar el add-on.
      Mantiene Claude Code actualizado sin necesidad de actualizar la versión del add-on.
  notify_on_update:
    name: Notificación de HA al Actualizar
    description: >-
      Mostrar una notificación persistente en Home Assistant cuando se detecte una
      nueva versión de Claude Code. Desactiva si no deseas notificaciones en HA
      (las actualizaciones siguen detectándose y mostrándose en el terminal). Predeterminado: activado.
  model:
    name: Modelo Claude
    description: >-
      El modelo Claude a utilizar. claude-sonnet-5 es el modelo más nuevo y ofrece el
      mejor equilibrio entre velocidad y capacidad. claude-fable-5 es muy poderoso,
      claude-opus-5 muy capaz para tareas complejas. claude-haiku-4-5-20251001 es el más rápido.
      La actualización automática de Claude Code (arriba) garantiza que
      los nuevos modelos estén disponibles sin necesidad de actualizar el add-on.
  enable_caveman_skill:
    name: Activar habilidades Caveman
    description: >-
      Instala las habilidades opcionales "Caveman" para Claude Code (respuestas
      concisas y técnicamente precisas sin relleno): /caveman más
      /caveman-commit, /caveman-review, /caveman-compress, /caveman-help,
      /caveman-stats y /cavecrew junto con los tres subagentes cavecrew. Se
      puede activar o desactivar en cualquier momento; se resincroniza en cada
      inicio. Predeterminado: desactivado.
  protect_internal_config:
    name: Proteger directorios internos de HA
    description: >-
      Impide que Claude escriba en los directorios internos de Home Assistant
      (.storage/, .cloud/, deps/, tts/ y la base de datos del recorder). Ahí
      está todo lo creado desde la interfaz, además de los registros de
      entidades y dispositivos; editados a mano, pueden impedir que Home
      Assistant arranque. La lectura sigue permitida. Además, Claude no puede
      leer los archivos de tokens .claudecode/.env y
      .claudecode/.git-credentials. Desactívalo solo si sabes exactamente por
      qué necesitas escribir ahí. Predeterminado: activado.

  enable_direct_access:
    name: Acceso directo desde el navegador (puerto 7682)
    description: >-
      Publica el terminal también en el puerto 7682, accesible en
      http://<IP-de-HA>:7682 — sin pasar por el ingress ni, por tanto, por el
      inicio de sesión de Home Assistant. Es la misma sesión que la del panel
      de ingress, solo otra vía de entrada.
      ATENCIÓN - el terminal es una shell de root con acceso completo al
      sistema anfitrión. Por eso el puerto solo arranca cuando hay una
      contraseña definida, y se protege con HTTP Basic Auth. Esta viaja sin
      cifrar, así que sirve únicamente dentro de la red propia - nunca
      redirijas este puerto a internet en el router. Por defecto - desactivado.
  direct_username:
    name: Usuario para el acceso directo
    description: >-
      Usuario para la solicitud de contraseña en el puerto 7682.
      Solo tiene efecto con el acceso directo activado. Por defecto - admin.
  direct_password:
    name: Contraseña para el acceso directo
    description: >-
      Contraseña que se pide en el puerto 7682. Mientras este campo esté vacío
      el puerto no arranca, ni siquiera con el acceso directo activado. Usa una
      contraseña larga y aleatoria - protege una shell de root.

network:
  7681/tcp: Terminal Web (ttyd)
  7682/tcp: Acceso directo desde el navegador (requiere contraseña, no redirigir a internet)

