configuration:
  enable_mcp:
    name: Habilitar MCP do Home Assistant
    description: >-
      Habilita o servidor MCP do Home Assistant para interação direta com
      entidades e serviços pelo Claude Code. Permite que o Claude consulte
      estados, chame serviços e interaja com sua casa inteligente.
  enable_playwright_mcp:
    name: Habilitar MCP Playwright
    description: >-
      Habilita o servidor MCP Playwright para automação de navegador. Requer o
      add-on "Playwright Browser" instalado e em execução. Permite que o Claude
      navegue em páginas web, preencha formulários, clique em elementos e tire
      screenshots.
  playwright_cdp_host:
    name: Host CDP do Playwright
    description: >-
      Nome do host do add-on Playwright Browser para conexão CDP. Deixe vazio
      para o padrão (playwright-browser). Se a conexão falhar, verifique o
      nome do host do container Playwright Browser (ex: 1016f397-playwright-browser).
  terminal_font_size:
    name: Tamanho da Fonte do Terminal
    description: >-
      Tamanho da fonte do terminal web em pixels (10-24).
      Ajuste para melhor legibilidade no seu monitor.
  terminal_theme:
    name: Tema do Terminal
    description: >-
      Tema de cores do terminal web.
      Escolha 'dark' para fundo escuro ou 'light' para fundo claro.
  working_directory:
    name: Diretório de Trabalho
    description: >-
      O diretório padrão quando o Claude Code inicia.
      Use /homeassistant para acesso direto aos arquivos de configuração do HA.
  session_persistence:
    name: Persistência de Sessão
    description: >-
      Habilita persistência de sessão via tmux. Quando habilitado, sua sessão
      do terminal sobrevive a atualizações do navegador e desconexões.
      Recomendado para tarefas de longa duração.
  tmux_scroll_mode:
    name: Modo de Rolagem Tmux
    description: >-
      Comportamento de rolagem com a persistência de sessão habilitada.
      "browser": as linhas vão para o scrollback nativo do navegador — roda do
      mouse, rolagem por toque (iPad) e copiar/colar normal funcionam como de
      costume. "tmux": a roda do mouse rola pelo histórico do tmux (sobrevive
      a recarregamentos do navegador), mas sem rolagem por toque e a cópia é
      feita via tmux. Se a entrada parecer bloqueada, pressione q (sai do
      modo cópia). Padrão: browser.
  mobile_scroll_ui:
    name: Controles de Rolagem Móvel
    description: >-
      Deslizar para rolar e dois botões de rolagem no terminal — apenas em
      dispositivos de toque (celular, tablet, app HA Companion); navegadores de
      desktop não mudam. Necessário porque o xterm.js desativa a rolagem por
      toque assim que um aplicativo ativa o rastreamento do mouse (por exemplo,
      tmux no modo de rolagem tmux). Padrão: ativado.
  auto_update_claude:
    name: Atualização Automática do Claude Code
    description: >-
      Verifica e instala automaticamente atualizações do Claude Code ao iniciar o add-on.
      Mantém o Claude Code atualizado sem precisar atualizar a versão do add-on.
  notify_on_update:
    name: Notificação do HA ao Atualizar
    description: >-
      Exibir uma notificação persistente no Home Assistant quando uma nova versão
      do Claude Code for detectada. Desative se não quiser notificações no HA
      (as atualizações ainda são detectadas e exibidas no terminal). Padrão: ativado.
  model:
    name: Modelo Claude
    description: >-
      O modelo Claude a ser utilizado. claude-sonnet-5 é o modelo mais recente e oferece
      o melhor equilíbrio entre velocidade e capacidade. claude-fable-5 é muito poderoso,
      claude-opus-5 muito capaz para tarefas complexas. claude-haiku-4-5-20251001 é o mais rápido.
      A atualização automática do Claude Code (acima) garante que novos
      modelos fiquem disponíveis sem precisar atualizar o add-on.
  enable_caveman_skill:
    name: Ativar habilidade Caveman
    description: >-
      Instala a habilidade opcional "Caveman" para Claude Code (respostas
      concisas e tecnicamente precisas, sem enrolação). Pode ser ativada ou
      desativada a qualquer momento; ressincronizada a cada inicialização.
      Padrão: desativado.

network:
  7681/tcp: Terminal Web (ttyd)

