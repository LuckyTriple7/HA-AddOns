configuration:
  enable_mcp:
    name: Home Assistant MCP aktivieren
    description: >-
      Aktiviert den Home Assistant MCP-Server für direkten Zugriff auf Entitäten
      und Dienste aus Claude Code. Ermöglicht Claude, Zustände abzufragen,
      Dienste aufzurufen und mit dem Smart Home zu interagieren.
  enable_playwright_mcp:
    name: Playwright MCP aktivieren
    description: >-
      Aktiviert den Playwright MCP-Server für Browser-Automatisierung. Erfordert
      das Add-on "Playwright Browser" (installiert und gestartet). Ermöglicht Claude,
      Webseiten zu navigieren, Formulare auszufüllen, Elemente anzuklicken und
      Screenshots zu erstellen.
  playwright_cdp_host:
    name: Playwright CDP-Host
    description: >-
      Hostname des Playwright Browser Add-ons für die CDP-Verbindung. Leer lassen
      für den Standard (playwright-browser). Bei Verbindungsproblemen den
      Container-Hostnamen prüfen (z. B. 1016f397-playwright-browser).
  terminal_font_size:
    name: Terminal-Schriftgröße
    description: >-
      Schriftgröße des Web-Terminals in Pixeln (10–24).
      Nach Bedarf für die Lesbarkeit anpassen.
  terminal_theme:
    name: Terminal-Design
    description: >-
      Farbdesign des Web-Terminals.
      "dark" für dunklen Hintergrund, "light" für hellen Hintergrund.
  working_directory:
    name: Arbeitsverzeichnis
    description: >-
      Standardverzeichnis beim Start von Claude Code.
      /homeassistant für direkten Zugriff auf die HA-Konfigurationsdateien verwenden.
  session_persistence:
    name: Sitzungserhaltung
    description: >-
      Tmux-Sitzungserhaltung aktivieren. Bei aktivierter Option überlebt die
      Terminal-Sitzung Browser-Aktualisierungen und Verbindungsabbrüche.
      Empfohlen für länger laufende Aufgaben.
  tmux_scroll_mode:
    name: Tmux-Scroll-Modus
    description: >-
      Scroll-Verhalten bei aktivierter Sitzungserhaltung. "browser": Zeilen
      landen im nativen Browser-Scrollback — Mausrad, Touch-Scrollen (iPad)
      und normales Kopieren/Einfügen funktionieren wie gewohnt. "tmux":
      Mausrad scrollt durch die tmux-Historie (überlebt Browser-Reloads),
      dafür kein Touch-Scrollen und Kopieren nur über tmux. Wirkt die Eingabe
      blockiert: q drücken (verlässt den Copy-Mode). Standard: browser.
  mobile_scroll_ui:
    name: Mobile Scroll-Bedienung
    description: >-
      Wischen zum Scrollen und zwei Scroll-Knöpfe im Terminal — nur auf
      Touch-Geräten (Handy, Tablet, HA Companion App), Desktop-Browser bleiben
      unverändert. Nötig, weil xterm.js das Touch-Scrollen abschaltet, sobald
      eine Anwendung die Maus-Erfassung aktiviert (z. B. tmux im
      Scroll-Modus tmux). Standard: aktiviert.
  claude_autostart:
    name: Claude automatisch starten
    description: >-
      Claude Code beim Öffnen des Terminals automatisch starten.
      Nach dem Beenden von Claude wird eine normale Bash-Shell geöffnet.
      Deaktiviert: Terminal öffnet direkt eine Bash-Shell ohne Claude zu starten.
  auto_update_claude:
    name: Claude Code automatisch aktualisieren
    description: >-
      Beim Start des Add-ons automatisch nach Claude Code-Updates suchen und
      diese installieren. Hält Claude Code aktuell ohne Versions-Bump des Add-ons.
  notify_on_update:
    name: HA-Benachrichtigung bei Update
    description: >-
      Beim Erkennen einer neuen Claude Code-Version eine persistente
      Home Assistant-Benachrichtigung anzeigen. Deaktivieren, wenn keine
      Notification in HA gewünscht ist (Update wird trotzdem erkannt und
      im Terminal angezeigt). Standard: aktiviert.
  model:
    name: Claude-Modell
    description: >-
      Das zu verwendende Claude-Modell. claude-sonnet-5 ist das neueste Modell und
      bietet die beste Balance aus Geschwindigkeit und Leistung. claude-fable-5 ist
      sehr leistungsstark, claude-opus-5 sehr stark für komplexe Aufgaben.
      claude-haiku-4-5-20251001 ist das schnellste. Mit aktiviertem
      Auto-Update stehen neue Modelle ohne Add-on-Update zur Verfügung.
  export_memory:
    name: Memory exportieren
    description: >-
      Beim Start Memory-Dateien, Memory-Index und eigene Befehle in den
      Add-on-Konfigurationsordner kopieren (/config/memory/ und /config/commands/).
      Ermöglicht einfachen Zugriff und Sicherung der Claude-Erinnerungen.
      Standard: deaktiviert.
  export_memory_interval:
    name: Memory-Export-Intervall (Minuten)
    description: >-
      Zeitplan für den automatischen Memory-Export in Minuten (nur aktiv wenn
      "Memory exportieren" aktiviert ist). 0 = kein geplanter Export, nur beim Start.
      Beispiele: 60 = stündlich, 1440 = täglich. Standard: 60.
  enable_caveman_skill:
    name: Caveman-Skills aktivieren
    description: >-
      Installiert die optionalen "Caveman"-Skills für Claude Code (knappe,
      technisch präzise Antworten ohne Füllwörter): /caveman plus /caveman-commit,
      /caveman-review, /caveman-compress, /caveman-help, /caveman-stats und
      /cavecrew samt der drei cavecrew-Subagenten. Aktivierbar/deaktivierbar
      jederzeit, wird bei jedem Start neu synchronisiert. Standard: deaktiviert.
  protect_internal_config:
    name: Interne HA-Verzeichnisse schreibgeschützt
    description: >-
      Verbietet Claude das Schreiben in die internen Verzeichnisse von Home
      Assistant (.storage/, .cloud/, deps/, tts/ und die Recorder-Datenbank).
      Dort liegt alles über die Oberfläche Erstellte samt Entity- und
      Device-Registry; von Hand geändert kann Home Assistant nicht mehr starten.
      Lesen bleibt erlaubt. Zusätzlich kann Claude die eigenen Token-Dateien
      .claudecode/.env und .claudecode/.git-credentials nicht lesen. Abschalten
      nur, wenn du genau weißt, warum du dort schreiben willst.
      Standard: aktiviert.

  enable_direct_access:
    name: Direkter Browser-Zugriff (Port 7682)
    description: >-
      Öffnet das Terminal zusätzlich auf Port 7682, erreichbar unter
      http://<HA-IP>:7682 — am Ingress und damit am Home-Assistant-Login vorbei.
      Es ist dieselbe Sitzung wie im Ingress-Panel, nur ein zweiter Zugang.
      ACHTUNG - Das Terminal ist eine Root-Shell mit vollem Zugriff auf das
      Host-System. Der Port startet deshalb nur, wenn ein Passwort gesetzt ist,
      und schützt sich mit HTTP Basic Auth. Die geht unverschlüsselt über die
      Leitung, taugt also nur im eigenen Netz - diesen Port niemals im Router
      ins Internet weiterleiten. Standard - deaktiviert.
  direct_username:
    name: Benutzername für Direktzugriff
    description: >-
      Benutzername für die Passwortabfrage auf Port 7682.
      Nur wirksam bei aktiviertem Direktzugriff. Standard - admin.
  direct_password:
    name: Passwort für Direktzugriff
    description: >-
      Passwort für die Abfrage auf Port 7682. Solange dieses Feld leer ist,
      startet der Port nicht - auch dann nicht, wenn der Direktzugriff
      aktiviert ist. Ein langes, zufälliges Passwort verwenden, es schützt
      eine Root-Shell.

network:
  7681/tcp: Web-Terminal (ttyd)
  7682/tcp: Direkter Browser-Zugriff (nur mit Passwort, nicht ins Internet weiterleiten)
