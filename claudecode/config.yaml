name: Claude Code
description: KI-Coding-Assistent Claude Code direkt in Home Assistant – Automationen erstellen, Konfiguration verwalten und Fehler beheben
version: "1.3.19"
image: "ghcr.io/luckytriple7/claudecode"
slug: claudecode
url: https://github.com/LuckyTriple7/HA-AddOns
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:brain
panel_title: Claude Code
ports:
  7683/tcp: null
ports_description:
  7683/tcp: >-
    Direkter Browser-Zugriff auf das Terminal, am Ingress vorbei. Nur wirksam,
    wenn enable_direct_access aktiviert und direct_password gesetzt ist. Ohne
    Passwort startet der Port nicht. Niemals ins Internet weiterleiten —
    Basic Auth geht unverschlüsselt über HTTP.
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: manager
uart: true
docker_api: true
full_access: true
map:
  - homeassistant_config:rw
  - ssl:ro
  - share:rw
  - media:rw
  - app_config:rw
  - backup:ro
options:
  enable_mcp: true
  enable_playwright_mcp: false
  playwright_cdp_host: ""
  terminal_font_size: 14
  terminal_theme: dark
  working_directory: /homeassistant
  session_persistence: true
  tmux_scroll_mode: browser
  mobile_scroll_ui: true
  claude_autostart: false
  auto_update_claude: true
  notify_on_update: true
  model: claude-sonnet-5
  export_memory: false
  export_memory_interval: 60
  enable_caveman_skill: false
  protect_internal_config: true
  enable_direct_access: false
  direct_username: admin
  direct_password: ""
schema:
  enable_mcp: bool
  enable_playwright_mcp: bool
  playwright_cdp_host: str?
  terminal_font_size: int(10,24)
  terminal_theme: list(dark|light)
  working_directory: str
  session_persistence: bool
  tmux_scroll_mode: list(browser|tmux)
  mobile_scroll_ui: bool
  claude_autostart: bool
  auto_update_claude: bool
  notify_on_update: bool
  model: list(claude-sonnet-5|claude-fable-5|claude-opus-5|claude-haiku-4-5-20251001)
  export_memory: bool
  export_memory_interval: int(0,1440)
  enable_caveman_skill: bool
  protect_internal_config: bool
  enable_direct_access: bool
  direct_username: str
  direct_password: password?
environment:
  TERM: xterm-256color

