name: Telegram
description: Telegram als vollwertiger Client direkt in Home Assistant — mit Chat-UI, REST-API und Webhook-Support
version: "1.7.8"
image: "ghcr.io/luckytriple7/telegram"
slug: telegram
url: https://github.com/LuckyTriple7/HA-AddOns

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: true
watchdog: "tcp://[HOST]:17778"

map:
  - app_config:rw

ingress: true
ingress_port: 17778
panel_icon: phu:telegram
panel_title: Telegram

ports:
  17778/tcp: null
  17788/tcp: null

ports_description:
  17778/tcp: >-
    Web-UI und REST-API ohne Authentifizierung - wer den Port erreicht, kann
    mitlesen und senden. Standardmaessig zu; der Zugang laeuft ueber Ingress
    oder das MessengerPortal. Nur freigeben, wenn du weisst warum.
  17788/tcp: >-
    REST-API mit Token - nur /api/*, keine Oberflaeche. Braucht zusaetzlich
    die Optionen "REST-API auf eigenem Port" und "API-Token".

homeassistant_api: true

options:
  api_enabled: false
  api_token: ""
  api_id: 0
  api_hash: ""
  phone_number: ""
  dark_mode: true
  download_media: false
  media_max_mb: 500
  video_max_mb: 50
  fetch_messages_limit: 50
  webhook_incoming: ""
  debug_mode: false
  ha_notifications: false
  ha_notifications_privacy: false
  ha_notifications_skip_bots: false

schema:
  api_enabled: bool
  api_token: password?
  api_id: int
  api_hash: str
  phone_number: str
  dark_mode: bool
  download_media: bool
  media_max_mb: int?
  video_max_mb: int?
  fetch_messages_limit: int
  webhook_incoming: str?
  debug_mode: bool
  ha_notifications: bool
  ha_notifications_privacy: bool
  ha_notifications_skip_bots: bool
