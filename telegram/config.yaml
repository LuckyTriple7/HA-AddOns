name: Telegram
description: Telegram als vollwertiger Client direkt in Home Assistant — mit Chat-UI, REST-API und Webhook-Support
version: "1.5.33"
image: "ghcr.io/luckytriple7/telegram"
slug: telegram
url: https://github.com/LuckyTriple7/HA-AddOns

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

map:
  - addon_config:rw

ingress: true
ingress_port: 17778
panel_icon: phu:telegram
panel_title: Telegram

ports:
  17778/tcp: 17778

ports_description:
  17778/tcp: Telegram Web-UI und REST-API

options:
  api_id: 0
  api_hash: ""
  phone_number: ""
  dark_mode: true
  download_media: false
  media_max_mb: 500
  video_max_mb: 50
  fetch_messages_limit: 50
  webhook_incoming: ""
  debug_mode: false
  ha_notifications: false
  ha_notifications_privacy: false
  ha_notifications_skip_bots: false
  ha_token: ""

schema:
  api_id: int
  api_hash: str
  phone_number: str
  dark_mode: bool
  download_media: bool
  media_max_mb: int?
  video_max_mb: int?
  fetch_messages_limit: int
  webhook_incoming: str?
  debug_mode: bool
  ha_notifications: bool
  ha_notifications_privacy: bool
  ha_notifications_skip_bots: bool
  ha_token: str?
