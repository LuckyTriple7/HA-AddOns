name: Telegram
description: Telegram als vollwertiger Client direkt in Home Assistant — mit Chat-UI, REST-API und Webhook-Support
version: "1.0.18"
slug: telegram
url: https://github.com/LuckyTriple7/HA-AddOns

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

ingress: true
ingress_port: 17778
panel_icon: phu:telegram
panel_title: Telegram

ports:
  17778/tcp: 17778

ports_description:
  17778/tcp: Telegram Web-UI und REST-API

options:
  api_id: 0
  api_hash: ""
  phone_number: ""
  dark_mode: true
  download_media: false
  fetch_messages_limit: 50
  webhook_incoming: ""
  debug_mode: false

schema:
  api_id: int
  api_hash: str
  phone_number: str
  dark_mode: bool
  download_media: bool
  fetch_messages_limit: int
  webhook_incoming: str?
  debug_mode: bool
