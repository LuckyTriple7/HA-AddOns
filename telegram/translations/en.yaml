configuration:
  api_enabled:
    name: REST API on a separate port
    description: "Also serves the REST API on port 17788. That port requires a token and has no web interface — unlike port 17778, which hands out both without any login. The port does not start unless an API token is set. To reach it from the LAN it must additionally be published under Network. Default: off."
  api_token:
    name: API token
    description: "Secret for the REST API on port 17788. Callers send it in the Authorization header with the value Bearer followed by the token. Choose something long and random, for example openssl rand -hex 32."
  api_id:
    name: API ID
    description: Numeric API ID from my.telegram.org → API development tools. Required to connect to Telegram.
  api_hash:
    name: API Hash
    description: API hash from my.telegram.org → API development tools. Required to connect to Telegram.
  phone_number:
    name: Phone Number
    description: Your Telegram phone number including country code (e.g. +4917612345678).
  dark_mode:
    name: Dark Mode
    description: Enable dark theme in the Web UI.
  download_media:
    name: Download Media
    description: Automatically download and display received photos and videos. Only works reliably for newly incoming messages, not for historical ones.
  media_max_mb:
    name: Media Storage Limit (MB)
    description: "Maximum size of the media folder in MB. When the limit is exceeded, the oldest files (photos, videos, voice messages) are automatically deleted until the folder shrinks back to 80 % of the limit. Default: 500 MB."
  video_max_mb:
    name: Max. Video Size (MB)
    description: "Maximum file size for downloadable videos in MB. Larger videos show a placeholder without download option. Default: 50 MB."
  fetch_messages_limit:
    name: Messages per Chat
    description: "Number of messages loaded when a chat is first opened. Recommended: 50. Maximum: 300."
  webhook_incoming:
    name: Webhook URL
    description: URL to forward incoming messages to (e.g. http://homeassistant:8123/api/webhook/telegram).
  debug_mode:
    name: Debug Mode
    description: Enable verbose logging. Useful for troubleshooting.
  ha_notifications:
    name: HA Notifications
    description: Show a persistent HA notification for each new incoming message (one per chat, overwritten by newer messages).
  ha_notifications_privacy:
    name: HA Notifications Privacy Mode
    description: When enabled, notifications only show "Telegram / New message" — no sender name or message content.
  ha_notifications_skip_bots:
    name: Skip Bot Notifications
    description: Do not show HA notifications for messages from bots.
