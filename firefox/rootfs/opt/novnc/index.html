<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
  // WebSocket-Pfad aus der aktuellen URL berechnen (nötig für HA Ingress)
  var base = window.location.pathname.replace(/[^\/]*$/, '').replace(/^\//, '');
  // resize=remote: noVNC passt Auflösung an Browser-Fenster an
  window.location.replace(
    'vnc.html?autoconnect=true&resize=remote&reconnect=true&reconnect_delay=2000&path=' + base
  );
</script>
</head>
</html>
