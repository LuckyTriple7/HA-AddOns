name: Firefox
description: Firefox-Browser direkt in Home Assistant — persistentes Profil, deutsche Sprache, optionale RAM-Begrenzung
version: "2.0.3"
slug: firefox
url: https://github.com/LuckyTriple7/HA-AddOns

arch:
  - amd64

startup: application
boot: manual
init: false
legacy: true

image: "ghcr.io/luckytriple7/firefox"

ingress: true
ingress_port: 5800
panel_icon: mdi:firefox
panel_title: Firefox

ports:
  5800/tcp: 5800

ports_description:
  5800/tcp: Firefox Web-UI (noVNC)

map:
  - share:rw

options:
  memory_limit_mb: 0

schema:
  memory_limit_mb: int?
